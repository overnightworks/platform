name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # The full matrix, which the part ai-gateway-outage joins, runs nightly on main and on demand.
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A run on main gets a group of its own, so it neither waits for nor is cancelled by another run: every landing is proven to its end.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Validate the Dependabot configuration against its schema
        run: uvx --no-build check-jsonschema@0.39.0 --builtin-schema vendor.dependabot .github/dependabot.yml

      - name: Check that every directory under apps/ has its Kustomization over it, every subdirectory of one whose kustomization.yaml is a Kustomization its own, and every one of those a directory
        # pipefail: a find or yq that fails after printing its names must fail the step, not pass the comparison. A
        # subdirectory that is a Component, as release is, is no layer.
        shell: bash
        run: |
          directories="$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n')"
          expected="$(for directory in $directories; do
            echo "$directory ./apps/$directory"
            for layer in apps/"$directory"/*/kustomization.yaml; do
              [ -e "$layer" ] || continue
              if [ "$(yq '.kind' "$layer")" = Kustomization ]; then
                subdirectory="$(basename "$(dirname "$layer")")"
                echo "$directory-$subdirectory ./apps/$directory/$subdirectory"
              fi
            done
          done | sort)"
          actual="$(yq --no-doc 'select(.kind == "Kustomization") | .metadata.name + " " + .spec.path' clusters/pc/apps.yaml | sort)"
          [ "$expected" = "$actual" ] || {
            echo "::error::apps/ and its layers hold [$(echo $expected)], clusters/pc/apps.yaml holds Kustomizations [$(echo $actual)]"
            exit 1
          }
          echo "each directory under apps/ and each layer in a subdirectory has its Kustomization: $(echo $expected)"

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check that part_closure.sh follows dependsOn and refuses an unknown part and a missing layer, and that the reconcile script refuses an unset or unknown CLUSTER_PART
        run: |
          mise exec -- tests/flux/part_closure_follows_dependson.sh
          mise exec -- tests/flux/reconcile_refuses_an_unset_or_unknown_part.sh

      - name: Check that the parts a run executes are core alone for a docs-only diff, those a changed layer or glob selects, and every part but the nightly-only ones for an unknown path, a zero base or a failing diff
        run: mise exec -- tests/flux/parts_for_paths_selects_by_changed_paths.sh

      - name: Check that every layer is in the closure of a part, that every glob of a part matches a tracked file, and that the check names each breach
        run: |
          mise exec -- tests/flux/every_layer_is_in_a_part.sh
          mise exec -- tests/flux/every_layer_is_in_a_part_names_each_breach.sh
          mise exec -- tests/flux/loki_readers_run_with_alloy.sh
          mise exec -- tests/flux/test_agent_parts_claim_the_keycloak_cells.sh

      - name: Check that the parts that run the backup cells apply every namespace that backs up, and that the check names one they leave out
        env:
          POSTGRES_BACKUP_COMPONENT: infrastructure/postgres/backup
        run: |
          mise exec -- tests/backup/backup_namespaces.sh --covered-by backup-1 backup-3
          mise exec -- tests/backup/backup_namespaces_are_covered_by_the_backup_parts_names_the_one_left_out.sh

      - name: Check that cutover:preflight names each missing precondition, exits 1, 3 or 2, writes its evidence only at 0 and makes only reads
        run: mise exec -- tests/cutover/preflight_names_each_missing_precondition.sh

      - name: Check that backup:now ends non-zero naming a Backup that failed or did not complete without a restore test Job, the Job it could not make or that failed after a Backup that succeeded, and refuses a namespace without exactly one Schedule or without the CronJob making no object
        run: mise exec -- tests/backup/backup_now_ends_non_zero_naming_a_failed_backup_or_the_job_it_could_not_make.sh

      - name: Check that backup:fetch ends non-zero naming a file that holds no custom-format dump and deletes it, and keeps a dump at mode 0600
        run: mise exec -- tests/backup/backup_fetch_deletes_a_file_that_holds_no_custom_format_dump.sh

      - name: Check that gpu:use orders its steps so speech always has a Ready pod, waits for each Deployment's ready replica, names the step and the way back of a failed wait, frees the card only from speech's state with the bound armed first, returns it only while nobody took it and refuses an unknown user
        run: mise exec -- tests/gpu/use_orders_the_switch_names_the_way_back_and_waits_for_the_ready_replica.sh

      - name: Check that admission:pause suspends app-attestations, scales Kyverno to 0 and deletes its webhooks by label in that order, that admission:resume restores without reading GitHub and removes only once the root applied main's head, and refuses otherwise, deleting nothing
        run: mise exec -- tests/admission/pause_and_resume_stop_and_restore_the_attestation_check.sh

      - name: Check that the anonymous-reader probe passes on a refused token and on a refused manifest, requests the manifest by its full digest and fails when the manifest is read
        run: mise exec -- tests/admission/anonymous_reader_is_refused_or_reads_nothing.sh

      - name: Check that offline suspends tunnel, scales cloudflared to 0 and deletes its Pods in that order and online clears the suspend and forces a reconcile, that each repeats to the same state, and that offline refuses with tunnel unreadable, changing nothing
        run: mise exec -- tests/cloudflared/offline_and_online_repeat_to_the_same_state.sh

      - name: Check that the inventory ids of Flux parse with a name of no, one or several colons, in a namespaced and a cluster-scoped object
        run: tests/workloads/inventory_ids_decode_colons_and_scopes.sh

      - name: Check that both speech pods mount /tmp, where an upload is spooled, as a memory-backed emptyDir
        run: mise exec -- tests/speech_runtime/upload_spool_is_memory_backed_in_both_speech_pods.sh

      - name: Check that the bridge of a speech GPU release raises the small image and waits for it Ready only while speech holds the card, lowers it only once the GPU pod runs the release and no newer release is pending, keeps a count that gpu:use set, decides again after a refused scale and fails after the third, and never scales the GPU image
        run: mise exec -- tests/speech_runtime/bridge_raises_the_cpu_voice_only_while_speech_holds_the_card.sh

      - name: Check that the Jobs bridge and settle carry the GPU image that speech-runtime-gpu renders, run no image of the app, mount a ConfigMap of their own layer rendered from the one script, and that the two layers render no object in common
        run: mise exec -- tests/speech_runtime/both_jobs_carry_the_rendered_gpu_release.sh

      - name: Check that cutover:load and cutover:check name each difference, print no value, exit 1 or 2 and make only the listed calls
        run: mise exec -- tests/cutover/load_and_check_name_each_difference_and_print_no_value.sh

      - name: Check that every secret and password in the realm files is an env reference
        run: >-
          mise exec -- tests/keycloak/realm_secrets_are_env_references.sh
          infrastructure/keycloak/realm.yaml infrastructure/keycloak/master.yaml

      - name: Check that every Service an Ingress routes to carries the same five sticky cookie annotations in every layer, and that the check names each breach
        run: mise exec -- tests/ingress/every_routed_service_carries_the_same_sticky_cookie.sh

      - name: Check that every name a manifest under apps/ hands under a REALM_ key is a plain value that the realm file declares and that is its app's own or the fleet's, that every key the realm file demands of an app is handed, and that the check names each breach
        run: mise exec -- tests/keycloak/handed_realm_names_are_declared.sh infrastructure/keycloak/realm.yaml

      - name: Check that check:secrets-expiry passes no annotated Secret and a date 31 days out and names each Secret within 30 days, past, unparseable or unlisted
        run: tests/secrets/expiry_check_names_each_breach.sh

      - name: Run the legal project's tests at 100 % branch coverage
        run: mise run legal:test

      - name: Keep the coverage report for the gate's sonar job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: src/legal/coverage.xml
          if-no-files-found: error

      - name: Check that legal:check passes hopin's legal files at the tag it runs, names file and line of a broken one and quotes no text
        run: mise exec -- tests/legal/legal_check_names_file_and_line_and_quotes_no_text.sh

      - name: Check that the app texts under infrastructure/legal equal their apps' files and dates at the release each names
        run: mise exec -- tests/legal/app_texts_equal_their_release.sh

      - name: Check that release:bump turns the newest app release into its Component, legal copies and rebuilt pages, treats the release main runs as a no-op, refuses an older version, an unknown name and a changed page set, fails without a patch when a legal step fails, and waits for an unfinished release
        run: mise exec -- tests/release_bump/compute_writes_the_release_tree_and_stops_where_it_cannot_settle.sh

      - name: Check that release:bump pushes release/<app> only when its patch differs or conflicts with main, keeps one pull request, closes it once main runs the release and calls nothing for an unfinished one
        run: mise exec -- tests/release_bump/publish_pushes_only_a_changed_patch_and_keeps_one_pull_request.sh

      - name: Check that mise run release:bump logs in to the registry under a temporary configuration, hands the token only through stdin and pushes nothing when repeated
        run: mise exec -- tests/release_bump/the_command_logs_in_under_a_temporary_config_and_leaves_no_token.sh

      - name: Check that release-bump-scope passes an allowed bump and every run that is no bump with one line, and is red for a script, another app's table or file, a name change, an older version, a deletion, a mode or type change, a rename out of a protected path, a head that replaces the guard and a base without the script
        run: mise exec -- tests/release_bump/the_guard_judges_a_bump_by_the_bases_script_and_passes_every_other_run.sh

      - name: Check that the design kit under infrastructure/design equals its release wheel and holds nothing else, and that infrastructure/legal/assets holds nothing else than legal-2.css
        run: tests/legal/design_assets_equal_their_release_wheel.sh

      - name: Check that a failed LiteLLM write stops the rest and names what was made, and that no key value reaches an argument or an output
        run: mise exec -- tests/litellm/failed_write_names_what_is_done.sh

      - name: Check that a failed or lost write of the admin budget, its group or its customer row names what may be written and a rerun completes it
        run: mise exec -- tests/litellm/admin_names_what_a_failed_write_may_have_left.sh

      - name: Check that live:check signs the test person in with its password on stdin only, leaves it signed out and disabled on every exit it can trap, names what a failed step may leave, cleans up an earlier run's leftovers first and refuses or skips with no write
        run: mise exec -- tests/keycloak/live_check_leaves_the_person_disabled_on_every_exit.sh

      - name: Check that the gateway probe answers on both routes and models, keeps its port-forward through its waits, deletes its keys on every exit and judges its budget, cache and cost answers by their evidence
        run: mise exec -- tests/litellm/gateway_probe_answers_on_both_routes_and_removes_its_keys.sh

      - name: Check that the gateway probe sends an 800k call only when the key's budget has room for its worst case, a stale cache and an unmeasured size included
        run: mise exec -- tests/litellm/gateway_probe_guard_prices_what_it_cannot_know_at_its_worst.sh

      - name: Check that the pinned LiteLLM image marks the provider request of a call with enable_prompt_caching true at the system text and the last message, and of one with false at nothing
        run: mise exec -- tests/litellm/key_caching_marks_the_provider_request.sh

      - name: Check that the pinned LiteLLM image sends the effort of each -medium and -low text name to Anthropic and lets a request's reasoning_effort outrank it
        run: mise exec -- tests/litellm/configured_effort_reaches_the_provider_request.sh

      - name: Check that GITHUB_META_TOKEN reaches only curl's stdin, stays anonymous when unset and is refused outside the token alphabet
        run: mise exec -- tests/secrets/github_meta_token_is_refused_or_reaches_only_curls_stdin.sh

      - name: Check that the Renovate report check fails naming a missing report, a report with no dependency and each missing or skipped pin
        run: tests/renovate/report_check_names_each_missing_pin.sh

      - name: Check that every pull layer mounts each app ref its app renders and every image volume of its Job, and that a missing ref and an unmounted volume fail
        run: mise exec -- tests/workloads/pull_layers_mount_every_app_ref_their_app_runs.sh

      - name: Check that the Deployments of the namespaces of hopin, songmaker, personas, skat, presentator, Keycloak and LiteLLM, a rollout's surge included, plus the backup stay within their Postgres' max_connections, and that a raised replica, surge or pool, a missing declaration and a lowered limit are each red
        run: mise exec -- tests/postgres/connections_stay_within_max_connections.sh apps/hopin apps/songmaker apps/personas apps/skat apps/presentator infrastructure/keycloak infrastructure/litellm

  # The legs of cluster: core and the parts the run's changed paths select, which tests/flux/parts.yaml owns. cluster is
  # never skipped, since the gate reads a skipped mandatory job as red, so a scope that selects nothing but core still has a leg.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      parts: ${{ steps.select.outputs.parts }}
    steps:
      - name: Check out with the history a push's diff needs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Select the parts this run executes
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_COMMIT: ${{ github.event.before }}
          HEAD_COMMIT: ${{ github.sha }}
        run: |
          # On a pull request the checkout is the merge commit, whose first parent is main.
          case "$EVENT_NAME" in
            schedule | workflow_dispatch) parts="$(mise exec -- tests/flux/parts_for_paths.sh --all)" ;;
            pull_request) parts="$(mise exec -- tests/flux/parts_for_paths.sh HEAD^1 HEAD)" ;;
            push) parts="$(mise exec -- tests/flux/parts_for_paths.sh "$BEFORE_COMMIT" "$HEAD_COMMIT")" ;;
            *)
              echo "::error::the event $EVENT_NAME selects no parts"
              exit 1
              ;;
          esac
          echo "the parts of this run: $parts"
          echo "parts=$parts" >> "$GITHUB_OUTPUT"

  cluster:
    needs: scope
    # The gate looks for the job name cluster, which a matrix value in the name would change, so the leg's part
    # stands in its first step's name and in CLUSTER_PART.
    name: ${{ github.job }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.scope.outputs.parts) }}
    runs-on: ubuntu-latest
    # A part carries cells for about 14 minutes at most, so the reconcile's wait, which varies by more than a minute, leaves the limit three minutes away on a slow runner.
    timeout-minutes: 17
    permissions:
      contents: read
      # The Secret ghcr-pull holds this job's token, which pulls the apps' private packages.
      packages: read
    defaults:
      run:
        # Every step after the bootstrap runs with the locked tools and the [env] of mise.toml.
        shell: mise exec -- bash --noprofile --norc -euo pipefail {0}
    env:
      # The commit the run's workflow comes from: the merge of the head into main on a pull request, main's commit on a
      # push. The job checks it out and serves it to Flux as the one branch of a repository on the runner.
      CANDIDATE_REVISION: ${{ github.sha }}
      CANDIDATE_BRANCH: candidate
      # The part this leg runs: it applies the layers tests/flux/parts.yaml names for it and what they depend on, and
      # core applies every layer. The overlay reads it, also when a cell applies it again.
      CLUSTER_PART: ${{ matrix.part }}
      CANDIDATE_SOURCE_PORT: "8081"
      CLUSTER_NAME: platform
      # The test agents whose P2 cells a part runs, by part name.
      TEST_AGENTS_BY_PART: '{"presentator": "agent-humboldt agent-curie", "agents": "agent-lovelace agent-hildegard"}'
      # The k3s configuration the PC and this cluster share.
      K3S_CONFIG_SOURCE: host/k3s/config.yaml
      # The k3d-managed registry serving the job's platform-secrets source: the cluster reaches it by its address on
      # the k3d network, the runner on localhost, both on this port.
      REGISTRY_NAME: platform-registry
      REGISTRY_PORT: "5000"
      # The dummy Secret the job encrypts, serves as platform-secrets and reads back decrypted.
      PROOF_SECRET_NAMESPACE: default
      PROOF_SECRET_NAME: decryption-proof
      # The client Pods' image: each sends its requests and is deleted after them.
      CLIENT_IMAGE: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
      # The image of the egress probe Pods and of B3's throwaway target; local-path's helper runs busybox too.
      PROBE_IMAGE: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      # A client Pod that Pod Security admits as restricted, as namespace cloudflared enforces: it prints the status of
      # each request to its URL, or 000 when no answer came, with @NAME@, @IMAGE@, @HOST@ and @URL@ replaced. A 429's
      # Retry-After would hold a retry for the whole rate-limit window, so --retry-max-time drops that retry.
      CLIENT_POD: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: @NAME@
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: client
              image: @IMAGE@
              args: [--silent, --output, /dev/null, --write-out, '%{http_code}', --max-time, '10', --retry, '5',
                --retry-connrefused, --retry-delay, '2', --retry-max-time, '30', --header, 'Host: @HOST@', '@URL@']
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
      # cloudflared's Namespace and the host its ingress names no rule for.
      TUNNEL_NAMESPACE: cloudflared
      UNROUTED_HOST: unrouted.invalid
      # The apps whose pull Secret and files the job's platform-secrets serves, by the names their Deployments read.
      APP_MANIFESTS: apps/hopin/hopin.yaml apps/personas/personas.yaml apps/presentator/web.yaml apps/speech-runtime/speech-runtime.yaml apps/speech-runtime/speech-runtime-gpu.yaml apps/skat/skat.yaml apps/songmaker/web.yaml apps/songmaker/music-worker.yaml apps/songmaker/scoring-worker.yaml apps/songmaker/acestep-worker.yaml
      # The Kustomization that serves the Secrets of every namespace, so that no other layer holds one of them.
      SECRETS_LAYER: flux-system/platform-secrets
      # The Postgres base the layers under infrastructure/ and apps/ include.
      POSTGRES_BASE: infrastructure/postgres
      # The object store's layer, whose Secret garage and whose buckets' Secrets object-store the job's platform-secrets serves.
      OBJECTSTORE_LAYER: infrastructure/objectstore
      # The component a Postgres layer includes to be backed up, and the rest-server it backs up to.
      POSTGRES_BACKUP_COMPONENT: infrastructure/postgres/backup
      # The component that holds the weekly Schedule every backed-up namespace gets.
      BACKUP_SCHEDULE_COMPONENT: infrastructure/backup/schedule
      REST_SERVER_MANIFEST: infrastructure/backup/rest-server.yaml
    steps:
      - name: Check out for the part ${{ matrix.part }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The served repository holds this commit with its history, since a shallow one cannot be pushed.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned tools
        shell: bash
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check that Docuum with the service's arguments deletes the least recently used unprotected image and keeps the rest
        if: matrix.part == 'backup-2'
        run: tests/disk/docuum_deletes_the_least_recently_used_unprotected_image.sh

      - name: Check that the bucket Component's rclone fails whole on a full disk and leaves no file at its final name and no partial
        if: matrix.part == 'backup-2'
        run: tests/backup/bucket_sync_fails_whole_on_a_full_disk.sh

      - name: Check that the bucket step fails when a key written during its sync stands in for a key the copy dropped
        if: matrix.part == 'backup-2'
        run: tests/backup/bucket_count_cannot_hide_a_key_the_copy_dropped.sh

      # Before the cluster exists, so a stale generated file fails here and never reaches Flux.
      - name: Compare the generated files with a fresh regeneration
        if: matrix.part == 'core'
        run: tests/generated/generated_files_match_regeneration.sh

      - name: Check Prometheus' rules and their tests with promtool from the rendered image
        if: matrix.part == 'core'
        run: tests/prometheus/rules_pass_promtool_and_their_tests.sh

      - name: Route Docker Hub pulls through the mirror and pull the registry image at its digest
        run: |
          # Google's public pull-through cache of Docker Hub needs no credential: the runner's Docker daemon and the
          # cluster's containerd ask it first, since the matrix parts share runner addresses Docker Hub rate-limits (429).
          mirror=https://mirror.gcr.io
          # k3d's registry, which k3d pulls as docker.io/library/registry:2 when the runner holds no such image.
          registry_image=docker.io/library/registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          # The mirror serves what it holds or fetches from Docker Hub itself. Containerd and Docker both fall back to
          # docker.io when the mirror fails or lacks an image, so a failing mirror costs the rate limit again, never a pull.
          sudo mkdir -p /etc/docker
          jq --null-input --arg mirror "$mirror" '{"registry-mirrors": [$mirror]}' |
            sudo tee /etc/docker/daemon.json >/dev/null
          sudo systemctl restart docker
          docker pull --quiet "$registry_image"
          # k3d pulls only an image it does not find under this name.
          docker tag "$registry_image" docker.io/library/registry:2
          printf 'mirrors:\n  docker.io:\n    endpoint:\n      - "%s"\n' "$mirror" > "$RUNNER_TEMP/registries.yaml"

      - name: Create the k3d cluster with its registry
        id: create-cluster
        run: |
          # k3d only warns about a missing volume source, and k3s would start on its defaults.
          [ -f "$K3S_CONFIG_SOURCE" ] || { echo "::error::$K3S_CONFIG_SOURCE is missing"; exit 1; }
          # The apps' images fill this disk: the app step prints it again after their pulls.
          df --human-readable /
          # The file alone at k3s's default path, the one the PC uses: k3d writes registries.yaml beside it.
          # k3d's DNS fix DNATs pod DNS to Docker's 127.0.0.11, which the kernel drops unless route_localnet is 1: the
          # shared file's iptables-localhost-nodeports=false keeps it 0, so CoreDNS would answer SERVFAIL.
          K3D_FIX_DNS=0 k3d cluster create "$CLUSTER_NAME" --image "rancher/k3s:${K3S_VERSION//+/-}" \
            --volume "$PWD/$K3S_CONFIG_SOURCE:/etc/rancher/k3s/config.yaml:ro@server:0" \
            --registry-config "$RUNNER_TEMP/registries.yaml" \
            --registry-create "${REGISTRY_NAME}:127.0.0.1:${REGISTRY_PORT}" --enforce-registry-port-match \
            --wait --timeout 3m

      - name: Apply the Flux controllers from the committed components
        run: |
          # The directory's render, as the PC applies it, so the controller starts with its patched arguments; its
          # GitRepository and root Kustomization are the candidate overlay's to apply.
          kubectl kustomize clusters/pc/flux-system |
            yq 'select(.kind != "GitRepository" and .kind != "Kustomization")' |
            kubectl apply --server-side -f -
          kubectl -n flux-system wait deployment --all --for=condition=Available --timeout=3m

      # flux install writes a binding subject for every controller, omitted ones included.
      - name: Assert that no binding names the removed helm-controller
        if: matrix.part == 'core'
        run: tests/flux/no_binding_names_helm_controller.sh

      - name: Check that secrets:github-host-keys passes only GitHub's own keys under github.com
        if: matrix.part == 'core'
        env:
          # GitHub answers 403 to anonymous meta reads once a runner address used up its hourly limit.
          GITHUB_META_TOKEN: ${{ github.token }}
        run: tests/secrets/github_host_keys_pass_only_githubs_own.sh

      - name: Check that secrets:new-key refuses a key directory not at 700, a present drill file and a regular file in the key path, and accepts a symlinked 700 key directory
        if: matrix.part == 'core'
        run: tests/secrets/new_key_refuses_unsafe_key_paths.sh

      - name: Check that bootstrap:secrets prints only its own lines and no key block for a source that turns Ready within the minute
        if: matrix.part == 'objectstore'
        run: tests/secrets/bootstrap_secrets.sh

      - name: Check that db:load-dump and interrupt_load.sh end as they owe where a command fails, a signal arrives or a table is empty
        if: matrix.part == 'objectstore'
        run: tests/postgres/load_dump.sh

      - name: Assert that k3s runs with host/k3s/config.yaml
        if: matrix.part == 'objectstore'
        run: tests/k3s/k3s_runs_with_the_host_config.sh

      - name: Assert that the kubelet keeps the configured log files, reopens a deleted pod log and never compresses one
        if: matrix.part == 'objectstore'
        run: tests/pod-logs/kubelet_keeps_reopens_and_never_compresses_logs.sh

      - name: Encrypt a dummy Secret and the app's Secrets to a throwaway age key
        env:
          # The apps' pull Secrets hold this job's own token, which GitHub masks; each app's package grants it Read.
          PULL_USER: ${{ github.actor }}
          PULL_TOKEN: ${{ github.token }}
          # The layers whose containers read Secrets by key, each of which gets a dummy per key.
          SECRET_KEY_LAYERS: infrastructure/gatus infrastructure/keycloak infrastructure/litellm infrastructure/prometheus
          # Kyverno's layer, whose policy names the pull Secret of its own copy.
          ATTESTATION_LAYER: infrastructure/app-attestations
        run: tests/secrets/encrypt_secrets_to_a_throwaway_age_key.sh

      - name: Push the encrypted Secrets and serve them as the job's platform-secrets source
        run: tests/secrets/serve_encrypted_secrets_as_platform_secrets.sh

      - name: Create the Secret sops-age with the task the PC bootstrap runs
        run: mise run secrets:age-secret "$AGE_KEY_FILE"

      - name: Dry-run the layer files on the API server
        run: kubectl apply --server-side --dry-run=server -f clusters/pc

      - name: Check that the committed root and tunnel carry no spec.patches
        run: tests/flux/root_and_tunnel_carry_no_spec_patches.sh

      - name: Serve the candidate commit to Flux
        run: tests/flux/serve_the_candidate_commit.sh

      - name: Reconcile the candidate tree
        run: tests/flux/reconcile_the_candidate_tree.sh

      - name: Assert that the part's layers are Ready and applied the candidate commit
        run: tests/flux/scoped_layers_reconcile_the_candidate.sh

      - name: Assert that the root's inventory and health checks hold, that Flux decrypted the dummy and that the root reverts a deleted NetworkPolicy
        if: matrix.part == 'core'
        run: tests/flux/flux_reconciled_the_candidate_and_decrypted_the_dummy.sh

      - name: Assert that a GitRepository at the committed root's url and branch turns Ready
        if: matrix.part == 'core'
        run: tests/flux/committed_source_url_turns_ready.sh

      # It scans every Service and Pod, so it runs where every layer is applied.
      - name: Assert that no HelmRelease or Traefik CRD exists, that Traefik is ClusterIP only, that no Service or Pod of the cluster is exposed on the node and that web trusts the nodes' pod CIDRs
        if: matrix.part == 'core'
        run: tests/ingress/the_cluster_exposes_only_traefik_and_trusts_the_pod_network.sh

      # It runs two nginx pods of legal's image in a throwaway namespace, so it needs only Traefik's layer, which core applies.
      - name: Assert that a second request with the cookie reaches the same one of two pods through Traefik, that the other pod's cookie reaches the other, and that the cookie carries the annotations' name and SameSite, Secure, HttpOnly and Path=/ and no Domain, Max-Age or Expires
        if: matrix.part == 'core'
        env:
          # The throwaway namespace of the two pods.
          STICKY_NAMESPACE: sticky-cookie-proof
        run: tests/ingress/a_second_request_with_the_cookie_reaches_the_same_pod.sh

      - name: Assert that Traefik answers only cloudflared's and Gatus's pods and routes hopin and skat, and that speech-runtime answers only its callers' pods
        if: matrix.part == 'access'
        env:
          # A client Pod's namespace that is neither Traefik's nor the tunnel's nor speech-runtime's callers', and the
          # host its Ingress routes.
          OTHER_NAMESPACE: ingress-client
          ROUTED_HOST: routed.invalid
          # The routed app's manifest, its setting of the proxies it trusts, its sign-in start and that path's budget per
          # client address, as hopin's config names them, and two documentation addresses (RFC 5737) a client names as
          # forwarded.
          ROUTED_APP_MANIFEST: apps/hopin/hopin.yaml
          TRUSTED_PROXIES_SETTING: HOPIN_TRUSTED_PROXIES
          SIGN_IN_PATH: /auth/start
          SIGN_IN_BUDGET: "40"
          # The same four for skat at the tag of its image in apps/skat/skat.yaml: SKAT_TRUSTED_PROXIES is read into
          # the setting `trusted_proxies`; AUTH_START_PATH and SIGN_IN_RATE_LIMIT_BUDGET (max_requests=40 per 10
          # minutes) are its constants, the budget applied to the start path in SIGN_IN_PATHS.browser_paths.
          ROUTED_APP_2_MANIFEST: apps/skat/skat.yaml
          ROUTED_APP_2_TRUSTED_PROXIES_SETTING: SKAT_TRUSTED_PROXIES
          ROUTED_APP_2_SIGN_IN_PATH: /auth/start
          ROUTED_APP_2_SIGN_IN_BUDGET: "40"
          FIRST_CLIENT_ADDRESS: 192.0.2.1
          SECOND_CLIENT_ADDRESS: 192.0.2.2
          # speech-runtime's Namespace and Service, and one namespace its NetworkPolicy admits.
          SPEECH_NAMESPACE: speech-runtime
          SPEECH_SERVICE: speech-runtime
          SPEECH_CALLER_NAMESPACE: hopin
        run: tests/ingress/traefik_answers_only_cloudflared_and_routes_the_app.sh

      - name: Assert that each app runs at its full app ref after platform-secrets, pulled through its pull Secret
        if: matrix.part == 'core'
        run: tests/workloads/apps_run_at_their_full_ref.sh

      - name: Assert that each pull layer applied the candidate before its app's layer, that its Job completed before the app's ReplicaSet was created and kept its pod, and that the app's pods found the image already present
        if: matrix.part == 'core'
        run: tests/workloads/pull_layers_finish_before_their_app_rolls.sh

      - name: Assert that Traefik refuses the back-channel logout path and its spellings on every routed host while a neighbouring path reaches the app, that the Service still answers it in-namespace, and that the refusal holds in a restarted pod
        if: matrix.part == 'core'
        env:
          SONGMAKER_NAMESPACE: songmaker
        run: tests/traefik/backchannel_logout_is_refused_at_the_edge.sh

      - name: Assert that every Deployment outside the system namespaces runs the digests it names
        if: matrix.part == 'core'
        env:
          POLICY_FILE: infrastructure/admission/image-policy.yaml
        run: tests/workloads/deployments_run_the_digests_they_name.sh

      - name: Assert that every workload layer depends on admission and was applied after it
        if: matrix.part == 'core'
        env:
          ROOT_LAYER: flux-system/flux-system
          ADMISSION_LAYER: flux-system/admission
          ATTESTATION_LAYER: flux-system/app-attestations
          NAMESPACES_LAYER: flux-system/namespaces
        run: tests/workloads/layers_depend_on_admission.sh

      - name: Probe the image policies by server-side dry-run
        if: matrix.part == 'core'
        env:
          # The policy covers this namespace like every other one; the step deletes it after the probes.
          PROBE_NAMESPACE: admission-probe
          POLICY_FILE: infrastructure/admission/image-policy.yaml
          VENDOR_LIST: infrastructure/admission/image-vendors.yaml
          ATTESTATION_POLICY_FILE: infrastructure/app-attestations/app-attestations.yaml
          FLUX_COMPONENTS_FILE: clusters/pc/flux-system/gotk-components.yaml
          FLUX_CONTROLLER: system:serviceaccount:flux-system:kustomize-controller
        run: tests/admission/image_policies_by_dry_run.sh

      - name: Assert that the attestation check binds the release script's issuer, signer and predicate, its webhooks exclude the system namespaces and its attestors are the live app refs' repositories
        if: matrix.part == 'core'
        env:
          ATTESTATION_LAYER: infrastructure/app-attestations
          VENDOR_LIST: infrastructure/admission/image-vendors.yaml
          POLICY_FILE: infrastructure/admission/image-policy.yaml
          RELEASE_SCRIPT: scripts/verify_image_release.sh
          ADMISSION_SCRIPT: scripts/pause_or_resume_attestation_check.sh
        run: tests/admission/app_attestations_bind_the_release_checks.sh

      - name: Assert that namespaces and tunnel applied the candidate and cloudflared runs at 0 replicas
        if: matrix.part == 'core'
        run: tests/cloudflared/tunnel_applied_at_zero_replicas.sh

      - name: Assert that taking the platform offline suspends tunnel and holds against the reconcile of the root, with no cloudflared Pod and no endpoint, and that online brings tunnel back at the candidate and Flux corrects a hand-made scale again
        if: matrix.part == 'core'
        env:
          ROOT_LAYER: flux-system/flux-system
          TUNNEL_LAYER: flux-system/tunnel
          OFFLINE_SCRIPT: scripts/take_platform_offline_or_online.sh
        run: tests/cloudflared/offline_holds_against_flux_and_online_brings_it_back.sh

      - name: Assert cloudflared's ingress from Pods built from its Deployment's template
        # Every host the tunnel names meets the Ingress of its layer, so the part applies them all.
        if: matrix.part == 'core'
        run: tests/cloudflared/ingress_from_pods_built_from_its_template.sh

      - name: P7a cells
        if: matrix.part == 'load-1'
        env:
          # The layer whose Kustomization the prune proof deletes and whose Postgres the loader proof loads.
          PROOF_LAYER: litellm
          # What a Postgres namespace's Kustomization waits for: admission for its workload, platform-secrets for its
          # password, storage for its claim.
          POSTGRES_LAYER_DEPENDENCIES: admission platform-secrets storage
          # Keycloak's namespace, whose egress policy the probe Pods meet, a Service every other Pod reaches and a host
          # outside the cluster.
          EGRESS_NAMESPACE: keycloak
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/postgres/postgres_storage_prune_load_and_egress.sh

      - name: P7a foreign-session and interrupt cells
        if: matrix.part == 'load-3'
        env:
          # The layer whose Postgres the loader proof loads.
          PROOF_LAYER: litellm
        run: tests/postgres/load_dump_refuses_a_foreign_session_and_suspension_and_survives_interrupts.sh

      - name: Assert that songmaker's Postgres is Ready and non-root and closed to other namespaces
        if: matrix.part == 'load-1'
        env:
          SONGMAKER_NAMESPACE: songmaker
          # The throwaway namespace of the Pod that must get no answer.
          OTHER_NAMESPACE: songmaker-client
        run: tests/songmaker/postgres_is_ready_non_root_and_closed.sh

      - name: Assert that the Redis base runs non-root, evicts nothing, forgets on restart and answers only its namespace on songmaker's instance
        if: matrix.part == 'load-2'
        env:
          APP_NAMESPACE: songmaker
          # The throwaway namespace of the Pod that must get no answer.
          OTHER_NAMESPACE: redis-client
        run: tests/redis/instance_runs_non_root_evicts_nothing_forgets_on_restart_and_answers_only_its_namespace.sh

      - name: Assert that the Redis base runs non-root, evicts nothing, forgets on restart and answers only its namespace on hopin's instance
        if: matrix.part == 'load-2'
        env:
          APP_NAMESPACE: hopin
          # The throwaway namespace of the Pod that must get no answer.
          OTHER_NAMESPACE: redis-client-hopin
        run: tests/redis/instance_runs_non_root_evicts_nothing_forgets_on_restart_and_answers_only_its_namespace.sh

      - name: Assert that hopin's HOPIN_REDIS_URL names its Redis Service and port
        if: matrix.part == 'load-2'
        env:
          APP_NAMESPACE: hopin
          APP_DEPLOYMENT: hopin
          APP_CONTAINER: hopin
          REDIS_URL_VARIABLE: HOPIN_REDIS_URL
        run: tests/redis/app_url_names_the_redis_service_in_its_namespace.sh

      - name: Assert that skat's SKAT_REDIS_URL names its Redis Service and port
        if: matrix.part == 'load-2'
        env:
          APP_NAMESPACE: skat
          APP_DEPLOYMENT: skat
          APP_CONTAINER: skat
          REDIS_URL_VARIABLE: SKAT_REDIS_URL
        run: tests/redis/app_url_names_the_redis_service_in_its_namespace.sh

      - name: Assert that songmaker's web is Ready at its full ref on the base's Postgres, closed to other namespaces, read-only and holds its audio claim
        if: matrix.part == 'load-1'
        env:
          SONGMAKER_NAMESPACE: songmaker
          # The throwaway namespace of the Pod that must get no answer.
          OTHER_NAMESPACE: songmaker-web-client
        run: tests/songmaker/web_serves_closed_and_holds_its_audio.sh

      - name: Assert that songmaker's route reaches its web through Traefik for the tunnel's Pods, that the web answers the host the GPU worker sends and refuses another, that its back-channel logout answers a malformed token with 400 inside the namespace and no request through Traefik reaches it, and that a Pod in another namespace gets no answer
        if: matrix.part == 'load-1'
        env:
          SONGMAKER_NAMESPACE: songmaker
          # The throwaway namespace of the Pod that must get no answer.
          OTHER_NAMESPACE: songmaker-route-client
        run: tests/songmaker/route_reaches_the_web.sh

      - name: Assert that the layer nvidia is Ready with its DaemonSet scheduled nowhere, offers the RuntimeClass, holds only the plugin in a Namespace without a Pod Security label, and that a restricted Pod with the class passes dry-run
        if: matrix.part == 'load-1'
        env:
          NVIDIA_NAMESPACE: nvidia
          # The throwaway Namespace that enforces restricted, which the dry-run Pod meets.
          RESTRICTED_NAMESPACE: nvidia-restricted
        run: tests/nvidia/layer_offers_the_class_and_judges_a_restricted_pod.sh

      - name: P7b cells
        if: matrix.part == 'access'
        env:
          KEYCLOAK_NAMESPACE: keycloak
          # The realm files config-cli applies, whose groups and service accounts the cells read, and the client whose
          # login page they open.
          REALM_FILE: infrastructure/keycloak/realm.yaml
          MASTER_FILE: infrastructure/keycloak/master.yaml
          LOGIN_CLIENT: hopin
          # A group no realm file declares, which an empty database must not hold.
          RETIRED_GROUP: /services/agent-service/api
          # An app's manifest whose namespace must not reach Keycloak and whose namespace Keycloak must not reach beyond
          # the app's own pods, the latter through a throwaway target on the app's port without its labels; a Service
          # no ingress policy guards and a host outside the cluster, neither of which Keycloak reaches.
          CALLER_MANIFEST: apps/skat/skat.yaml
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/keycloak/realm_route_and_policies.sh

      - name: Assert that a request to Keycloak with a traceparent and a query leaves an access line with its method, path and status and the caller's trace id, and that no log line holds the query
        if: matrix.part == 'access'
        env:
          KEYCLOAK_NAMESPACE: keycloak
          REALM_FILE: infrastructure/keycloak/realm.yaml
        run: tests/keycloak/access_line_carries_the_callers_trace_id_and_no_query.sh

      - name: P2 cells
        if: matrix.part == 'access'
        env:
          KEYCLOAK_NAMESPACE: keycloak
          REALM_FILE: infrastructure/keycloak/realm.yaml
          # The agent client whose tokens the cells mint, and the allowlist of its service account's groups; the second
          # agent runs in the step below.
          AGENT_CLIENT: agent-mozart
          AGENT_GROUPS: /agents /apps/hopin /apps/hopin/mcp /apps/skat/mcp /apps/songmaker/mcp /agent-owners /services/speech-service /services/video-service
          # The client that exchanges an agent's token, the scopes it asks for, each adding one service's audience, and a client
          # that must be refused.
          EXCHANGING_CLIENT: hopin
          EXCHANGE_SCOPES: speech-service-audience video-service-audience
          REFUSED_CLIENT: presentator
          # The ref whose merge base holds the realm file a person's token is compared with.
          BASE_REF: origin/main
        run: |
          tests/keycloak/agent_owner_names_what_a_failed_write_left.sh
          tests/keycloak/agent_client_tokens_and_groups.sh
          tests/keycloak/hopin_exchanges_an_agent_token_for_each_service_audience.sh
          tests/keycloak/access_tokens_hold_no_profile_or_email_claim.sh

      # The second agent's run of the cells, in the part agents: the access part's time limit holds no second run.
      - name: P2 cells for the second agent
        if: matrix.part == 'agents'
        env:
          KEYCLOAK_NAMESPACE: keycloak
          REALM_FILE: infrastructure/keycloak/realm.yaml
          AGENT_CLIENT: agent-leonardo
          AGENT_GROUPS: /agents /apps/hopin /apps/hopin/mcp /apps/skat/mcp /apps/songmaker/mcp /agent-owners /services/speech-service /services/video-service
          EXCHANGING_CLIENT: hopin
          EXCHANGE_SCOPES: speech-service-audience video-service-audience
          REFUSED_CLIENT: presentator
          BASE_REF: origin/main
        run: |
          tests/keycloak/agent_client_tokens_and_groups.sh
          tests/keycloak/hopin_exchanges_an_agent_token_for_each_service_audience.sh

      # The four test agents' runs of the same cells, which share Mozart's declaration and allowlist. A run takes
      # about two minutes, so they stand in the parts agents and presentator, none with more than two.
      - name: P2 cells for the test agents
        if: fromJSON(env.TEST_AGENTS_BY_PART)[matrix.part] != null
        env:
          KEYCLOAK_NAMESPACE: keycloak
          REALM_FILE: infrastructure/keycloak/realm.yaml
          TEST_AGENTS: ${{ fromJSON(env.TEST_AGENTS_BY_PART)[matrix.part] }}
          AGENT_GROUPS: /agents /apps/hopin /apps/hopin/mcp /apps/skat/mcp /apps/songmaker/mcp /agent-owners /services/speech-service /services/video-service
          EXCHANGING_CLIENT: hopin
          EXCHANGE_SCOPES: speech-service-audience video-service-audience
          REFUSED_CLIENT: presentator
          BASE_REF: origin/main
        run: |
          for AGENT_CLIENT in $TEST_AGENTS; do
            export AGENT_CLIENT
            tests/keycloak/agent_client_tokens_and_groups.sh
            tests/keycloak/hopin_exchanges_an_agent_token_for_each_service_audience.sh
          done

      - name: Assert that cutover:load refuses the cluster's own Keycloak dump, naming agent_owner and the platform's six objects, before it loads anything
        if: matrix.part == 'access'
        env:
          KEYCLOAK_NAMESPACE: keycloak
        run: tests/cutover/load_refuses_a_real_keycloak_dump_naming_its_platform_objects.sh

      - name: P7c cells
        if: matrix.part == 'litellm'
        env:
          # LiteLLM's namespace, an app namespace its front admits, a namespace it does not, and an SNI no router of
          # agent-egress allows.
          LITELLM_NAMESPACE: litellm
          APP_NAMESPACE: hopin
          OTHER_NAMESPACE: litellm-client
          THIRD_SNI: third.invalid
        run: tests/litellm/front_key_check_routing_and_provider_egress.sh

      - name: Assert that Alertmanager runs on a finished file, is found by Prometheus, refuses bad values, makes at most one send per flush of a fired alert, answers only its readers and Prometheus drops a Flux Pod that is not running
        if: matrix.part == 'observability'
        env:
          PROMETHEUS_NAMESPACE: prometheus
          # The namespace of the readers the policy admits, and the throwaway one of the stranger.
          READER_NAMESPACE: gatus
          OTHER_NAMESPACE: alertmanager-client
        run: tests/prometheus/alertmanager_mails_by_a_finished_file_and_answers_only_its_readers.sh

      - name: Assert that Grafana answers a query through both data sources at the address grafana:open printed, holds no state and answers only Gatus's pods
        if: matrix.part == 'observability'
        env:
          GRAFANA_NAMESPACE: grafana
          LOKI_NAMESPACE: loki
          PROMETHEUS_NAMESPACE: prometheus
          # Grafana's one admitted sender, the throwaway namespace of a Pod that is not, a Service every other Pod
          # reaches and a host outside the cluster.
          GATUS_NAMESPACE: gatus
          OTHER_NAMESPACE: grafana-client
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/grafana/grafana_answers_both_data_sources_without_state_and_only_gatus_reaches_it.sh

      - name: Assert that a Pod of presentator's worker template takes its init container's rules, so that it answers one port and sends nothing off the loopback, that its key is root's at mode 0400, and that the NetworkPolicy build-worker admits only the web
        if: matrix.part == 'apps'
        env:
          NO_NETWORK_NAMESPACE: no-network
        run: tests/no_network/worker_pod_reaches_only_its_port_and_the_loopback.sh

      - name: Assert that songmaker's music and scoring workers are Ready at their full refs, that neither asks for the GPU, and that the scoring worker reaches only its Postgres and Redis
        if: matrix.part == 'apps'
        env:
          SONGMAKER_NAMESPACE: songmaker
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/songmaker/workers_are_ready_at_their_full_ref_and_scoring_reaches_only_its_stores.sh

      - name: Assert that Keycloak's container gets 400 for a malformed logout token at each back-channel URL the realm holds and a Pod beside it without its labels gets no answer
        if: matrix.part == 'apps'
        env:
          KEYCLOAK_NAMESPACE: keycloak
          REALM_FILE: infrastructure/keycloak/realm.yaml
          # The files that hold the apps' side of the pair and Keycloak's, whose policies the cell names.
          POLICY_MANIFESTS: apps/hopin/hopin.yaml apps/presentator/web.yaml apps/skat/skat.yaml apps/songmaker/web.yaml infrastructure/keycloak/keycloak-egress.yaml
        run: tests/keycloak/backchannel_reaches_only_its_apps.sh

      - name: Assert that personas migrate, run through the runner's policy, fills the first key table of personas' Postgres for the restore test below
        if: matrix.part == 'backup-1'
        env:
          PERSONAS_NAMESPACE: personas
        run: tests/personas/migrate_through_the_runners_policy_fills_the_key_tables.sh

      - name: Assert that a Deployment made from personas' committed manifest has both pods Ready on a configuration that calls nothing outside, and that a rollout restart keeps every replica available through every reported status
        if: matrix.part == 'backup-1'
        env:
          PERSONAS_NAMESPACE: personas
          PERSONAS_MANIFEST: apps/personas/personas.yaml
          PERSONAS_CONFIG_FILE: apps/personas/personas.toml
        run: tests/personas/two_pods_are_ready_and_a_rollout_keeps_both_available.sh

      - name: P7d cells
        if: matrix.part == 'backup-1' || matrix.part == 'backup-3'
        env:
          # The Kustomization and Namespace of the rest-server, a namespace with no repository, which gets no answer, and a
          # Keycloak table its realm leaves empty.
          BACKUP_LAYER: backup
          SONGMAKER_NAMESPACE: songmaker
          LITELLM_NAMESPACE: litellm
          OUTSIDE_NAMESPACE: prometheus
          EMPTY_KEY_NAMESPACE: keycloak
          EMPTY_KEY_TABLE: broker_link
          VENDOR_LIST: infrastructure/admission/image-vendors.yaml
        run: tests/backup/backup_restores_keeps_repositories_apart_and_prunes_by_the_rule.sh
      - name: P7d songmaker cells
        if: matrix.part == 'backup-3'
        env:
          SONGMAKER_NAMESPACE: songmaker
        run: tests/backup/songmaker_dump_comes_from_the_pre_backup_pod_and_every_restore_test_reads_it_by_path.sh
      - name: P7d staging cells
        if: matrix.part == 'backup-2'
        env:
          SONGMAKER_NAMESPACE: songmaker
          APP_MANIFEST: apps/songmaker/web.yaml
        run: tests/backup/staging_snapshot_holds_the_files_the_bucket_and_the_dump_of_one_run.sh
      - name: P7d bucket cells
        if: matrix.part == 'backup-4'
        env:
          SONGMAKER_NAMESPACE: songmaker
          APP_MANIFEST: apps/songmaker/web.yaml
        run: tests/backup/bucket_refuses_what_it_cannot_stage_whole.sh
      - name: P9f cells
        if: matrix.part == 'backup-1' || matrix.part == 'backup-3'
        env:
          PROMETHEUS_NAMESPACE: prometheus
        run: tests/prometheus/backup_alerts_read_every_schedule_and_namespace.sh
      - name: P9c-2 cells
        if: matrix.part == 'litellm'
        env:
          LITELLM_NAMESPACE: litellm
          KEYCLOAK_NAMESPACE: keycloak
          REALM_FILE: infrastructure/keycloak/realm.yaml
        run: tests/litellm/admin_budget_follows_the_fingerprint_and_keeps_spend.sh
      - name: P9b cells
        if: matrix.part == 'access'
        env:
          LITELLM_NAMESPACE: litellm
        run: tests/litellm/expire_deletes_only_what_is_past_90_days.sh

      # The step suspends the Kustomization litellm, which would otherwise restore the table it changes.
      - name: P9c cells
        if: matrix.part == 'litellm'
        env:
          LITELLM_NAMESPACE: litellm
          APP_NAMESPACE: hopin
        run: tests/litellm/keys_table_drives_budgets_and_the_app_key.sh

      - name: Assert that presentator's web and its pull layer's Job pass restricted, its worker baseline without its init's NET_ADMIN, nothing else runs looser, and its render holds the contract
        if: matrix.part == 'presentator-2'
        run: |
          kubectl kustomize apps/presentator >"$RUNNER_TEMP/presentator.yaml"
          kubectl kustomize apps/presentator/pull >"$RUNNER_TEMP/presentator-pull.yaml"
          tests/presentator/pods_stay_within_their_levels.sh "$RUNNER_TEMP/presentator.yaml" "$RUNNER_TEMP/presentator-pull.yaml"

      - name: Probe the attestation check by server-side dry-run, in place, beside a second policy, and Kyverno's Service from a vendor-image Pod
        if: matrix.part == 'presentator-2'
        env:
          PROBE_NAMESPACE: attestation-probe
          ATTESTATION_LAYER: infrastructure/app-attestations
          HOPIN_RELEASE: apps/hopin/release/kustomization.yaml
          LIVE_APP_NAMESPACE: presentator
        run: tests/admission/app_attestations_refuse_by_dry_run.sh

      - name: Assert that a reconcile of the root Kustomization leaves a paused attestation check paused, with app-attestations suspended, Kyverno at 0 replicas and none of its webhook configurations back
        if: matrix.part == 'presentator-2'
        env:
          ROOT_LAYER: flux-system/flux-system
          ATTESTATION_LAYER: flux-system/app-attestations
          ADMISSION_SCRIPT: scripts/pause_or_resume_attestation_check.sh
        run: tests/admission/pause_survives_the_root_reconcile.sh

      - name: Assert that speech's CPU image runs two Ready pods behind its Service, each answering its readiness check, and that a rollout restart keeps a Ready endpoint
        if: matrix.part == 'presentator-2'
        run: tests/speech_runtime/two_cpu_pods_serve_behind_the_service.sh

      # Last of its part: the cell leaves presentator on a release that may not start, so no step after it reads presentator.
      - name: Assert that a release with a changed reference replaces the pull layer's Job, that the app's layer creates its new pods only after the new Job completed and that they find the image already present
        if: matrix.part == 'presentator-2'
        run: tests/workloads/a_changed_release_replaces_its_pull_job_and_the_app_waits_for_it.sh presentator

      - name: Assert that presentator's Namespace enforces nothing and warns and audits at restricted, and that no Pod template of a layer runs as 61001 or 61002
        if: matrix.part == 'apps'
        run: tests/presentator/namespace_warns_at_restricted_and_no_template_takes_its_uids.sh

      - name: Assert that a Pod beside cloudflared gets presentator's health answer through Traefik for each host its Ingress routes, that the tunnel sends each of them to Traefik, that its Ingress holds exactly the web's two origins and that no Pod reaches its Service directly
        if: matrix.part == 'apps'
        env:
          # A namespace that is neither Traefik's nor the tunnel's, created and deleted by the cell.
          OTHER_NAMESPACE: presentator-client
        run: tests/presentator/web_answers_only_through_traefik.sh

      - name: Assert that presentator's Postgres is Ready, that the web connects to its Service and its Pod, and that neither sealed build worker connects to either
        if: matrix.part == 'presentator'
        run: tests/presentator/postgres_is_reached_by_the_web_and_never_by_the_sealed_worker.sh

      - name: Assert that presentator's web is Ready on its Postgres, that its init container migrate ended 0 with the same two database variables, and that alembic_version holds one row
        if: matrix.part == 'presentator'
        run: tests/presentator/the_web_serves_from_its_postgres.sh

      - name: Assert that presentator's PRESENTATOR_REDIS_URL names its Redis Service and port
        if: matrix.part == 'presentator'
        env:
          APP_NAMESPACE: presentator
          APP_DEPLOYMENT: web
          APP_CONTAINER: web
          REDIS_URL_VARIABLE: PRESENTATOR_REDIS_URL
        run: tests/redis/app_url_names_the_redis_service_in_its_namespace.sh

      - name: Assert that presentator's two build workers are Ready behind the Service build-worker with the web's key file at mode 0400 as root's, and that the web alone connects to a worker
        if: matrix.part == 'presentator'
        run: tests/presentator/build_workers_are_two_pods_behind_one_service_with_one_key.sh

      - name: Assert that every exit of presentator's worker container gives a fresh pod, that a running pod is left alone, that an exit loop makes one pod at a time and leaves the node as it was, and that a removed sandbox ends in a fresh pod
        if: matrix.part == 'presentator'
        run: tests/presentator/a_used_worker_pod_is_replaced_by_a_fresh_one.sh

      # The step changes songmaker's database and audio claim, which no later step of this part reads.
      - name: P7f cells
        if: matrix.part == 'observability-2'
        env:
          SONGMAKER_NAMESPACE: songmaker
        run: tests/backup/load_replaces_database_and_files_together.sh

      - name: Assert that a Pod furnished as presentator's web reaches its bucket in the object store with the contract's environment alone and no other bucket, that only such Pods reach the S3 port and none the admin port, that a second run of the Job apply changes nothing, a rotated key loses its access and a backup key that only reads
        if: matrix.part == 'objectstore'
        env:
          APP_NAMESPACE: presentator
          APP_MANIFEST: apps/presentator/web.yaml
          # A namespace for the Pods that are no app's.
          OTHER_NAMESPACE: objectstore-client
        run: tests/objectstore/bucket_key_reaches_only_its_bucket.sh

      - name: Assert that a Pod furnished as songmaker's web reaches its bucket in the object store with the contract's environment alone and no other bucket, that only such Pods reach the S3 port and none the admin port, that a second run of the Job apply changes nothing, a rotated key loses its access and a backup key that only reads
        if: matrix.part == 'objectstore'
        env:
          APP_NAMESPACE: songmaker
          APP_MANIFEST: apps/songmaker/web.yaml
          OTHER_NAMESPACE: objectstore-client
        run: tests/objectstore/bucket_key_reaches_only_its_bucket.sh

      - name: Assert that the three legal pages and every asset reach a Pod beside cloudflared through Traefik with the committed bytes and headers, /favicon.ico and the asset directories get nginx's 404 and everything else Traefik's
        if: matrix.part == 'apps'
        env:
          LEGAL_NAMESPACE: legal
          LEGAL_LAYER_DIRECTORY: infrastructure/legal
          DESIGN_DIRECTORY: infrastructure/design
          LEGAL_HOST: hallucinai.de
          OTHER_NAMESPACE: legal-client
        run: tests/legal/five_paths_through_traefik.sh

      - name: Assert that Loki keeps a pushed line for LogQL, deletes after at most 28 days, answers only its two namespaces and keeps its claim
        if: matrix.part == 'apps'
        env:
          LOKI_NAMESPACE: loki
          # Loki's admitted sender, the Namespace of the layer alloy, and the throwaway namespace of one that is not.
          WRITER_NAMESPACE: alloy
          OTHER_NAMESPACE: loki-client
        run: tests/loki/loki_keeps_lines_under_28_days.sh

      - name: Assert that Gatus shows every endpoint healthy, shows a stopped service unhealthy and healthy again, and answers no Pod
        if: matrix.part == 'observability-2'
        env:
          # The service the cell stops and restores, by its Namespace, Deployment and Gatus endpoint, and a namespace for
          # the Pod that must get no answer.
          STOPPED_NAMESPACE: speech-runtime
          STOPPED_DEPLOYMENT: speech-runtime
          STOPPED_ENDPOINT: speech
          # The endpoint that asks cloudflared's readiness.
          TUNNEL_ENDPOINT: tunnel
          OTHER_NAMESPACE: gatus-client
          PROMETHEUS_NAMESPACE: prometheus
        run: tests/gatus/gatus_shows_each_service_and_only_the_pc_reaches_it.sh

      - name: Assert that Alloy ships a pod's line to Loki with three labels, holds one ClusterRole with exactly two rules and answers nobody
        if: matrix.part == 'apps'
        env:
          ALLOY_NAMESPACE: alloy
          LOKI_NAMESPACE: loki
          # The namespace of the throwaway Pod that logs the nonce, and the throwaway namespace of the Pod Alloy never answers.
          SOURCE_NAMESPACE: hopin
          OTHER_NAMESPACE: alloy-client
        run: tests/alloy/alloy_ships_pod_lines_to_loki.sh

      - name: Assert that Prometheus scrapes every target and Flux's Kustomizations, goes pending on real failures, answers only its readers and keeps its claim
        if: matrix.part == 'observability'
        env:
          PROMETHEUS_NAMESPACE: prometheus
          # The namespace of a reader the NetworkPolicy admits, which the layer owns, then the throwaway namespace the step
          # creates and removes, one that is not admitted and holds the Deployment at a dead image, and the Kustomization at
          # a missing path.
          READER_NAMESPACE: grafana
          OTHER_NAMESPACE: prometheus-probe
          BROKEN_KUSTOMIZATION: prometheus-probe
          # The suspended CronJob in that namespace whose Job exits 1.
          FAILING_CRONJOB: prometheus-probe
        run: tests/prometheus/prometheus_sees_every_layer_and_answers_only_its_readers.sh

      # The part holds only this cell, which waits out the rule's `for`, shortened to two minutes in this cluster, beside no other cell.
      - name: Assert that Prometheus reads Gatus' probe of the AI gateway and that a failing probe fires its alert to the mail receiver and clears with the probe
        if: matrix.part == 'ai-gateway-outage'
        env:
          PROMETHEUS_NAMESPACE: prometheus
          # The gateway the cell stops and restores, by its Namespace, Deployment and Gatus endpoint, and the Kustomization
          # of its layer that the cell suspends meanwhile.
          GATEWAY_NAMESPACE: litellm
          GATEWAY_DEPLOYMENT: litellm-front
          GATEWAY_ENDPOINT: litellm
          GATEWAY_KUSTOMIZATION: litellm
          # The Kustomization of the layer that holds the rule, which the cell suspends while it shortens the rule.
          PROMETHEUS_KUSTOMIZATION: prometheus
        run: tests/prometheus/ai_gateway_probe_failure_fires_the_alert_to_the_mail_receiver_and_clears.sh

      - name: Print Flux's state and the controllers' errors
        if: failure() && steps.create-cluster.outcome == 'success'
        run: tests/flux/print_flux_state.sh

      # Flux fetches from the server every minute until the job ends.
      - name: Stop the candidate server
        if: always()
        run: tests/flux/stop_the_candidate_server.sh

  bootstrap:
    runs-on: ubuntu-latest
    # A bare image, as on a fresh machine: the first-run prerequisites are the only step before the script.
    container: ubuntu:26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # runtime-install: the job proves the first run on a fresh system, so it installs what that system lacks
      - name: Install the first-run prerequisites
        run: |
          # Settings for every apt call of the job, the tests' installs included. The runners sit in Azure's
          # network, so the archive and the security pocket come from Azure's mirror, which answers them; a
          # hanging archive fails the step after the 20-second timeout and 5 retries, not at the job's timeout.
          sed -i -E 's#(https?)://(archive|security)\.ubuntu\.com/ubuntu/?#\1://azure.archive.ubuntu.com/ubuntu#' \
            /etc/apt/sources.list.d/ubuntu.sources
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' \
            > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git
          # The bare image has no CA certificates, so the first install runs over apt's signed plain transport;
          # every later call uses TLS.
          sed -i -E 's#^(URIs: .*)\bhttp:#\1https:#' /etc/apt/sources.list.d/ubuntu.sources
          apt-get update

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools and write the commit hooks
        run: scripts/bootstrap_pc.sh --only tools,dotfiles

      - name: Assert that every locked tool is installed and runs
        run: tests/bootstrap/every_locked_tool_runs.sh

      - name: Run the script again and assert that it changes nothing
        run: tests/bootstrap/second_run_changes_nothing.sh

      - name: Check that the committed tmpfiles line deletes a pod log by its creation time, with its emptied directories
        run: tests/pod-logs/tmpfiles_line_deletes_a_log_by_creation_time.sh

      - name: Check that check-pod-logs passes fresh logs and names each breach it can see without a month's wait
        run: tests/pod-logs/check_pod_logs_names_each_breach.sh

      - name: Check that the committed tmpfiles line deletes an old Codex session and keeps a Claude session
        run: tests/disk/tmpfiles_line_deletes_old_codex_sessions_and_keeps_claude_sessions.sh

      - name: Check that the Trash unit's gtrash deletes an entry trashed 31 days ago and keeps a directory trashed yesterday and an entry without a .trashinfo
        run: tests/disk/gtrash_prune_deletes_old_trash_entries_and_keeps_the_rest.sh

      - name: Check that mise run disk names its table and warns at 85 % and not at 84 %
        run: tests/disk/mise_disk_warns_from_85_percent.sh

      - name: Check that the journal's drop-in is read by systemd, its limits add up to under 30 days and its notification names a declared service
        run: tests/journald/retention_drop_in_keeps_every_entry_under_30_days.sh

      - name: Check that the dotfiles step writes both commit hooks as mode 755 and leaves core.hooksPath unset
        run: tests/bootstrap/dotfiles_write_both_hooks_with_mode_755.sh

      - name: Check that core.hooksPath stays unset when quality cannot be installed
        run: tests/bootstrap/hooks_path_stays_unset_when_quality_cannot_install.sh

      - name: Check that bootstrap:hook installs quality at the gate pin with its engines and sets core.hooksPath
        run: tests/bootstrap/bootstrap_hook_installs_quality_at_the_gate_pin_and_sets_hooks_path.sh

      - name: Check that the hook refuses a commit that stages a dummy secret
        run: tests/bootstrap/hook_refuses_a_commit_staging_a_dummy_secret.sh

      - name: Check that the hook refuses a merge commit that stages a dummy secret
        run: tests/bootstrap/hook_refuses_a_merge_commit_staging_a_dummy_secret.sh

      - name: Check that the hook passes a clean commit and a clean merge commit
        run: tests/bootstrap/hook_passes_a_clean_commit_and_a_clean_merge_commit.sh

      - name: Check that the hook runs the repository's hook and scans again after it
        run: tests/bootstrap/hook_runs_the_repository_hook_and_scans_again_after_it.sh

      - name: Check that the hook blocks the commit with exit 2 when quality is missing
        run: tests/bootstrap/hook_blocks_the_commit_with_exit_2_when_quality_is_missing.sh

      - name: Run the dotfiles step and bootstrap:hook again and assert that they change nothing
        run: tests/bootstrap/hook_second_run_changes_nothing.sh

  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the GitHub settings root against its lock and mocked tests
        run: mise run github:test

      - name: Check the Cloudflare root against its lock and mocked tests and that its token reaches no argument, environment or trace
        run: mise run cloudflare:test

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      # The image the render runs in without network, by the digest of its multi-arch index; flux2 is a static binary,
      # mounted from the lock and run as the container's entrypoint.
      RENDER_IMAGE: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # gh reads an image's digest from the registry with Docker's keychain; the token reaches it only through stdin.
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Render the tree and judge every image
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- scripts/verify_image_release.sh

      - name: Run the fixture cases through the script
        run: mise exec -- tests/images/run.sh

  app-garage:
    # The action an app's CI runs for its object store, driven the way an app drives it: a boto3 client with no endpoint,
    # region or key argument.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Start Garage
        id: garage
        uses: $/.github/actions/garage

      - name: Put, get, list and delete an object through the exported environment alone
        env:
          BUCKET: ${{ steps.garage.outputs.bucket }}
        run: |
          uv run --project tests/objectstore/app_client --locked --no-build python -I tests/objectstore/app_client/put_get_list_delete.py

  keycloak-hold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check that the Keycloak hold serves hallucinai's realm to an app's proof and leaves no container, network or volume
        run: mise exec -- tests/keycloak/hold_serves_the_realm_and_leaves_nothing.sh

  # The guard of every release/* pull request: the YAML below decides from the event alone whether the run is a bump, and
  # a bump is judged by the base's own script, read from a checkout of the base alone, on the merge commit as data. Every
  # other run passes with one line, so the job is green before and after the script lands on the base.
  release-bump-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Decide from the event whether this run is a bump
        id: event
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT_NAME" = pull_request ] && [[ "$HEAD_REF" == release/* ]] && [ "$HEAD_REPOSITORY" = "$REPOSITORY" ]; then
            echo "bump=true" >> "$GITHUB_OUTPUT"
            echo "the pull request from $HEAD_REF is a bump: the base judges its merge commit"
          else
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "this run is no release bump of $REPOSITORY: nothing to judge"
          fi

      - name: Check out the base alone
        if: steps.event.outputs.bump == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Fetch the merge commit with its parents
        if: steps.event.outputs.bump == 'true'
        env:
          MERGE_COMMIT: ${{ github.sha }}
        run: git fetch --quiet --no-tags --depth=2 origin "$MERGE_COMMIT"

      - name: Judge the merge commit with the base's script
        if: steps.event.outputs.bump == 'true'
        env:
          MERGE_COMMIT: ${{ github.sha }}
        run: |
          if [ ! -f scripts/release_bump_scope.sh ]; then
            echo "::error::the base holds no scripts/release_bump_scope.sh, so it cannot judge this bump"
            exit 1
          fi
          bash scripts/release_bump_scope.sh "$MERGE_COMMIT"

  # A failed full run has no pull request to show it, so it comments on the standing item where the platform head reads it.
  report-failed-full-run:
    if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [checks, scope, cluster, bootstrap, opentofu, images, keycloak-hold, release-bump-scope, quality]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comment the run's link on the standing item
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: gh issue comment 674 --repo "$GITHUB_REPOSITORY" --body "A $EVENT_NAME run of ci failed, see $RUN_URL"

  quality:
    if: always()
    needs: [checks, cluster, bootstrap, opentofu, images, keycloak-hold, release-bump-scope]
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@95ceb40c3c9b547c41ef2080df446bfa61bf42f0 # v0.25.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
