name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Validate the Dependabot configuration against its schema
        run: uvx --no-build check-jsonschema@0.39.0 --builtin-schema vendor.dependabot .github/dependabot.yml

      - name: Check that every directory under apps/ has its Kustomization over it, and every one of those a directory
        # pipefail: a find or yq that fails after printing its names must fail the step, not pass the comparison.
        shell: bash
        run: |
          directories="$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          kustomizations="$(yq --no-doc 'select(.kind == "Kustomization" and .spec.path == "./apps/" + .metadata.name) | .metadata.name' clusters/pc/apps.yaml | sort)"
          every="$(yq --no-doc 'select(.kind == "Kustomization") | .metadata.name' clusters/pc/apps.yaml | sort)"
          [ "$directories" = "$kustomizations" ] && [ "$every" = "$kustomizations" ] || {
            echo "::error::apps/ holds [$(echo $directories)], clusters/pc/apps.yaml holds Kustomizations [$(echo $every)] of which [$(echo $kustomizations)] name their own directory"
            exit 1
          }
          echo "each directory under apps/ has its Kustomization: $(echo $directories)"

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check that cutover:preflight names each missing precondition, exits 1, 3 or 2, writes its evidence only at 0 and makes only reads
        run: mise exec -- tests/cutover/preflight_names_each_missing_precondition.sh

      - name: Check that cutover:load and cutover:check name each difference, print no value, exit 1 or 2 and make only the listed calls
        run: mise exec -- tests/cutover/load_and_check_name_each_difference_and_print_no_value.sh

      - name: Check that every secret and password in the realm files is an env reference
        run: >-
          mise exec -- tests/keycloak/realm_secrets_are_env_references.sh
          infrastructure/keycloak/realm.yaml infrastructure/keycloak/master.yaml

      - name: Check that check:secrets-expiry passes no annotated Secret and a date 31 days out and names each Secret within 30 days, past, unparseable or unlisted
        run: tests/secrets/expiry_check_names_each_breach.sh

      - name: Run the legal project's tests at 100 % branch coverage
        run: mise run legal:test

      - name: Keep the coverage report for the gate's sonar job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: src/legal/coverage.xml
          if-no-files-found: error

      - name: Check that legal:check passes hopin's legal files at the tag it runs, names file and line of a broken one and quotes no text
        run: mise exec -- tests/legal/legal_check_names_file_and_line_and_quotes_no_text.sh

      - name: Check that the app texts under infrastructure/legal equal their apps' files and dates at the release each names
        run: mise exec -- tests/legal/app_texts_equal_their_release.sh

      - name: Check that the legal stylesheet, headers and appkit files equal hal's and appkit's at the pinned commit
        run: tests/legal/legal_sections_assets_and_headers_equal_hals_at_commit.sh

      - name: Check that a failed LiteLLM write stops the rest and names what was made, and that no key value reaches an argument or an output
        run: mise exec -- tests/litellm/failed_write_names_what_is_done.sh

      - name: Check that a failed or lost write of the admin budget, its group or its customer row names what may be written and a rerun completes it
        run: mise exec -- tests/litellm/admin_names_what_a_failed_write_may_have_left.sh

      - name: Check that GITHUB_META_TOKEN reaches only curl's stdin, stays anonymous when unset and is refused outside the token alphabet
        run: mise exec -- tests/secrets/github_meta_token_is_refused_or_reaches_only_curls_stdin.sh

      - name: Check that the Renovate report check fails naming a missing report, a report with no dependency and each missing or skipped pin
        run: tests/renovate/report_check_names_each_missing_pin.sh

  cluster:
    # GitHub appends matrix values to a literal job name, and the gate looks for the name cluster.
    name: ${{ github.job }}
    strategy:
      fail-fast: false
      matrix:
        part: [core, postgres, backup]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The Secret ghcr-pull holds this job's token, which pulls the apps' private packages.
      packages: read
    defaults:
      run:
        # Every step after the bootstrap runs with the locked tools and the [env] of mise.toml.
        shell: mise exec -- bash --noprofile --norc -euo pipefail {0}
    env:
      # The commit the run's workflow comes from: the merge of the head into main on a pull request, main's commit on a
      # push. The job checks it out and serves it to Flux as the one branch of a repository on the runner.
      CANDIDATE_REVISION: ${{ github.sha }}
      CANDIDATE_BRANCH: candidate
      CANDIDATE_SOURCE_PORT: "8081"
      CLUSTER_NAME: platform
      # The k3s configuration the PC and this cluster share.
      K3S_CONFIG_SOURCE: host/k3s/config.yaml
      # The k3d-managed registry serving the job's platform-secrets source: the cluster reaches it by its address on
      # the k3d network, the runner on localhost, both on this port.
      REGISTRY_NAME: platform-registry
      REGISTRY_PORT: "5000"
      # The dummy Secret the job encrypts, serves as platform-secrets and reads back decrypted.
      PROOF_SECRET_NAMESPACE: default
      PROOF_SECRET_NAME: decryption-proof
      # The client Pods' image: each sends its requests and is deleted after them.
      CLIENT_IMAGE: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
      # The image of the egress probe Pods and of B3's throwaway target; local-path's helper runs busybox too.
      PROBE_IMAGE: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      # A client Pod that Pod Security admits as restricted, as namespace cloudflared enforces: it prints the status of
      # each request to its URL, or 000 when no answer came, with @NAME@, @IMAGE@, @HOST@ and @URL@ replaced. A 429's
      # Retry-After would hold a retry for the whole rate-limit window, so --retry-max-time drops that retry.
      CLIENT_POD: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: @NAME@
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: client
              image: @IMAGE@
              args: [--silent, --output, /dev/null, --write-out, '%{http_code}', --max-time, '10', --retry, '5',
                --retry-connrefused, --retry-delay, '2', --retry-max-time, '30', --header, 'Host: @HOST@', '@URL@']
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
      # cloudflared's Namespace and the host its ingress names no rule for.
      TUNNEL_NAMESPACE: cloudflared
      UNROUTED_HOST: unrouted.invalid
      # The apps whose pull Secret and files the job's platform-secrets serves, by the names their Deployments read.
      APP_MANIFESTS: apps/hopin/hopin.yaml apps/speech-runtime/speech-runtime.yaml apps/skat/skat.yaml apps/songmaker/web.yaml apps/songmaker/music-worker.yaml apps/songmaker/scoring-worker.yaml apps/songmaker/acestep-worker.yaml
      # The Kustomization that serves the Secrets of every namespace, so that no other layer holds one of them.
      SECRETS_LAYER: flux-system/platform-secrets
      # The Postgres base the layers under infrastructure/ and apps/ include.
      POSTGRES_BASE: infrastructure/postgres
      # The component a Postgres layer includes to be backed up, and the rest-server it backs up to.
      POSTGRES_BACKUP_COMPONENT: infrastructure/postgres/backup
      REST_SERVER_MANIFEST: infrastructure/backup/rest-server.yaml
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The served repository holds this commit with its history, since a shallow one cannot be pushed.
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned tools
        shell: bash
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check that Docuum with the service's arguments deletes the least recently used unprotected image and keeps the rest
        if: matrix.part == 'postgres'
        run: tests/disk/docuum_deletes_the_least_recently_used_unprotected_image.sh

      # Before the cluster exists, so a stale generated file fails here and never reaches Flux.
      - name: Compare the generated files with a fresh regeneration
        if: matrix.part == 'core'
        run: tests/generated/generated_files_match_regeneration.sh

      - name: Check Prometheus' rules and their tests with promtool from the rendered image
        if: matrix.part == 'core'
        run: tests/prometheus/rules_pass_promtool_and_their_tests.sh

      - name: Create the k3d cluster with its registry
        id: create-cluster
        run: |
          # k3d only warns about a missing volume source, and k3s would start on its defaults.
          [ -f "$K3S_CONFIG_SOURCE" ] || { echo "::error::$K3S_CONFIG_SOURCE is missing"; exit 1; }
          # The apps' images fill this disk: the app step prints it again after their pulls.
          df --human-readable /
          # The file alone at k3s's default path, the one the PC uses: k3d writes registries.yaml beside it.
          # k3d's DNS fix DNATs pod DNS to Docker's 127.0.0.11, which the kernel drops unless route_localnet is 1: the
          # shared file's iptables-localhost-nodeports=false keeps it 0, so CoreDNS would answer SERVFAIL.
          K3D_FIX_DNS=0 k3d cluster create "$CLUSTER_NAME" --image "rancher/k3s:${K3S_VERSION//+/-}" \
            --volume "$PWD/$K3S_CONFIG_SOURCE:/etc/rancher/k3s/config.yaml:ro@server:0" \
            --registry-create "${REGISTRY_NAME}:127.0.0.1:${REGISTRY_PORT}" --enforce-registry-port-match \
            --wait --timeout 3m

      - name: Apply the Flux controllers from the committed components
        run: |
          kubectl apply --server-side -f clusters/pc/flux-system/gotk-components.yaml
          kubectl -n flux-system wait deployment --all --for=condition=Available --timeout=3m

      # flux install writes a binding subject for every controller, omitted ones included.
      - name: Assert that no binding names the removed helm-controller
        if: matrix.part == 'core'
        run: tests/flux/no_binding_names_helm_controller.sh

      - name: Check that secrets:github-host-keys passes only GitHub's own keys under github.com
        if: matrix.part == 'core'
        env:
          # GitHub answers 403 to anonymous meta reads once a runner address used up its hourly limit.
          GITHUB_META_TOKEN: ${{ github.token }}
        run: tests/secrets/github_host_keys_pass_only_githubs_own.sh

      - name: Check that secrets:new-key refuses a key directory not at 700, a present drill file and a regular file in the key path, and accepts a symlinked 700 key directory
        if: matrix.part == 'core'
        run: tests/secrets/new_key_refuses_unsafe_key_paths.sh

      - name: Check that bootstrap:secrets prints only its own lines and no key block for a source that turns Ready within the minute
        if: matrix.part == 'core'
        run: tests/secrets/bootstrap_secrets.sh

      - name: Check that db:load-dump and interrupt_load.sh end as they owe where a command fails, a signal arrives or a table is empty
        if: matrix.part == 'core'
        run: tests/postgres/load_dump.sh

      - name: Assert that k3s runs with host/k3s/config.yaml
        if: matrix.part == 'core'
        run: tests/k3s/k3s_runs_with_the_host_config.sh

      - name: Assert that the kubelet keeps the configured log files, reopens a deleted pod log and never compresses one
        if: matrix.part == 'core'
        run: tests/pod-logs/kubelet_keeps_reopens_and_never_compresses_logs.sh

      - name: Encrypt a dummy Secret and the app's Secrets to a throwaway age key
        env:
          # The apps' pull Secrets hold this job's own token, which GitHub masks; each app's package grants it Read.
          PULL_USER: ${{ github.actor }}
          PULL_TOKEN: ${{ github.token }}
          # The layers whose containers read Secrets by key, each of which gets a dummy per key.
          SECRET_KEY_LAYERS: infrastructure/keycloak infrastructure/litellm infrastructure/prometheus
        run: tests/secrets/encrypt_secrets_to_a_throwaway_age_key.sh

      - name: Push the encrypted Secrets and serve them as the job's platform-secrets source
        run: tests/secrets/serve_encrypted_secrets_as_platform_secrets.sh

      - name: Create the Secret sops-age with the task the PC bootstrap runs
        run: mise run secrets:age-secret "$AGE_KEY_FILE"

      - name: Dry-run the layer files on the API server
        run: kubectl apply --server-side --dry-run=server -f clusters/pc

      - name: Check that the committed root and tunnel carry no spec.patches
        run: tests/flux/root_and_tunnel_carry_no_spec_patches.sh

      - name: Serve the candidate commit to Flux
        run: tests/flux/serve_the_candidate_commit.sh

      - name: Reconcile the candidate tree
        run: tests/flux/reconcile_the_candidate_tree.sh

      - name: Assert that Flux reconciled the candidate commit and decrypted the dummy
        run: tests/flux/flux_reconciled_the_candidate_and_decrypted_the_dummy.sh

      - name: Assert that a GitRepository at the committed root's url and branch turns Ready
        if: matrix.part == 'core'
        run: tests/flux/committed_source_url_turns_ready.sh

      - name: Assert that Traefik runs from its render, ClusterIP only, answers only cloudflared's and Gatus's pods and routes hopin and skat, and that speech-runtime answers only its callers' pods
        if: matrix.part == 'core'
        env:
          # A client Pod's namespace that is neither Traefik's nor the tunnel's nor speech-runtime's callers', and the
          # host its Ingress routes.
          OTHER_NAMESPACE: ingress-client
          ROUTED_HOST: routed.invalid
          # The routed app's manifest, its setting of the proxies it trusts, its sign-in start and that path's budget per
          # client address, as hopin's config names them, and two documentation addresses (RFC 5737) a client names as
          # forwarded.
          ROUTED_APP_MANIFEST: apps/hopin/hopin.yaml
          TRUSTED_PROXIES_SETTING: HOPIN_TRUSTED_PROXIES
          SIGN_IN_PATH: /auth/start
          SIGN_IN_BUDGET: "40"
          # The same four for skat at the tag of its image in apps/skat/skat.yaml: SKAT_TRUSTED_PROXIES is read into
          # the setting `trusted_proxies`; AUTH_START_PATH and SIGN_IN_RATE_LIMIT_BUDGET (max_requests=40 per 10
          # minutes) are its constants, the budget applied to the start path in SIGN_IN_PATHS.browser_paths.
          ROUTED_APP_2_MANIFEST: apps/skat/skat.yaml
          ROUTED_APP_2_TRUSTED_PROXIES_SETTING: SKAT_TRUSTED_PROXIES
          ROUTED_APP_2_SIGN_IN_PATH: /auth/start
          ROUTED_APP_2_SIGN_IN_BUDGET: "40"
          FIRST_CLIENT_ADDRESS: 192.0.2.1
          SECOND_CLIENT_ADDRESS: 192.0.2.2
          # speech-runtime's Namespace and Service, and one namespace its NetworkPolicy admits.
          SPEECH_NAMESPACE: speech-runtime
          SPEECH_SERVICE: speech-runtime
          SPEECH_CALLER_NAMESPACE: hopin
        run: tests/ingress/traefik_answers_only_cloudflared_and_routes_the_app.sh

      - name: Assert that each app runs at its full app ref after platform-secrets, pulled through its pull Secret
        if: matrix.part == 'core'
        run: tests/workloads/apps_run_at_their_full_ref.sh

      - name: Assert that every Deployment outside the system namespaces runs the digests it names
        if: matrix.part == 'core'
        env:
          POLICY_FILE: infrastructure/admission/image-policy.yaml
        run: tests/workloads/deployments_run_the_digests_they_name.sh

      - name: Assert that every workload layer depends on admission and was applied after it
        if: matrix.part == 'core'
        env:
          ROOT_LAYER: flux-system/flux-system
          ADMISSION_LAYER: flux-system/admission
          NAMESPACES_LAYER: flux-system/namespaces
        run: tests/workloads/layers_depend_on_admission.sh

      - name: Probe the image policies by server-side dry-run
        if: matrix.part == 'core'
        env:
          # The policy covers this namespace like every other one; the step deletes it after the probes.
          PROBE_NAMESPACE: admission-probe
          POLICY_FILE: infrastructure/admission/image-policy.yaml
          VENDOR_LIST: infrastructure/admission/image-vendors.yaml
          FLUX_COMPONENTS_FILE: clusters/pc/flux-system/gotk-components.yaml
          FLUX_CONTROLLER: system:serviceaccount:flux-system:kustomize-controller
        run: tests/admission/image_policies_by_dry_run.sh

      - name: Assert that namespaces and tunnel applied the candidate and cloudflared runs at 0 replicas
        if: matrix.part == 'core'
        run: tests/cloudflared/tunnel_applied_at_zero_replicas.sh

      - name: Assert cloudflared's ingress from Pods built from its Deployment's template
        if: matrix.part == 'core'
        run: tests/cloudflared/ingress_from_pods_built_from_its_template.sh

      - name: P7a cells
        if: matrix.part == 'postgres'
        env:
          # The layer whose Kustomization the prune proof deletes and whose Postgres the loader proof loads.
          PROOF_LAYER: litellm
          # What a Postgres namespace's Kustomization waits for: admission for its workload, platform-secrets for its
          # password, storage for its claim.
          POSTGRES_LAYER_DEPENDENCIES: admission platform-secrets storage
          # Keycloak's namespace, whose egress policy the probe Pods meet, a Service every other Pod reaches and a host
          # outside the cluster.
          EGRESS_NAMESPACE: keycloak
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/postgres/postgres_storage_prune_load_and_egress.sh

      - name: Assert that songmaker's Postgres and Redis are Ready and non-root, closed to other namespaces, and that Redis forgets on restart
        if: matrix.part == 'core'
        env:
          SONGMAKER_NAMESPACE: songmaker
          # The throwaway namespace of the Pod that must get no answer.
          OTHER_NAMESPACE: songmaker-client
        run: tests/songmaker/stores_are_ready_non_root_closed_and_forget.sh

      - name: Assert that songmaker's web is Ready at its full ref, migrated, closed to other namespaces, read-only and holds its audio claim
        if: matrix.part == 'postgres'
        env:
          SONGMAKER_NAMESPACE: songmaker
          # The throwaway namespace of the Pod that must get no answer.
          OTHER_NAMESPACE: songmaker-web-client
        run: tests/songmaker/web_migrates_serves_closed_and_holds_its_audio.sh

      - name: Assert that songmaker's route reaches its web through Traefik for the tunnel's Pods, that the web answers the host the GPU worker sends and refuses another, and that a Pod in another namespace gets no answer
        if: matrix.part == 'postgres'
        env:
          SONGMAKER_NAMESPACE: songmaker
          # The throwaway namespace of the Pod that must get no answer.
          OTHER_NAMESPACE: songmaker-route-client
        run: tests/songmaker/route_reaches_the_web.sh

      - name: Assert that the layer nvidia is Ready with its DaemonSet scheduled nowhere, offers the RuntimeClass, holds only the plugin in a Namespace without a Pod Security label, and that a restricted Pod with the class passes dry-run
        if: matrix.part == 'core'
        env:
          NVIDIA_NAMESPACE: nvidia
          # The throwaway Namespace that enforces restricted, which the dry-run Pod meets.
          RESTRICTED_NAMESPACE: nvidia-restricted
        run: tests/nvidia/layer_offers_the_class_and_judges_a_restricted_pod.sh

      - name: P7b cells
        if: matrix.part == 'core'
        env:
          KEYCLOAK_NAMESPACE: keycloak
          # The realm files config-cli applies, whose groups and service accounts the cells read, and the client whose
          # login page they open.
          REALM_FILE: infrastructure/keycloak/realm.yaml
          MASTER_FILE: infrastructure/keycloak/master.yaml
          LOGIN_CLIENT: hopin
          # A group no realm file declares, which an empty database must not hold.
          RETIRED_GROUP: /services/agent-service/api
          # An app's manifest whose namespace must not reach Keycloak and whose Service and namespace Keycloak must not
          # reach, the latter through a throwaway target with the app's labels and port; a Service no ingress policy
          # guards and a host outside the cluster, neither of which Keycloak reaches.
          CALLER_MANIFEST: apps/hopin/hopin.yaml
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/keycloak/realm_route_and_policies.sh

      - name: P2 cells
        if: matrix.part == 'core'
        env:
          KEYCLOAK_NAMESPACE: keycloak
          REALM_FILE: infrastructure/keycloak/realm.yaml
          # The agent client whose tokens the cells mint, and the allowlist of its service account's groups.
          AGENT_CLIENT: agent-mozart
          AGENT_GROUPS: /agents /apps/hopin /apps/hopin/mcp /agent-owners
        run: |
          tests/keycloak/agent_owner_names_what_a_failed_write_left.sh
          tests/keycloak/agent_client_tokens_and_groups.sh
          tests/keycloak/access_tokens_hold_no_profile_or_email_claim.sh

      - name: Assert that cutover:load refuses the cluster's own Keycloak dump, naming agent_owner and the platform's six objects, before it loads anything
        if: matrix.part == 'core'
        env:
          KEYCLOAK_NAMESPACE: keycloak
        run: tests/cutover/load_refuses_a_real_keycloak_dump_naming_its_platform_objects.sh

      - name: P7c cells
        if: matrix.part == 'core'
        env:
          # LiteLLM's namespace, an app namespace its front admits, a namespace it does not, and an SNI no router of
          # agent-egress allows.
          LITELLM_NAMESPACE: litellm
          APP_NAMESPACE: hopin
          OTHER_NAMESPACE: litellm-client
          THIRD_SNI: third.invalid
        run: tests/litellm/front_key_check_routing_and_closed_egress.sh

      - name: Assert that Alertmanager runs on a finished file, is found by Prometheus, refuses bad values, makes at most one send per flush of a fired alert, answers only its readers and Prometheus drops a Flux Pod that is not running
        if: matrix.part == 'backup'
        env:
          PROMETHEUS_NAMESPACE: prometheus
          # The namespace of the readers the policy admits, and the throwaway one of the stranger.
          READER_NAMESPACE: gatus
          OTHER_NAMESPACE: alertmanager-client
        run: tests/prometheus/alertmanager_mails_by_a_finished_file_and_answers_only_its_readers.sh

      - name: Assert that Grafana answers a query through both data sources at the address grafana:open printed, holds no state and answers only Gatus's pods
        if: matrix.part == 'backup'
        env:
          GRAFANA_NAMESPACE: grafana
          LOKI_NAMESPACE: loki
          PROMETHEUS_NAMESPACE: prometheus
          # Grafana's one admitted sender, the throwaway namespace of a Pod that is not, a Service every other Pod
          # reaches and a host outside the cluster.
          GATUS_NAMESPACE: gatus
          OTHER_NAMESPACE: grafana-client
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/grafana/grafana_answers_both_data_sources_without_state_and_only_gatus_reaches_it.sh

      - name: Assert that songmaker's music and scoring workers are Ready at their full refs, that neither asks for the GPU, and that the scoring worker reaches only its Postgres and Redis
        if: matrix.part == 'backup'
        env:
          SONGMAKER_NAMESPACE: songmaker
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/songmaker/workers_are_ready_at_their_full_ref_and_scoring_reaches_only_its_stores.sh

      - name: P7d cells
        if: matrix.part == 'backup'
        env:
          # The Kustomization and Namespace of the rest-server, a namespace with no repository, which gets no answer, and a
          # Keycloak table its realm leaves empty.
          BACKUP_LAYER: backup
          LITELLM_NAMESPACE: litellm
          OUTSIDE_NAMESPACE: hopin
          EMPTY_KEY_TABLE: broker_link
          VENDOR_LIST: infrastructure/admission/image-vendors.yaml
          SONGMAKER_NAMESPACE: songmaker
        run: |
          tests/backup/backup_restores_keeps_repositories_apart_and_prunes_by_the_rule.sh
          tests/backup/songmaker_dump_comes_from_the_pre_backup_pod_and_every_restore_test_reads_it_by_path.sh
          tests/backup/staging_snapshot_holds_the_files_and_the_dump_of_one_run.sh
      - name: P9f cells
        if: matrix.part == 'backup'
        env:
          PROMETHEUS_NAMESPACE: prometheus
        run: tests/prometheus/backup_alerts_read_every_schedule_and_namespace.sh
      - name: P9c-2 cells
        if: matrix.part == 'backup'
        env:
          LITELLM_NAMESPACE: litellm
          KEYCLOAK_NAMESPACE: keycloak
          REALM_FILE: infrastructure/keycloak/realm.yaml
        run: tests/litellm/admin_budget_follows_the_fingerprint_and_keeps_spend.sh
      - name: P9b cells
        if: matrix.part == 'core'
        env:
          LITELLM_NAMESPACE: litellm
        run: tests/litellm/expire_deletes_only_what_is_past_90_days.sh

      # The step suspends the Kustomization litellm, which would otherwise restore the table it changes.
      - name: P9c cells
        if: matrix.part == 'postgres'
        env:
          LITELLM_NAMESPACE: litellm
          APP_NAMESPACE: hopin
        run: tests/litellm/keys_table_drives_budgets_and_the_app_key.sh

      - name: Assert that a Pod whose init container removes its link holds lo alone, fails closed and leaves nothing behind on the node
        if: matrix.part == 'backup'
        env:
          NO_NETWORK_NAMESPACE: no-network
        run: tests/no_network/pod_loses_its_link_before_the_worker_starts.sh

      - name: Assert that the three legal pages and every asset reach a Pod beside cloudflared through Traefik with the committed bytes and headers, /favicon.ico and the asset directories get nginx's 404 and everything else Traefik's
        if: matrix.part == 'core'
        env:
          LEGAL_NAMESPACE: legal
          LEGAL_LAYER_DIRECTORY: infrastructure/legal
          LEGAL_HOST: hallucinai.de
          OTHER_NAMESPACE: legal-client
        run: tests/legal/five_paths_through_traefik.sh

      - name: Assert that Loki keeps a pushed line for LogQL, deletes after at most 28 days, answers only its two namespaces and keeps its claim
        if: matrix.part == 'core'
        env:
          LOKI_NAMESPACE: loki
          # Loki's admitted sender, the Namespace of the layer alloy, and the throwaway namespace of one that is not.
          WRITER_NAMESPACE: alloy
          OTHER_NAMESPACE: loki-client
        run: tests/loki/loki_keeps_lines_under_28_days.sh

      - name: Assert that Gatus shows every endpoint healthy, shows a stopped service unhealthy and healthy again, and answers no Pod
        if: matrix.part == 'core'
        env:
          # The service the cell stops and restores, by its Namespace, Deployment and Gatus endpoint, and a namespace for
          # the Pod that must get no answer.
          STOPPED_NAMESPACE: speech-runtime
          STOPPED_DEPLOYMENT: speech-runtime
          STOPPED_ENDPOINT: speech-runtime
          OTHER_NAMESPACE: gatus-client
        run: tests/gatus/gatus_shows_each_service_and_only_the_pc_reaches_it.sh

      - name: Assert that Alloy ships a pod's line to Loki with three labels, holds one ClusterRole with exactly two rules and answers nobody
        if: matrix.part == 'core'
        env:
          ALLOY_NAMESPACE: alloy
          LOKI_NAMESPACE: loki
          # The namespace of the throwaway Pod that logs the nonce, and the throwaway namespace of the Pod Alloy never answers.
          SOURCE_NAMESPACE: hopin
          OTHER_NAMESPACE: alloy-client
        run: tests/alloy/alloy_ships_pod_lines_to_loki.sh

      - name: Assert that Prometheus scrapes every target and Flux's Kustomizations, goes pending on real failures, answers only its readers and keeps its claim
        if: matrix.part == 'core'
        env:
          PROMETHEUS_NAMESPACE: prometheus
          # The namespace of a reader the NetworkPolicy admits, which the layer owns, then the throwaway namespace the step
          # creates and removes, one that is not admitted and holds the Deployment at a dead image, and the Kustomization at
          # a missing path.
          READER_NAMESPACE: grafana
          OTHER_NAMESPACE: prometheus-probe
          BROKEN_KUSTOMIZATION: prometheus-probe
          # The suspended CronJob in that namespace whose Job exits 1.
          FAILING_CRONJOB: prometheus-probe
        run: tests/prometheus/prometheus_sees_every_layer_and_answers_only_its_readers.sh

      - name: Print Flux's state and the controllers' errors
        if: failure() && steps.create-cluster.outcome == 'success'
        run: tests/flux/print_flux_state.sh

      # Flux fetches from the server every minute until the job ends.
      - name: Stop the candidate server
        if: always()
        run: tests/flux/stop_the_candidate_server.sh

  bootstrap:
    runs-on: ubuntu-latest
    # A bare image, as on a fresh machine: the first-run prerequisites are the only step before the script.
    container: ubuntu:26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the first-run prerequisites
        run: |
          # One setting for every apt call of the job, the tests' installs included: archive.ubuntu.com
          # sometimes refuses a connection, and a failed download is retried 5 times before apt fails.
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: scripts/bootstrap_pc.sh --only tools

      - name: Assert that every locked tool is installed and runs
        run: tests/bootstrap/every_locked_tool_runs.sh

      - name: Run the script again and assert that it changes nothing
        run: tests/bootstrap/second_run_changes_nothing.sh

      - name: Check that the committed tmpfiles line deletes a pod log by its creation time, with its emptied directories
        run: tests/pod-logs/tmpfiles_line_deletes_a_log_by_creation_time.sh

      - name: Check that check-pod-logs passes fresh logs and names each breach it can see without a month's wait
        run: tests/pod-logs/check_pod_logs_names_each_breach.sh

      - name: Check that the committed tmpfiles line deletes an old Codex session and keeps a Claude session
        run: tests/disk/tmpfiles_line_deletes_old_codex_sessions_and_keeps_claude_sessions.sh

      - name: Check that the Trash unit's gtrash deletes an entry trashed 31 days ago and keeps a directory trashed yesterday and an entry without a .trashinfo
        run: tests/disk/gtrash_prune_deletes_old_trash_entries_and_keeps_the_rest.sh

      - name: Check that mise run disk names its table and warns at 85 % and not at 84 %
        run: tests/disk/mise_disk_warns_from_85_percent.sh

      - name: Check that the journal's drop-in is read by systemd, its limits add up to under 30 days and its notification names a declared service
        run: tests/journald/retention_drop_in_keeps_every_entry_under_30_days.sh

  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the GitHub settings root against its lock and mocked tests
        run: mise run github:test

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      # The image the render runs in without network, by the digest of its multi-arch index; flux2 is a static binary,
      # mounted from the lock and run as the container's entrypoint.
      RENDER_IMAGE: ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # gh reads an image's digest from the registry with Docker's keychain; the token reaches it only through stdin.
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Render the tree and judge every image
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- scripts/verify_image_release.sh

      - name: Run the fixture cases through the script
        run: mise exec -- tests/images/run.sh

  quality:
    if: always()
    needs: [checks, cluster, bootstrap, opentofu, images]
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    with:
      coverage-artifact: coverage
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
