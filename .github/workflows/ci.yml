name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Validate the Dependabot configuration against its schema
        run: uvx --no-build check-jsonschema@0.39.0 --builtin-schema vendor.dependabot .github/dependabot.yml

      - name: Check that every directory under apps/ has its Kustomization over it, and every one of those a directory
        # pipefail: a find or yq that fails after printing its names must fail the step, not pass the comparison.
        shell: bash
        run: |
          directories="$(find apps -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)"
          kustomizations="$(yq --no-doc 'select(.kind == "Kustomization" and .spec.path == "./apps/" + .metadata.name) | .metadata.name' clusters/pc/apps.yaml | sort)"
          every="$(yq --no-doc 'select(.kind == "Kustomization") | .metadata.name' clusters/pc/apps.yaml | sort)"
          [ "$directories" = "$kustomizations" ] && [ "$every" = "$kustomizations" ] || {
            echo "::error::apps/ holds [$(echo $directories)], clusters/pc/apps.yaml holds Kustomizations [$(echo $every)] of which [$(echo $kustomizations)] name their own directory"
            exit 1
          }
          echo "each directory under apps/ has its Kustomization: $(echo $directories)"

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check that every secret and password in the realm files is an env reference
        run: >-
          mise exec -- tests/keycloak/realm_secrets_are_env_references.sh
          infrastructure/keycloak/realm.yaml infrastructure/keycloak/master.yaml

      - name: Check that check:secrets-expiry passes no annotated Secret and a date 31 days out and names each Secret within 30 days, past, unparseable or unlisted
        run: tests/secrets/expiry_check_names_each_breach.sh

  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The Secret ghcr-pull holds this job's token, which pulls the apps' private packages.
      packages: read
    defaults:
      run:
        # Every step after the bootstrap runs with the locked tools and the [env] of mise.toml.
        shell: mise exec -- bash --noprofile --norc -euo pipefail {0}
    env:
      CANDIDATE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PULL_REQUEST_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
      CLUSTER_NAME: platform
      # The k3s configuration the PC and this cluster share.
      K3S_CONFIG_SOURCE: host/k3s/config.yaml
      # The k3d-managed registry serving the job's platform-secrets source: the cluster reaches it by name, the runner
      # on localhost, both on this port.
      REGISTRY_NAME: platform-registry
      REGISTRY_PORT: "5000"
      # The dummy Secret the job encrypts, serves as platform-secrets and reads back decrypted.
      PROOF_SECRET_NAMESPACE: default
      PROOF_SECRET_NAME: decryption-proof
      # The client Pods' image: each sends its requests and is deleted after them.
      CLIENT_IMAGE: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
      # The image of the egress probe Pods and of B3's throwaway target; local-path's helper runs busybox too.
      PROBE_IMAGE: docker.io/library/busybox:1.37.0@sha256:a7dbc319b1438115a207e11930dc4bb3e643dcb3ec0bdd694bb36cd8fad289ec
      # A client Pod that Pod Security admits as restricted, as namespace cloudflared enforces: it prints the status of
      # each request to its URL, or 000 when no answer came, with @NAME@, @IMAGE@, @HOST@ and @URL@ replaced. A 429's
      # Retry-After would hold a retry for the whole rate-limit window, so --retry-max-time drops that retry.
      CLIENT_POD: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: @NAME@
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: client
              image: @IMAGE@
              args: [--silent, --output, /dev/null, --write-out, '%{http_code}', --max-time, '10', --retry, '5',
                --retry-connrefused, --retry-delay, '2', --retry-max-time, '30', --header, 'Host: @HOST@', '@URL@']
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: [ALL]
      # cloudflared's Namespace and the host its ingress names no rule for.
      TUNNEL_NAMESPACE: cloudflared
      UNROUTED_HOST: unrouted.invalid
      # The apps whose pull Secret and files the job's platform-secrets serves, by the names their Deployments read.
      APP_MANIFESTS: apps/hopin/hopin.yaml apps/speech-runtime/speech-runtime.yaml
      # The Kustomization that serves the Secrets of every namespace, so that no other layer holds one of them.
      SECRETS_LAYER: flux-system/platform-secrets
      # The Postgres base the layers under infrastructure/ and apps/ include.
      POSTGRES_BASE: infrastructure/postgres
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request the default checkout is the merge commit, while Flux reconciles the head.
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false

      - name: Install the pinned tools
        shell: bash
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Before the cluster exists, so a stale generated file fails here and never reaches Flux.
      - name: Compare the generated files with a fresh regeneration
        run: tests/generated/generated_files_match_regeneration.sh

      - name: Create the k3d cluster with its registry
        id: create-cluster
        run: |
          # k3d only warns about a missing volume source, and k3s would start on its defaults.
          [ -f "$K3S_CONFIG_SOURCE" ] || { echo "::error::$K3S_CONFIG_SOURCE is missing"; exit 1; }
          # The apps' images fill this disk: the app step prints it again after their pulls.
          df --human-readable /
          # The file alone at k3s's default path, the one the PC uses: k3d writes registries.yaml beside it.
          # k3d's DNS fix DNATs pod DNS to Docker's 127.0.0.11, which the kernel drops unless route_localnet is 1: the
          # shared file's iptables-localhost-nodeports=false keeps it 0, so CoreDNS would answer SERVFAIL.
          K3D_FIX_DNS=0 k3d cluster create "$CLUSTER_NAME" --image "rancher/k3s:${K3S_VERSION//+/-}" \
            --volume "$PWD/$K3S_CONFIG_SOURCE:/etc/rancher/k3s/config.yaml:ro@server:0" \
            --registry-create "${REGISTRY_NAME}:127.0.0.1:${REGISTRY_PORT}" --enforce-registry-port-match \
            --wait --timeout 3m

      - name: Apply the Flux controllers from the committed components
        run: |
          kubectl apply --server-side -f clusters/pc/flux-system/gotk-components.yaml
          kubectl -n flux-system wait deployment --all --for=condition=Available --timeout=3m

      # flux install writes a binding subject for every controller, omitted ones included.
      - name: Assert that no binding names the removed helm-controller
        run: tests/flux/no_binding_names_helm_controller.sh

      - name: Check that secrets:github-host-keys passes only GitHub's own keys under github.com
        run: tests/secrets/github_host_keys_pass_only_githubs_own.sh

      - name: Check that secrets:new-key refuses a key directory not at 700, a present drill file and a regular file in the key path, and accepts a symlinked 700 key directory
        run: tests/secrets/new_key_refuses_unsafe_key_paths.sh

      - name: Check that bootstrap:secrets prints only its own lines and no key block for a source that turns Ready within the minute
        run: tests/secrets/bootstrap_secrets.sh

      - name: Check that db:load-dump and interrupt_load.sh end as they owe where a command fails, a signal arrives or a table is empty
        run: tests/postgres/load_dump.sh

      - name: Assert that k3s runs with host/k3s/config.yaml
        run: tests/k3s/k3s_runs_with_the_host_config.sh

      - name: Assert that the kubelet keeps the configured log files, reopens a deleted pod log and never compresses one
        run: tests/pod-logs/kubelet_keeps_reopens_and_never_compresses_logs.sh

      - name: Encrypt a dummy Secret and the app's Secrets to a throwaway age key
        env:
          # The apps' pull Secrets hold this job's own token, which GitHub masks; each app's package grants it Read.
          PULL_USER: ${{ github.actor }}
          PULL_TOKEN: ${{ github.token }}
          # The layers whose containers read Secrets by key, each of which gets a dummy per key.
          SECRET_KEY_LAYERS: infrastructure/keycloak
        run: tests/secrets/encrypt_secrets_to_a_throwaway_age_key.sh

      - name: Push the encrypted Secrets and serve them as the job's platform-secrets source
        run: tests/secrets/serve_encrypted_secrets_as_platform_secrets.sh

      - name: Create the Secret sops-age with the task the PC bootstrap runs
        run: mise run secrets:age-secret "$AGE_KEY_FILE"

      - name: Dry-run the layer files on the API server
        run: kubectl apply --server-side --dry-run=server -f clusters/pc

      - name: Check that the committed root and tunnel carry no spec.patches
        run: tests/flux/root_and_tunnel_carry_no_spec_patches.sh

      - name: Reconcile the candidate tree
        run: tests/flux/reconcile_the_candidate_tree.sh

      - name: Assert that Flux reconciled the candidate commit and decrypted the dummy
        run: tests/flux/flux_reconciled_the_candidate_and_decrypted_the_dummy.sh

      - name: Assert that Traefik runs from its render, ClusterIP only, answers only cloudflared's pods and routes the app, and that speech-runtime answers only its callers' pods
        env:
          # A client Pod's namespace that is neither Traefik's nor the tunnel's nor speech-runtime's callers', and the
          # host its Ingress routes.
          OTHER_NAMESPACE: ingress-client
          ROUTED_HOST: routed.invalid
          # The routed app's manifest, its setting of the proxies it trusts, its sign-in start and that path's budget per
          # client address, as hopin's config names them, and two documentation addresses (RFC 5737) a client names as
          # forwarded.
          ROUTED_APP_MANIFEST: apps/hopin/hopin.yaml
          TRUSTED_PROXIES_SETTING: HOPIN_TRUSTED_PROXIES
          SIGN_IN_PATH: /auth/start
          SIGN_IN_BUDGET: "40"
          FIRST_CLIENT_ADDRESS: 192.0.2.1
          SECOND_CLIENT_ADDRESS: 192.0.2.2
          # speech-runtime's Namespace and Service, and one namespace its NetworkPolicy admits.
          SPEECH_NAMESPACE: speech-runtime
          SPEECH_SERVICE: speech-runtime
          SPEECH_CALLER_NAMESPACE: hopin
        run: tests/ingress/traefik_answers_only_cloudflared_and_routes_the_app.sh

      - name: Assert that each app runs at its full app ref after platform-secrets, pulled through its pull Secret
        run: tests/workloads/apps_run_at_their_full_ref.sh

      - name: Assert that every Deployment outside the system namespaces runs the digests it names
        env:
          POLICY_FILE: infrastructure/admission/image-policy.yaml
        run: tests/workloads/deployments_run_the_digests_they_name.sh

      - name: Assert that every workload layer depends on admission and was applied after it
        env:
          ROOT_LAYER: flux-system/flux-system
          ADMISSION_LAYER: flux-system/admission
          NAMESPACES_LAYER: flux-system/namespaces
        run: tests/workloads/layers_depend_on_admission.sh

      - name: Probe the image policies by server-side dry-run
        env:
          # The policy covers this namespace like every other one; the step deletes it after the probes.
          PROBE_NAMESPACE: admission-probe
          POLICY_FILE: infrastructure/admission/image-policy.yaml
          VENDOR_LIST: infrastructure/admission/image-vendors.yaml
          FLUX_COMPONENTS_FILE: clusters/pc/flux-system/gotk-components.yaml
          FLUX_CONTROLLER: system:serviceaccount:flux-system:kustomize-controller
        run: tests/admission/image_policies_by_dry_run.sh

      - name: Assert that namespaces and tunnel applied the candidate and cloudflared runs at 0 replicas
        run: tests/cloudflared/tunnel_applied_at_zero_replicas.sh

      - name: Assert cloudflared's ingress from Pods built from its Deployment's template
        run: tests/cloudflared/ingress_from_pods_built_from_its_template.sh

      - name: P7a cells
        env:
          # The layer whose Kustomization the prune proof deletes and whose Postgres the loader proof loads.
          PROOF_LAYER: litellm
          # What a Postgres namespace's Kustomization waits for: admission for its workload, platform-secrets for its
          # password, storage for its claim.
          POSTGRES_LAYER_DEPENDENCIES: admission platform-secrets storage
          # Keycloak's namespace, whose egress policy the probe Pods meet, a Service every other Pod reaches and a host
          # outside the cluster.
          EGRESS_NAMESPACE: keycloak
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/postgres/postgres_storage_prune_load_and_egress.sh

      - name: P7b cells
        env:
          KEYCLOAK_NAMESPACE: keycloak
          # The realm files config-cli applies, whose groups and service accounts the cells read, and the client whose
          # login page they open.
          REALM_FILE: infrastructure/keycloak/realm.yaml
          MASTER_FILE: infrastructure/keycloak/master.yaml
          LOGIN_CLIENT: hopin
          # A group no realm file declares, which an empty database must not hold.
          RETIRED_GROUP: /services/agent-service/api
          # An app's manifest whose namespace must not reach Keycloak and whose Service and namespace Keycloak must not
          # reach, the latter through a throwaway target with the app's labels and port; a Service no ingress policy
          # guards and a host outside the cluster, neither of which Keycloak reaches.
          CALLER_MANIFEST: apps/hopin/hopin.yaml
          CLUSTER_SERVICE: default/kubernetes
          OUTSIDE_TARGET: github.com:443
        run: tests/keycloak/realm_route_and_policies.sh

      - name: Print Flux's state and the controllers' errors
        if: failure() && steps.create-cluster.outcome == 'success'
        run: tests/flux/print_flux_state.sh

  bootstrap:
    runs-on: ubuntu-latest
    # A bare image, as on a fresh machine: the first-run prerequisites are the only step before the script.
    container: ubuntu:26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the first-run prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: scripts/bootstrap_pc.sh --only tools

      - name: Assert that every locked tool is installed and runs
        run: tests/bootstrap/every_locked_tool_runs.sh

      - name: Run the script again and assert that it changes nothing
        run: tests/bootstrap/second_run_changes_nothing.sh

      - name: Check that the committed tmpfiles line deletes a pod log by its creation time, with its emptied directories
        run: tests/pod-logs/tmpfiles_line_deletes_a_log_by_creation_time.sh

      - name: Check that check-pod-logs passes fresh logs and names each breach it can see without a month's wait
        run: tests/pod-logs/check_pod_logs_names_each_breach.sh

  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the GitHub settings root against its lock and mocked tests
        run: mise run github:test

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      # The image the render runs in without network; flux2 is a static binary, mounted from the lock.
      RENDER_IMAGE: ubuntu:26.04
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # gh reads an image's digest from the registry with Docker's keychain; the token reaches it only through stdin.
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Render the tree and judge every image
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- scripts/verify_image_release.sh

      - name: Run the fixture cases through the script
        run: mise exec -- tests/images/run.sh

  quality:
    if: always()
    needs: [checks, cluster, bootstrap, opentofu, images]
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@2d2b68bf3916b34f6f2c72a540c1e3d8a947b750 # v0.10.0
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
