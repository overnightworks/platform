name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Validate the Dependabot configuration against its schema
        run: uvx --no-build check-jsonschema@0.39.0 --builtin-schema vendor.dependabot .github/dependabot.yml

  cluster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The Secret ghcr-pull holds this job's token, which pulls hopin's private package.
      packages: read
    defaults:
      run:
        # Every step after the bootstrap runs with the locked tools and the [env] of mise.toml.
        shell: mise exec -- bash --noprofile --norc -euo pipefail {0}
    env:
      CANDIDATE_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      PULL_REQUEST_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
      CLUSTER_NAME: platform
      # The k3s configuration the PC and this cluster share.
      K3S_CONFIG_SOURCE: host/k3s/config.yaml
      # The k3d-managed registry serving the job's platform-secrets source: the cluster reaches it by name, the runner
      # on localhost, both on this port.
      REGISTRY_NAME: platform-registry
      REGISTRY_PORT: "5000"
      # The dummy Secret the job encrypts, serves as platform-secrets and reads back decrypted.
      PROOF_SECRET_NAMESPACE: default
      PROOF_SECRET_NAME: decryption-proof
      # The client Pods' image: each sends one request and is deleted after it.
      CLIENT_IMAGE: docker.io/curlimages/curl:8.23.0@sha256:3fb7e13e5d179a845c97d78204f3f1064d1907037f26a3ebf91710571151fd93
      # cloudflared's Namespace and the host its ingress names no rule for.
      TUNNEL_NAMESPACE: cloudflared
      UNROUTED_HOST: unrouted.invalid
      # The app whose pull Secret and files the job's platform-secrets serves, by the names its Deployment reads.
      APP_MANIFEST: apps/hopin/hopin.yaml
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On a pull request the default checkout is the merge commit, while Flux reconciles the head.
          ref: ${{ env.CANDIDATE_REVISION }}
          persist-credentials: false

      - name: Install the pinned tools
        shell: bash
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Before the cluster exists, so a stale generated file fails here and never reaches Flux.
      - name: Compare the generated files with a fresh regeneration
        run: |
          fail() { echo "::error::$1"; exit 1; }
          generated=(clusters/pc/flux-system/gotk-components.yaml mise.lock infrastructure/)
          mise run flux:export
          mise lock
          mise run charts:render

          # An ignored output would escape the status below.
          ignore_status=0
          ignored="$(find "${generated[@]}" -type f | git check-ignore --no-index --stdin)" || ignore_status=$?
          case "$ignore_status" in
            0) fail "git ignores ${ignored//$'\n'/ }, which the comparison below would not see" ;;
            1) echo "git ignores none of ${generated[*]}" ;;
            *) fail "git check-ignore failed with exit $ignore_status" ;;
          esac

          # git diff alone would miss a file the regeneration adds and the commit lacks.
          changes="$(git status --porcelain --untracked-files=all -- "${generated[@]}")"
          if [ -n "$changes" ]; then
            echo "::error::the regeneration changed, added or deleted generated files:"
            printf '%s\n' "$changes"
            git diff -- "${generated[@]}"
            exit 1
          fi
          echo "the regeneration of ${generated[*]} matches the commit"

      - name: Create the k3d cluster with its registry
        id: create-cluster
        run: |
          # k3d only warns about a missing volume source, and k3s would start on its defaults.
          [ -f "$K3S_CONFIG_SOURCE" ] || { echo "::error::$K3S_CONFIG_SOURCE is missing"; exit 1; }
          # The file alone at k3s's default path, the one the PC uses: k3d writes registries.yaml beside it.
          # k3d's DNS fix DNATs pod DNS to Docker's 127.0.0.11, which the kernel drops unless route_localnet is 1: the
          # shared file's iptables-localhost-nodeports=false keeps it 0, so CoreDNS would answer SERVFAIL.
          K3D_FIX_DNS=0 k3d cluster create "$CLUSTER_NAME" --image "rancher/k3s:${K3S_VERSION//+/-}" \
            --volume "$PWD/$K3S_CONFIG_SOURCE:/etc/rancher/k3s/config.yaml:ro@server:0" \
            --registry-create "${REGISTRY_NAME}:127.0.0.1:${REGISTRY_PORT}" --enforce-registry-port-match \
            --wait --timeout 3m

      - name: Apply the Flux controllers from the committed components
        run: |
          kubectl apply --server-side -f clusters/pc/flux-system/gotk-components.yaml
          kubectl -n flux-system wait deployment --all --for=condition=Available --timeout=3m

      # flux install writes a binding subject for every controller, omitted ones included.
      - name: Assert that no binding names the removed helm-controller
        run: |
          bindings="$(kubectl get clusterrolebindings,rolebindings --all-namespaces \
            -o jsonpath='{range .items[*]}{.kind}{" "}{.metadata.name}{"|"}{range .subjects[*]}{.kind}{"/"}{.namespace}{"/"}{.name}{" "}{end}{"\n"}{end}')"
          holders="$(grep -F 'ServiceAccount/flux-system/helm-controller' <<<"$bindings" || true)"
          if [ -n "$holders" ]; then
            echo "::error::these bindings name the ServiceAccount helm-controller, which no Deployment runs:"
            printf '%s\n' "$holders"
            exit 1
          fi
          echo "no binding names the ServiceAccount flux-system/helm-controller"

      - name: Assert that k3s runs with host/k3s/config.yaml
        run: |
          fail() { echo "::error::$1"; exit 1; }
          server="k3d-${CLUSTER_NAME}-server-0"

          # k3s stages its manifests in one pass before it deploys coredns, so the set is final once that Deployment
          # exists. Flux owns everything else in the cluster.
          kubectl -n kube-system wait deployment/coredns --for=create --timeout=3m
          own_manifests="$(printf '%s\n' ccm coredns metrics-server rolebindings | sort)"
          staged_manifests="$(docker exec "$server" ls -1A /var/lib/rancher/k3s/server/manifests |
            sed 's/\.yaml$//' | sort)"
          mismatch="$(comm -3 <(printf '%s\n' "$own_manifests") <(printf '%s\n' "$staged_manifests"))"
          if [ -n "$mismatch" ]; then
            while IFS= read -r manifest; do
              case "$manifest" in
                $'\t'*) echo "::error::k3s staged ${manifest#$'\t'}, outside the manifests Flux leaves to k3s" ;;
                *) echo "::error::k3s did not stage its own manifest $manifest" ;;
              esac
            done <<<"$mismatch"
            exit 1
          fi
          sed 's/^/k3s staged: /' <<<"$staged_manifests"
          helm_crds="$(kubectl get crd \
            -o jsonpath='{range .items[?(@.spec.group=="helm.cattle.io")]}{.metadata.name}{" "}{end}')"
          [ -z "$helm_crds" ] || fail "k3s registered the helm.cattle.io CRDs $helm_crds"
          echo "no helm.cattle.io CRD exists"

          kubectl wait node --all --for=condition=Ready --timeout=3m
          nodes="$(kubectl get nodes -o name)"
          [ "$(wc -l <<<"$nodes")" -eq 1 ] || fail "the cluster has not exactly one Node: ${nodes//$'\n'/ }"
          node="${nodes#node/}"
          # k3s records its arguments with the config file merged in; k3d passes no --node-name, so it is the file's.
          node_args="$(kubectl get node "$node" -o jsonpath='{.metadata.annotations.k3s\.io/node-args}')"
          recorded_name="$(grep -oP '"--node-name","\K[^"]*' <<<"$node_args" || true)"
          [ -n "$recorded_name" ] || fail "k3s recorded no --node-name for the Node $node"
          [ "$node" = "$recorded_name" ] || fail "the Node $node is not named $recorded_name, the --node-name k3s recorded"
          echo "the one Node is Ready and carries the --node-name k3s recorded: $node"

          # The API server reaches the kubelet under the Node's name for logs and for the metrics API.
          kubectl -n kube-system wait deployment/coredns --for=condition=Available --timeout=3m
          kubectl -n kube-system logs deployment/coredns --tail=1
          kubectl wait apiservice v1beta1.metrics.k8s.io --for=condition=Available --timeout=3m
          echo "logs and the metrics API reach the kubelet of $node"

          encryption="$(docker exec "$server" k3s secrets-encrypt status)"
          grep -qx 'Encryption Status: Enabled' <<<"$encryption" ||
            fail "k3s reports secrets encryption as: $(head -n 1 <<<"$encryption")"
          echo "k3s reports secrets encryption Enabled"

          # The Flux controllers reached the API through the kubernetes Service, so kube-proxy has started.
          route_localnet="$(docker exec "$server" cat /proc/sys/net/ipv4/conf/all/route_localnet)"
          [ "$route_localnet" = 0 ] || fail "net.ipv4.conf.all.route_localnet is $route_localnet in $server, not 0"
          echo "net.ipv4.conf.all.route_localnet is 0 in $server"

      - name: Encrypt a dummy Secret and the app's Secrets to a throwaway age key
        env:
          # The app's pull Secret holds this job's own token, which GitHub masks; the app's package grants it Read.
          PULL_USER: ${{ github.actor }}
          PULL_TOKEN: ${{ github.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          # The key, the values and the plain manifests exist only in this runner's temp directory; no step prints them.
          umask 077
          private_dir="$RUNNER_TEMP/decryption-proof"
          artifact_dir="$RUNNER_TEMP/platform-secrets"
          mkdir "$private_dir" "$artifact_dir"
          key_file="$private_dir/ci.agekey"
          age-keygen -o "$key_file" 2>/dev/null
          # Each Secret's data holds the files of its own directory, keyed by file name.
          files_dir="$private_dir/files"
          plain_files=()
          secret_files() { mkdir -p "$files_dir/$1" && echo "$files_dir/$1"; }
          plain_secret() {
            local file
            plain_files+=("$private_dir/$1.yaml")
            NAME="$1" NAMESPACE="$2" TYPE="$3" yq --null-input \
              '{"apiVersion": "v1", "kind": "Secret", "metadata": {"name": strenv(NAME), "namespace": strenv(NAMESPACE)}, "type": strenv(TYPE)}' \
              > "${plain_files[-1]}"
            while IFS= read -r file; do
              KEY="${file##*/}" FILE="$file" yq --inplace '.data[strenv(KEY)] = (load_str(strenv(FILE)) | @base64)' "${plain_files[-1]}"
            done < <(find "$files_dir/$1" -maxdepth 1 -type f | sort)
          }

          # Eighteen fixed characters, a multiple of three, so the dummy's base64 form starts with a fixed string too.
          dummy="platform-ci-dummy-$(openssl rand -hex 16)"
          echo "::add-mask::$dummy"
          echo "::add-mask::$(printf '%s' "$dummy" | base64 --wrap=0)"
          dummy_file="$(secret_files "$PROOF_SECRET_NAME")/value"
          printf '%s' "$dummy" > "$dummy_file"
          plain_secret "$PROOF_SECRET_NAME" "$PROOF_SECRET_NAMESPACE" Opaque

          # The app's files as dummies, one per key the PC's Secret holds; hex meets the TURN files' grammar, and 64
          # characters the session secret's minimum.
          deployment="$(yq 'select(.kind == "Deployment")' "$APP_MANIFEST")"
          app_namespace="$(yq '.metadata.namespace' <<<"$deployment")"
          app_secret="$(yq '.spec.template.spec.volumes[] | select(.secret) | .secret.secretName' <<<"$deployment")"
          pull_secret="$(yq '.spec.template.spec.imagePullSecrets[].name' <<<"$deployment")"
          app_files="$(secret_files "$app_secret")"
          for key in oidc_client_secret session_secret turn_key_id turn_api_token; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            printf '%s' "$value" > "$app_files/$key"
          done
          plain_secret "$app_secret" "$app_namespace" Opaque
          auth="$(printf '%s:%s' "$PULL_USER" "$PULL_TOKEN" | base64 --wrap=0)"
          echo "::add-mask::$auth"
          pull_file="$(secret_files "$pull_secret")/.dockerconfigjson"
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" > "$pull_file"
          echo "::add-mask::$(base64 --wrap=0 < "$pull_file")"
          plain_secret "$pull_secret" "$app_namespace" kubernetes.io/dockerconfigjson

          # The recipient is the key's public half, so sops encrypts without reading any private key.
          recipient="$(age-keygen -y "$key_file")"
          data_values() { yq '.data // {} | .[]' "$1"; }
          for plain_file in "${plain_files[@]}"; do
            encrypted_file="$artifact_dir/${plain_file##*/}"
            sops --encrypt --age "$recipient" --encrypted-regex '^(data|stringData)$' "$plain_file" > "$encrypted_file"

            # Flux applies a value left outside the encrypted fields as it is, which would fake the proof or leak it.
            encrypted="$(<"$encrypted_file")"
            while IFS= read -r value; do
              [[ $encrypted != *"$value"* && $encrypted != *"$(base64 --decode <<<"$value")"* ]] ||
                fail "$encrypted_file holds a value in plain text"
            done < <(data_values "$plain_file")
            values="$(data_values "$encrypted_file")"
            [ -n "$values" ] || fail "$encrypted_file holds no data value"
            while IFS= read -r value; do
              [[ $value == 'ENC['* ]] || fail "a data value in $encrypted_file is not sops ciphertext"
            done <<<"$values"
            echo "every data value in $encrypted_file is sops ciphertext, and no plain value is in it"
          done

          {
            echo "AGE_KEY_FILE=$key_file"
            echo "DUMMY_FILE=$dummy_file"
            echo "SECRETS_ARTIFACT_DIR=$artifact_dir"
          } >> "$GITHUB_ENV"

      - name: Push the encrypted Secrets and serve them as the job's platform-secrets source
        run: |
          repository=platform-secrets
          tag=candidate
          flux push artifact "oci://localhost:${REGISTRY_PORT}/${repository}:${tag}" --path="$SECRETS_ARTIFACT_DIR" \
            --source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --revision="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}@sha1:$CANDIDATE_REVISION" --insecure-registry

          # Applied outside Flux's inventory: the root's patches point the Kustomization platform-secrets at it.
          source="$(cat <<'YAML'
          apiVersion: source.toolkit.fluxcd.io/v1
          kind: OCIRepository
          metadata:
            name: platform-secrets
            namespace: flux-system
          spec:
            interval: 1m0s
            url: oci://@REPOSITORY@
            ref:
              tag: @TAG@
            insecure: true
          YAML
          )"
          source="${source//@REPOSITORY@/${REGISTRY_NAME}:${REGISTRY_PORT}/${repository}}"
          printf '%s\n' "${source//@TAG@/${tag}}" | kubectl apply --server-side -f -

      - name: Create the Secret sops-age with the task the PC bootstrap runs
        run: mise run secrets:age-secret "$AGE_KEY_FILE"

      - name: Dry-run the layer files on the API server
        run: kubectl apply --server-side --dry-run=server -f clusters/pc

      - name: Check that the committed root and tunnel carry no spec.patches
        run: |
          # The job root's overlay adds spec.patches to both, which would replace committed ones without a word (RFC 6902
          # add).
          fail() { echo "::error::$1"; exit 1; }
          root_file=clusters/pc/flux-system/gotk-sync.yaml
          objects="$(kubectl create --dry-run=client -f "$root_file" \
            -o go-template='{{.kind}}{{if .spec.patches}} with spec.patches{{end}}{{"\n"}}')"
          case "$(grep '^Kustomization' <<<"$objects" || true)" in
            Kustomization) echo "the root Kustomization in $root_file carries no spec.patches" ;;
            "Kustomization with spec.patches")
              fail "the root Kustomization in $root_file carries spec.patches, which the job root's overlay would replace" ;;
            *) fail "$root_file holds not exactly one Kustomization" ;;
          esac
          tunnel_file=clusters/pc/infrastructure.yaml
          tunnel="$(kubectl create --dry-run=client -f "$tunnel_file" -o go-template='{{if eq .metadata.name "tunnel"}}
            {{- .kind}}{{if .spec.patches}} with spec.patches{{end}}{{"\n"}}{{end}}')"
          case "$tunnel" in
            Kustomization) echo "the Kustomization tunnel in $tunnel_file carries no spec.patches" ;;
            "Kustomization with spec.patches")
              fail "the Kustomization tunnel in $tunnel_file carries spec.patches, which the job root's patch would replace" ;;
            *) fail "$tunnel_file holds not exactly one Kustomization tunnel" ;;
          esac

      - name: Reconcile the candidate tree
        run: |
          # The job root is the PC's own clusters/pc/flux-system as a kustomize base, no file copied. The overlay adds
          # only Flux's spec.patches on the root and, on a pull request, the pull request's ref.
          overlay="$RUNNER_TEMP/candidate-root"
          mkdir "$overlay"
          printf 'resources:\n  - %s\n' "$(realpath --relative-to="$overlay" clusters/pc/flux-system)" \
            > "$overlay/kustomization.yaml"
          cat >> "$overlay/kustomization.yaml" <<'YAML'
          patches:
            - target: {group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: flux-system}
              patch: |
                - op: add
                  path: /spec/patches
                  value:
                    # The committed self-Kustomization would replace this object and its patches.
                    - target: {group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: flux-system}
                      patch: |
                        $patch: delete
                        apiVersion: kustomize.toolkit.fluxcd.io/v1
                        kind: Kustomization
                        metadata: {name: flux-system, namespace: flux-system}
                    # The PC-only sources: CI never fetches them, and their consumers run on the job's own source.
                    - target: {group: source.toolkit.fluxcd.io, kind: GitRepository, name: platform-secrets}
                      patch: |
                        $patch: delete
                        apiVersion: source.toolkit.fluxcd.io/v1
                        kind: GitRepository
                        metadata: {name: platform-secrets, namespace: flux-system}
                    - target: {group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: platform-secrets}
                      patch: |
                        - op: replace
                          path: /spec/sourceRef/kind
                          value: OCIRepository
                    # cloudflared's manifests apply, but no pod runs: its token is the PC's alone.
                    - target: {group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: tunnel}
                      patch: |
                        - op: add
                          path: /spec/patches
                          value:
                            - target: {group: apps, kind: Deployment, name: cloudflared}
                              patch: |
                                - op: replace
                                  path: /spec/replicas
                                  value: 0
          YAML
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            pull_request_patches="$(cat <<'YAML'
            # The source follows the pull request's head, in the object applied here and in Flux's build.
            - target: {group: source.toolkit.fluxcd.io, kind: GitRepository, name: flux-system}
              patch: |
                - op: replace
                  path: /spec/ref
                  value: {name: @PULL_REQUEST_REF@}
            - target: {group: kustomize.toolkit.fluxcd.io, kind: Kustomization, name: flux-system}
              patch: |
                - op: add
                  path: /spec/patches/-
                  value:
                    target: {group: source.toolkit.fluxcd.io, kind: GitRepository, name: flux-system}
                    patch: |
                      - op: replace
                        path: /spec/ref
                        value: {name: @PULL_REQUEST_REF@}
          YAML
            )"
            printf '%s\n' "${pull_request_patches//@PULL_REQUEST_REF@/${PULL_REQUEST_REF}}" >> "$overlay/kustomization.yaml"
          fi
          kubectl apply --server-side -k "$overlay"
          kubectl -n flux-system get kustomization flux-system -o yaml

      - name: Assert that Flux reconciled the candidate commit and decrypted the dummy
        run: |
          fail() { echo "::error::$1"; exit 1; }
          inventory() {
            kubectl -n flux-system get kustomization flux-system \
              -o jsonpath='{range .status.inventory.entries[*]}{.id}{"\n"}{end}'
          }
          assert_job_source() {
            local kind entries value
            kind="$(kubectl -n flux-system get kustomization platform-secrets -o jsonpath='{.spec.sourceRef.kind}')"
            [ "$kind" = OCIRepository ] || fail "the Kustomization platform-secrets runs on a $kind, not the job's OCIRepository"
            echo "the Kustomization platform-secrets runs on the job's OCIRepository"
            [ -z "$(kubectl -n flux-system get gitrepository platform-secrets --ignore-not-found -o name)" ] ||
              fail "the GitRepository platform-secrets exists, though CI never fetches it"
            echo "no GitRepository platform-secrets exists"
            entries="$(inventory)"
            for entry in flux-system_flux-system_kustomize.toolkit.fluxcd.io_Kustomization \
              flux-system_platform-secrets_source.toolkit.fluxcd.io_GitRepository; do
              if grep -qxF "$entry" <<<"$entries"; then fail "the flux-system inventory holds $entry"; fi
              echo "inventory lacks: $entry"
            done
            value="$(kubectl -n "$PROOF_SECRET_NAMESPACE" get secret "$PROOF_SECRET_NAME" -o jsonpath='{.data.value}' |
              base64 --decode)"
            [ "$value" = "$(<"$DUMMY_FILE")" ] || fail "the Secret $PROOF_SECRET_NAME does not hold the dummy"
            echo "the Secret $PROOF_SECRET_NAME, decrypted by Flux, holds the dummy the job generated"
          }

          kubectl -n flux-system wait gitrepository/flux-system --for=condition=Ready --timeout=3m
          kubectl -n flux-system wait kustomization/flux-system --for=condition=Ready --timeout=5m
          kubectl wait kustomizations.kustomize.toolkit.fluxcd.io --all --all-namespaces --for=condition=Ready --timeout=5m
          kubectl -n flux-system get gitrepository flux-system -o yaml

          source_revision="$(kubectl -n flux-system get gitrepository flux-system -o jsonpath='{.status.artifact.revision}')"
          applied_revision="$(kubectl -n flux-system get kustomization flux-system -o jsonpath='{.status.lastAppliedRevision}')"
          for revision in "$source_revision" "$applied_revision"; do
            [ "${revision##*@sha1:}" = "$CANDIDATE_REVISION" ] || fail "revision '$revision' is not the candidate $CANDIDATE_REVISION"
          done
          echo "candidate revision:                   $CANDIDATE_REVISION"
          echo "GitRepository artifact revision:      $source_revision"
          echo "Kustomization lastAppliedRevision:    $applied_revision"

          entries="$(inventory)"
          for entry in flux-system_flux-system_source.toolkit.fluxcd.io_GitRepository \
            flux-system_source-controller_apps_Deployment flux-system_kustomize-controller_apps_Deployment \
            flux-system_notification-controller_apps_Deployment; do
            grep -qxF "$entry" <<<"$entries" || fail "the flux-system inventory lacks $entry"
            echo "inventory holds: $entry"
          done

          # The root health-checks exactly the Deployments in its inventory and its own source, compared as
          # inventory ids so that kind and namespace count; an unset namespace is the root's, as in Flux.
          root_namespace=flux-system
          health_checks="$(kubectl -n "$root_namespace" get kustomization flux-system \
            -o jsonpath='{range .spec.healthChecks[*]}{.namespace}{"|"}{.name}{"|"}{.apiVersion}{"|"}{.kind}{"\n"}{end}')"
          health_check_ids="$(while IFS='|' read -r namespace name api_version kind; do
              group=""
              [[ $api_version != */* ]] || group="${api_version%/*}"
              echo "${namespace:-$root_namespace}_${name}_${group}_${kind}"
            done <<<"$health_checks" | sort -u)"
          source_ref="$(kubectl -n "$root_namespace" get kustomization flux-system \
            -o jsonpath='{.spec.sourceRef.namespace}{"|"}{.spec.sourceRef.name}{"|"}{.spec.sourceRef.kind}')"
          IFS='|' read -r source_namespace source_name source_kind <<<"$source_ref"
          expected_ids="$( {
              grep -E '_Deployment$' <<<"$entries" || true
              grep -E "^${source_namespace:-$root_namespace}_${source_name}_[^_]*_${source_kind}\$" <<<"$entries" || true
            } | sort -u)"
          mismatch="$(comm -3 <(printf '%s\n' "$expected_ids") <(printf '%s\n' "$health_check_ids"))"
          if [ -n "$mismatch" ]; then
            while IFS= read -r id; do
              case "$id" in
                $'\t'*) echo "::error::the root health-checks ${id#$'\t'}, neither a Deployment in its inventory nor its own source" ;;
                *) echo "::error::the root's inventory holds $id without a health check" ;;
              esac
            done <<<"$mismatch"
            exit 1
          fi
          sed 's/^/the root health-checks: /' <<<"$health_check_ids"

          assert_job_source

          # allow-scraping only admits metrics scrapes; deleting allow-egress would cut the controllers off each other.
          kubectl -n flux-system delete networkpolicy allow-scraping
          flux reconcile kustomization flux-system --with-source --timeout=5m
          kubectl -n flux-system get networkpolicy allow-scraping

          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            source_ref="$(kubectl -n flux-system get gitrepository flux-system -o jsonpath='{.spec.ref.name}')"
            [ "$source_ref" = "$PULL_REQUEST_REF" ] || fail "the source ref '$source_ref' left $PULL_REQUEST_REF"
          else
            source_ref="$(kubectl -n flux-system get gitrepository flux-system -o go-template='{{.spec.ref}}')"
            committed_ref="$(kubectl create --dry-run=client -f clusters/pc/flux-system/gotk-sync.yaml \
              -o go-template='{{if eq .kind "GitRepository"}}{{.spec.ref}}{{end}}')"
            [ "$source_ref" = "$committed_ref" ] || fail "the source ref '$source_ref' is not the committed '$committed_ref'"
          fi
          echo "GitRepository spec.ref after the reconcile: $source_ref"
          assert_job_source

      - name: Assert that Traefik runs from its render, ClusterIP only, and answers 404 for an unrouted host
        env:
          # The client Pod's own namespace, outside Traefik's.
          CLIENT_NAMESPACE: ingress-client
        run: |
          fail() { echo "::error::$1"; exit 1; }
          applied_revision="$(kubectl -n flux-system get kustomization traefik -o jsonpath='{.status.lastAppliedRevision}')"
          [ "${applied_revision##*@sha1:}" = "$CANDIDATE_REVISION" ] ||
            fail "the Kustomization traefik applied '$applied_revision', not the candidate $CANDIDATE_REVISION"
          kubectl -n traefik wait deployment/traefik --for=condition=Available --timeout=3m
          echo "the Kustomization traefik applied the candidate, and the Deployment traefik is Available"

          # Charts reach the cluster only as committed manifests: no HelmRelease can exist, as its CRD is not installed,
          # and the job's own platform-secrets source is no chart.
          helm_release_crd="$(kubectl get crd --ignore-not-found helmreleases.helm.toolkit.fluxcd.io -o name)"
          [ -z "$helm_release_crd" ] || fail "the cluster holds the CRD $helm_release_crd"
          sources="$(kubectl get ocirepositories.source.toolkit.fluxcd.io -A \
            -o jsonpath='{range .items[*]}{.kind}/{.metadata.namespace}/{.metadata.name}{"\n"}{end}')"
          chart_sources="$(grep -vxF OCIRepository/flux-system/platform-secrets <<<"$sources" || true)"
          [ -z "$chart_sources" ] || fail "the cluster holds ${chart_sources//$'\n'/ }"
          echo "no HelmRelease CRD and no OCIRepository beyond the job's platform-secrets source exists"
          traefik_crds="$(kubectl get crd -o jsonpath='{range .items[*]}{.spec.group} {.metadata.name}{"\n"}{end}' |
            awk '$1 == "traefik.io" || $1 == "hub.traefik.io" { print $2 }')"
          [ -z "$traefik_crds" ] || fail "the cluster holds Traefik's CRDs ${traefik_crds//$'\n'/ }"
          echo "no traefik.io or hub.traefik.io CRD exists"

          # A NodePort, a LoadBalancer, a hostPort or the host network takes the forward path ufw's input rules never see.
          traefik_service="$(kubectl -n traefik get service traefik -o jsonpath='{.spec.type}{range .spec.ports[*]} {.name}{end}')"
          [ "$traefik_service" = "ClusterIP web" ] ||
            fail "the Service traefik is '$traefik_service', not ClusterIP with the one port web"
          echo "the Service traefik is ClusterIP with the one port web"
          exposed=""
          services="$(kubectl get services -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}|{.spec.type}{"\n"}{end}')"
          while IFS='|' read -r service type; do
            case "$type" in NodePort | LoadBalancer) exposed+="the Service $service is a $type"$'\n' ;; esac
          done <<<"$services"
          pods="$(kubectl get pods -A -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}|{.spec.hostNetwork}|{.spec.initContainers[*].ports[*].hostPort} {.spec.containers[*].ports[*].hostPort}{"\n"}{end}')"
          while IFS='|' read -r pod host_network host_ports; do
            [ "$host_network" != true ] || exposed+="the Pod $pod uses the host network"$'\n'
            [ -z "${host_ports// /}" ] || exposed+="the Pod $pod binds the host ports $host_ports"$'\n'
          done <<<"$pods"
          if [ -n "$exposed" ]; then
            while IFS= read -r finding; do [ -z "$finding" ] || echo "::error::$finding"; done <<<"$exposed"
            exit 1
          fi
          echo "no NodePort or LoadBalancer Service and no Pod on a host port or the host network exists"

          web_port="$(kubectl -n traefik get service traefik -o jsonpath='{.spec.ports[?(@.name=="web")].port}')"
          kubectl create namespace "$CLIENT_NAMESPACE"
          kubectl -n "$CLIENT_NAMESPACE" run unrouted-request --image="$CLIENT_IMAGE" --restart=Never -- \
            --silent --output /dev/null --write-out '%{http_code}' --max-time 10 \
            --retry 5 --retry-connrefused --retry-delay 2 --header "Host: $UNROUTED_HOST" "http://traefik.traefik.svc:$web_port/"
          kubectl -n "$CLIENT_NAMESPACE" wait pod/unrouted-request --for=jsonpath='{.status.phase}'=Succeeded --timeout=2m || {
            kubectl -n "$CLIENT_NAMESPACE" describe pod/unrouted-request
            kubectl -n "$CLIENT_NAMESPACE" logs pod/unrouted-request || true
            fail "the client Pod did not succeed"
          }
          status="$(kubectl -n "$CLIENT_NAMESPACE" logs pod/unrouted-request)"
          kubectl delete namespace "$CLIENT_NAMESPACE" --wait --timeout=2m
          [ -z "$(kubectl get namespace "$CLIENT_NAMESPACE" --ignore-not-found -o name)" ] ||
            fail "the namespace $CLIENT_NAMESPACE outlived its deletion"
          [ "$status" = 404 ] || fail "Traefik answered $status, not 404, for the unrouted host $UNROUTED_HOST"
          echo "Traefik answered 404 for the unrouted host $UNROUTED_HOST, and the client Pod is gone"

      - name: Assert that the app runs at its full app ref after platform-secrets, pulled through its pull Secret
        env:
          APP_LAYER: flux-system/apps
          SECRETS_LAYER: flux-system/platform-secrets
        run: |
          fail() { echo "::error::$1"; exit 1; }
          layer() { kubectl --namespace "${1%/*}" get kustomization "${1#*/}" -o jsonpath="$2"; }
          applied_revision="$(layer "$APP_LAYER" '{.status.lastAppliedRevision}')"
          [ "${applied_revision##*@sha1:}" = "$CANDIDATE_REVISION" ] ||
            fail "the Kustomization $APP_LAYER applied '$applied_revision', not the candidate $CANDIDATE_REVISION"
          [[ " $(layer "$APP_LAYER" '{.spec.dependsOn[*].name}') " == *" ${SECRETS_LAYER#*/} "* ]] ||
            fail "the Kustomization $APP_LAYER does not depend on $SECRETS_LAYER"
          echo "the Kustomization $APP_LAYER applied the candidate and depends on $SECRETS_LAYER"

          deployment="$(yq 'select(.kind == "Deployment") | .metadata.namespace + "/" + .metadata.name' "$APP_MANIFEST")"
          namespace="${deployment%/*}" name="${deployment#*/}"
          markers="$(kubectl get namespace "$namespace" \
            -o jsonpath='{.metadata.labels.pod-security\.kubernetes\.io/enforce}|{.metadata.annotations.kustomize\.toolkit\.fluxcd\.io/prune}')"
          [ "$markers" = "restricted|disabled" ] ||
            fail "the Namespace $namespace reads '$markers', not Pod Security restricted and prune disabled"
          echo "the Namespace $namespace enforces restricted, and Flux never prunes it"

          kubectl --namespace "$namespace" wait "deployment/$name" --for=condition=Available --timeout=3m
          state="$(kubectl --namespace "$namespace" get deployment "$name" -o jsonpath='{.status.readyReplicas}|{.spec.strategy.type}')"
          [ "$state" = "1|Recreate" ] || fail "the Deployment $deployment reads '$state', not one Ready pod and Recreate"
          image="$(kubectl --namespace "$namespace" get deployment "$name" -o jsonpath='{.spec.template.spec.containers[*].image}')"
          [[ $image =~ ^ghcr[.]io/${GITHUB_REPOSITORY_OWNER,,}/[^[:space:]:@]+:[^[:space:]@]+@sha256:[0-9a-f]{64}$ ]] ||
            fail "the Deployment $deployment runs '$image', not one full app ref"
          echo "the Deployment $deployment is Available with one Ready pod, Recreate, and runs the full app ref $image"

          # The Secrets the pod pulls and starts from are platform-secrets' objects, there before the Deployment.
          created="$(kubectl --namespace "$namespace" get deployment "$name" -o jsonpath='{.metadata.creationTimestamp}')"
          secrets_inventory="$(layer "$SECRETS_LAYER" '{range .status.inventory.entries[*]}{.id}{"\n"}{end}')"
          pull_secrets="$(kubectl --namespace "$namespace" get deployment "$name" -o jsonpath='{.spec.template.spec.imagePullSecrets[*].name}')"
          [ -n "$pull_secrets" ] || fail "the Deployment $deployment names no pull Secret"
          for secret in $pull_secrets $(kubectl --namespace "$namespace" get deployment "$name" \
            -o jsonpath='{.spec.template.spec.volumes[*].secret.secretName}'); do
            grep -qxF "${namespace}_${secret}__Secret" <<<"$secrets_inventory" ||
              fail "the Secret $namespace/$secret is not in the inventory of $SECRETS_LAYER"
            secret_created="$(kubectl --namespace "$namespace" get secret "$secret" -o jsonpath='{.metadata.creationTimestamp}')"
            [[ ! $created < "$secret_created" ]] ||
              fail "the Deployment $deployment was created at $created, before its Secret $secret at $secret_created"
            echo "the Secret $namespace/$secret of $SECRETS_LAYER was created at $secret_created, not after the Deployment at $created"
          done
          for secret in $pull_secrets; do
            type="$(kubectl --namespace "$namespace" get secret "$secret" -o jsonpath='{.type}')"
            [ "$type" = kubernetes.io/dockerconfigjson ] || fail "the pull Secret $namespace/$secret is of type $type"
          done
          echo "the Deployment $deployment pulled its private image through $pull_secrets"

      - name: SCRATCH H15, S5a reverted while its Secrets stay, then the control without the prune annotation
        run: |
          set +eu
          overlay="$RUNNER_TEMP/candidate-root"
          problems=0
          expect() {
            if eval "$2" >/dev/null 2>&1; then echo "EXPECT-HELD: $1"; else echo "EXPECT-FAILED: $1"; problems=$((problems + 1)); fi
          }
          wait_until() {
            local deadline=$((SECONDS + $1))
            until eval "$2" >/dev/null 2>&1; do
              [ "$SECONDS" -lt "$deadline" ] || { echo "TIMEOUT after $1 s waiting for: $2"; return 1; }
              sleep 5
            done
          }
          ready() { kubectl -n flux-system get kustomization "$1" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'; }
          move_source_to() {
            sed -i "s#{name: ${PULL_REQUEST_REF}}#{branch: $1}#g; s#{branch: [^}]*}#{branch: $1}#g" "$overlay/kustomization.yaml"
            echo "overlay lines naming the branch: $(grep -c "branch: $1" "$overlay/kustomization.yaml")"
            kubectl apply --server-side --force-conflicts -k "$overlay" >/dev/null
            flux reconcile kustomization flux-system --with-source --timeout=5m
            echo "GitRepository follows $(kubectl -n flux-system get gitrepository flux-system -o jsonpath='{.spec.ref}') at $(kubectl -n flux-system get gitrepository flux-system -o jsonpath='{.status.artifact.revision}')"
          }
          show_state() {
            echo "-- Kustomizations: name | conditions"
            kubectl -n flux-system get kustomization -o jsonpath='{range .items[*]}{.metadata.name}{" | rev="}{.status.lastAppliedRevision}{" | "}{range .status.conditions[*]}{.type}={.status}({.reason}): {.message}{" ; "}{end}{"\n"}{end}'
            echo "-- namespaces inventory: $(kubectl -n flux-system get kustomization namespaces -o jsonpath='{range .status.inventory.entries[*]}{.id}{" "}{end}')"
            echo "-- namespace hopin: $(kubectl get namespace hopin -o jsonpath='phase={.status.phase} prune={.metadata.annotations.kustomize\.toolkit\.fluxcd\.io/prune}' 2>&1)"
            echo "-- objects in hopin:"
            kubectl -n hopin get deployments,services,secrets 2>&1
          }
          source_revision() { kubectl -n flux-system get gitrepository flux-system -o jsonpath='{.status.artifact.revision}'; }

          echo "##### phase 1: S5a reconciled (the steps before this one hold apps Ready and hopin Available)"
          show_state

          echo "##### phase 2: the GitRepository moves to a commit without S5a's Deployment, Service, apps and Namespace hopin; the Secrets stay"
          move_source_to scratch/82-h15-b
          wait_until 300 '! kubectl -n flux-system get kustomization apps'
          wait_until 300 '! kubectl -n hopin get deployment hopin'
          flux reconcile kustomization namespaces --timeout=3m
          flux reconcile kustomization platform-secrets --timeout=3m
          show_state
          expect "phase 2: the Kustomization apps is gone" '! kubectl -n flux-system get kustomization apps'
          expect "phase 2: the Deployment hopin is gone" '! kubectl -n hopin get deployment hopin'
          expect "phase 2: the Service hopin is gone" '! kubectl -n hopin get service hopin'
          expect "phase 2: the Namespace hopin is Active" '[ "$(kubectl get namespace hopin -o jsonpath="{.status.phase}")" = Active ]'
          expect "phase 2: the Secrets hopin and ghcr-pull are still there" 'kubectl -n hopin get secret hopin ghcr-pull'
          expect "phase 2: namespaces is Ready at the new revision" '[ "$(ready namespaces)" = True ] && [ "$(kubectl -n flux-system get kustomization namespaces -o jsonpath="{.status.lastAppliedRevision}")" = "$(source_revision)" ]'
          expect "phase 2: platform-secrets is Ready" '[ "$(ready platform-secrets)" = True ]'

          echo "##### phase 3: back to S5a without the Namespace's prune annotation (the control's start)"
          move_source_to scratch/82-h15-c
          wait_until 360 '[ "$(ready apps)" = True ]'
          wait_until 120 'kubectl -n hopin wait deployment/hopin --for=condition=Available --timeout=5s'
          show_state
          if [ -n "$(kubectl get namespace hopin -o jsonpath='{.metadata.annotations.kustomize\.toolkit\.fluxcd\.io/prune}')" ]; then
            echo "NOTE: the live Namespace kept its annotation after the apply; removing it by hand for the control"
            kubectl annotate namespace hopin kustomize.toolkit.fluxcd.io/prune-
          fi
          expect "phase 3: the Namespace hopin carries no prune annotation" '[ -z "$(kubectl get namespace hopin -o jsonpath="{.metadata.annotations.kustomize\.toolkit\.fluxcd\.io/prune}")" ]'
          expect "phase 3: apps is Ready" '[ "$(ready apps)" = True ]'

          echo "##### phase 4 (control): the commit without S5a's manifests, the Namespace unprotected"
          move_source_to scratch/82-h15-d
          wait_until 360 '! kubectl get namespace hopin'
          flux reconcile kustomization platform-secrets --timeout=3m
          wait_until 120 '[ "$(ready platform-secrets)" != True ]'
          show_state
          expect "phase 4: the Namespace hopin is deleted" '! kubectl get namespace hopin'
          expect "phase 4: platform-secrets is not Ready" '[ "$(ready platform-secrets)" != True ]'
          expect "phase 4: platform-secrets names the missing namespace hopin" 'kubectl -n flux-system get kustomization platform-secrets -o jsonpath="{.status.conditions[?(@.type==\"Ready\")].message}" | grep -q hopin'
          echo "problems: $problems"
          [ "$problems" = 0 ]

      - name: SCRATCH diagnostics
        if: always() && steps.create-cluster.outcome == 'success'
        run: |
          set +e
          echo "== Kustomizations: name | conditions"
          kubectl -n flux-system get kustomization -o jsonpath='{range .items[*]}{.metadata.name}{" | "}{range .status.conditions[*]}{.type}={.status}({.reason}): {.message}{" ; "}{end}{"\n"}{end}'
          echo "== namespace hopin"
          kubectl get namespace hopin -o jsonpath='{.metadata.name} phase={.status.phase} prune={.metadata.annotations.kustomize\.toolkit\.fluxcd\.io/prune}{"\n"}'
          echo "== objects in hopin"
          kubectl -n hopin get deployments,services,secrets,pods -o wide
          echo "== events in hopin"
          kubectl -n hopin get events --sort-by=.lastTimestamp -o jsonpath='{range .items[*]}{.type}/{.reason}: {.message}{"\n"}{end}'
          echo "== log of every hopin pod, last 50 lines"
          : > "$RUNNER_TEMP/hopin-pod.log"
          for pod in $(kubectl -n hopin get pods -o name); do
            echo "-- $pod"
            kubectl -n hopin logs "$pod" --all-containers --tail=50 2>&1 | tee -a "$RUNNER_TEMP/hopin-pod.log"
          done
          echo "== occurrences of each Secret file's value in that log (counts only)"
          for value_file in "$RUNNER_TEMP"/decryption-proof/files/hopin/* "$RUNNER_TEMP"/decryption-proof/files/ghcr-pull/*; do
            [ -s "$value_file" ] || continue
            echo "${value_file##*/}: $(grep -cF -f "$value_file" "$RUNNER_TEMP/hopin-pod.log")"
          done
          true

      - name: Print Flux's state and the controllers' errors
        if: failure() && steps.create-cluster.outcome == 'success'
        run: |
          flux get all --all-namespaces
          flux logs --all-namespaces --level=error
          # Pod Security's refusal of a Pod appears only in Warning events and the workloads' conditions, never in Flux's state.
          kubectl get events --all-namespaces --field-selector type=Warning
          kubectl get deployments,replicasets --all-namespaces -o jsonpath='{range .items[*]}{.kind}/{.metadata.namespace}/{.metadata.name}{range .status.conditions[*]} {.type}={.status}({.reason}: {.message}){end}{"\n"}{end}'
          # A start an app refuses appears only in its own log.
          kubectl get pods --all-namespaces -o jsonpath='{range .items[*]}{.metadata.namespace}/{.metadata.name}{"|"}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' |
            while IFS='|' read -r pod ready; do
              [ "$ready" = True ] || kubectl --namespace "${pod%/*}" logs "pod/${pod#*/}" --all-containers --tail=20 || true
            done

  bootstrap:
    runs-on: ubuntu-latest
    # A bare image, as on a fresh machine: the first-run prerequisites are the only step before the script.
    container: ubuntu:26.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the first-run prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: scripts/bootstrap_pc.sh --only tools

      - name: Assert that every locked tool is installed and runs
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          missing="$(mise ls --current --missing)"
          [ -z "$missing" ] || { echo "::error::tools missing: $missing"; exit 1; }
          # Every executable of every locked tool must start, so a tool added to mise.toml is covered without an edit here.
          bin_paths="$(mise bin-paths)"
          [ -n "$bin_paths" ] || { echo "::error::mise bin-paths printed no tool path"; exit 1; }
          for bin_path in $bin_paths; do
            binaries="$(find -L "$bin_path" -maxdepth 1 -type f -executable)"
            [ -n "$binaries" ] || { echo "::error::no executable in $bin_path"; exit 1; }
            for binary in $binaries; do
              echo "$binary"
              "$binary" --help >/dev/null || { echo "::error::$binary does not run"; exit 1; }
            done
          done

      - name: Run the script again and assert that it changes nothing
        run: |
          # Each line holds a path and its type; a non-directory also holds its size and timestamp. Directory timestamps
          # are not compared (mise refreshes the shims directory's on every run), but the paths inside every directory are.
          list_state() {
            find "$HOME/.local/bin" "$HOME/.local/share/mise" \( -type d -printf '%y %p\n' \) -o \( -printf '%y %p %s %T@\n' \) | sort
          }
          list_state >"$RUNNER_TEMP/before-second-run"
          scripts/bootstrap_pc.sh --only tools
          list_state >"$RUNNER_TEMP/after-second-run"
          diff "$RUNNER_TEMP/before-second-run" "$RUNNER_TEMP/after-second-run" >"$RUNNER_TEMP/second-run.diff" ||
            { echo "::error::the second run changed the installed state:"; cat "$RUNNER_TEMP/second-run.diff"; exit 1; }

  opentofu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check the GitHub settings root against its lock and mocked tests
        run: mise run github:test

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    env:
      # The image the render runs in without network; flux2 is a static binary, mounted from the lock.
      RENDER_IMAGE: ubuntu:26.04
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: |
          scripts/bootstrap_pc.sh --only tools
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # gh reads an image's digest from the registry with Docker's keychain; the token reaches it only through stdin.
      - name: Log in to the registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Render the tree and judge every image
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise exec -- scripts/verify_image_release.sh

      - name: Run the fixture cases through the script
        run: mise exec -- tests/images/run.sh

  quality:
    if: always()
    needs: [checks, cluster, bootstrap, opentofu, images]
    permissions:
      contents: read
      actions: read
    uses: overnightworks/quality/.github/workflows/gate.yml@07bdf7c478ac9cc9cd348b180abd3cbc9d873f23 # v0.9.2
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
