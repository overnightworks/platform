version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: opentofu
    directory: /src/opentofu/github
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: uv
    directory: /src/legal
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
