# The one default class: a released volume keeps its directory, so its data outlives its claim, and each claim's
# directory under /opt/local-path-provisioner is <namespace>/<claim>.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
reclaimPolicy: Retain
parameters:
  pathPattern: "{{ .PVC.Namespace }}/{{ .PVC.Name }}"
