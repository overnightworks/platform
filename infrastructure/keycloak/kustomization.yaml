apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
resources:
  - ../postgres
  - keycloak-egress.yaml
  - keycloak.yaml
  - config-cli.yaml
  # The design kit's one copy, served beside the theme's own files.
  - ../design
components:
  - ../postgres/backup
configMapGenerator:
  - name: postgres
    behavior: merge
    literals:
      - key-tables=realm user_entity credential user_group_membership
      - backup-repository=http://rest-server.backup.svc.cluster.local:8000/keycloak/
  # The realm files keycloak-config-cli applies; a changed file changes the name, so Flux recreates the Job.
  - name: keycloak-realms
    files:
      - master.yaml
      - realm.yaml
  # hal's theme hallucinai, verbatim but for the stylesheet line of its two theme.properties. A key holds no slash, so
  # keycloak.yaml's volume maps each key to its path; the favicon is binary and lands in binaryData.
  - name: keycloak-theme
    files:
      - account__resources__content.json=themes/hallucinai/account/resources/content.json
      - account__resources__css__edge-2.css=themes/hallucinai/account/resources/css/edge-2.css
      - account__resources__favicon.svg=themes/hallucinai/account/resources/favicon.svg
      - account__theme.properties=themes/hallucinai/account/theme.properties
      - login__footer.ftl=themes/hallucinai/login/footer.ftl
      - login__messages__messages_de.properties=themes/hallucinai/login/messages/messages_de.properties
      - login__messages__messages_en.properties=themes/hallucinai/login/messages/messages_en.properties
      - login__resources__css__edge-3.css=themes/hallucinai/login/resources/css/edge-3.css
      - login__resources__img__favicon.ico=themes/hallucinai/login/resources/img/favicon.ico
      - login__theme.properties=themes/hallucinai/login/theme.properties
replacements:
  - source:
      kind: ConfigMap
      name: postgres
      fieldPath: data.backup-repository
    targets:
      - select:
          kind: Schedule
          name: postgres
        fieldPaths:
          - spec.backend.rest.url
  # Keycloak and config-cli share the admin front end; keycloak.yaml owns it.
  - source:
      kind: Deployment
      name: keycloak
      fieldPath: spec.template.spec.containers.[name=keycloak].env.[name=KC_HOSTNAME_ADMIN].value
    targets:
      - select:
          kind: Job
          name: config-cli
        fieldPaths:
          - spec.template.spec.containers.[name=config-cli].env.[name=KC_HOSTNAME_ADMIN].value
        options:
          create: true
