# keycloak-config-cli applies master.yaml, then realm.yaml. Flux recreates the Job whenever its template changes, a
# realm file's ConfigMap included, and leaves a finished Job as it is: one run per change.
apiVersion: batch/v1
kind: Job
metadata:
  name: config-cli
  annotations:
    # A Job's template is immutable, so a changed one is applied by deleting and recreating the Job.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # A retry covers a pod lost or a Keycloak restarted mid-run, never the front end: the init container sets it before
  # config-cli signs in, so a refusal fails every attempt alike.
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-cli
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      # Keycloak checks an admin token's issuer against master's front end, and a token issued before master.yaml's
      # `frontendUrl` stands no longer carries it: config-cli, which signs in once, would end on its own token in the
      # run that changes it, on every empty database. This container sets the value first with Keycloak's own kcadm,
      # whose update is its last call, so config-cli's one token already carries the issuer it is checked against and
      # master.yaml's value then equals the stored one. It leaves a stored value as it is.
      initContainers:
        - name: front-end
          # The image of Keycloak's own container, which kustomization.yaml copies here from keycloak.yaml.
          command:
            - bash
            - -ceu
            - |
              deadline=$((SECONDS + 600))
              # One attempt ends after 2 s: a connection opened while the Service has no endpoint hangs in the kernel's
              # connect give-up of about 135 s, and a second one opened just before Keycloak is Ready hangs again.
              until timeout 2 bash -c 'exec 3<>/dev/tcp/keycloak/8080 && printf "GET /realms/master HTTP/1.0\r\nHost: keycloak\r\n\r\n" >&3 \
                && read -r status <&3 && [[ $status == *" 200 "* ]]' 2>/dev/null; do
                [ "$SECONDS" -lt "$deadline" ] || { echo 'front-end: Keycloak did not answer within 600 seconds' >&2; exit 1; }
                sleep 2
              done
              kcadm=(/opt/keycloak/bin/kcadm.sh)
              "${kcadm[@]}" config credentials --config /tmp/kcadm.config --server http://keycloak:8080 --realm master --client config-cli
              stored="$("${kcadm[@]}" get realms/master --config /tmp/kcadm.config --fields 'attributes(frontendUrl)' --format csv --noquotes)"
              [ "$stored" = "$KC_HOSTNAME_ADMIN" ] || "${kcadm[@]}" update realms/master --config /tmp/kcadm.config -s "attributes.frontendUrl=$KC_HOSTNAME_ADMIN"
          env:
            # Keycloak's own value, which kustomization.yaml copies here from keycloak.yaml.
            - name: KC_HOSTNAME_ADMIN
            # kcadm reads the client secret of its service account from this variable, never from an argument.
            - name: KC_CLI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: config-cli-secret
          # Both containers start a JVM; a request gives each a CPU weight above the pods that ask for none, as Keycloak's
          # container has.
          resources:
            requests:
              cpu: 250m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: config-cli
          image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
          command: [java, -jar, /app/keycloak-config-cli.jar]
          resources:
            requests:
              cpu: 250m
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 180s
            # keycloak-config-cli 6.5.1 hands the client `Duration.get(ChronoUnit.NANOS)`, which is only the
            # sub-second part: a whole-second timeout, the default 10s included, reaches the client as 0, no timeout,
            # and the first connection, opened while the Service has no endpoint, hangs in the kernel's connect
            # give-up of about 135 s. A value below one second survives that, and a dropped SYN retries after the
            # check's 2 s.
            - name: KEYCLOAK_CONNECTTIMEOUT
              value: 900ms
            - name: KEYCLOAK_GRANTTYPE
              value: client_credentials
            - name: KEYCLOAK_CLIENTID
              value: config-cli
            - name: KEYCLOAK_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: config-cli-secret
            - name: IMPORT_FILES_LOCATIONS
              value: file:/config/master.yaml,file:/config/realm.yaml
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR
              value: "true"
            # The apply adds and changes and deletes no undeclared top-level object and no person: every managed type
            # is no-delete, so an object only Keycloak has stays, and a listed user keeps the realm roles and groups the
            # console gave.
            # The cache would skip an unchanged realm file silently.
            - name: IMPORT_CACHE_ENABLED
              value: "false"
            - name: IMPORT_USERS_MERGEROLES
              value: "true"
            - name: IMPORT_USERS_MERGEGROUPS
              value: "true"
            - name: IMPORT_MANAGED_AUTHENTICATIONFLOW
              value: no-delete
            - name: IMPORT_MANAGED_GROUP
              value: no-delete
            - name: IMPORT_MANAGED_SUBGROUP
              value: no-delete
            - name: IMPORT_MANAGED_REQUIREDACTION
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTSCOPE
              value: no-delete
            - name: IMPORT_MANAGED_SCOPEMAPPING
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTSCOPEMAPPING
              value: no-delete
            - name: IMPORT_MANAGED_COMPONENT
              value: no-delete
            - name: IMPORT_MANAGED_SUBCOMPONENT
              value: no-delete
            - name: IMPORT_MANAGED_IDENTITYPROVIDER
              value: no-delete
            - name: IMPORT_MANAGED_IDENTITYPROVIDERMAPPER
              value: no-delete
            - name: IMPORT_MANAGED_ROLE
              value: no-delete
            - name: IMPORT_MANAGED_CLIENT
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTAUTHORIZATIONRESOURCES
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTAUTHORIZATIONPOLICIES
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTAUTHORIZATIONSCOPES
              value: no-delete
            - name: IMPORT_MANAGED_MESSAGEBUNDLES
              value: no-delete
            - name: IMPORT_MANAGED_ORGANIZATION
              value: no-delete
            - name: IMPORT_MANAGED_WORKFLOW
              value: no-delete
            # Keycloak's own value, which kustomization.yaml copies here from keycloak.yaml.
            - name: KC_HOSTNAME_ADMIN
            # The realm files' $(env:...) values.
            - name: CONFIG_CLI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: config-cli-secret
            - name: SONGMAKER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-songmaker
            - name: HOPIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-hopin
            - name: PRESENTATOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-presentator
            - name: SKAT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-skat
            - name: AGENT_MOZART_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-agent-mozart
            - name: AGENT_LEONARDO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-agent-leonardo
            - name: AGENT_HUMBOLDT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-agent-humboldt
            - name: AGENT_CURIE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-agent-curie
            - name: AGENT_LOVELACE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-agent-lovelace
            - name: AGENT_HILDEGARD_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-agent-hildegard
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: realms
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realms
          configMap:
            name: keycloak-realms
        - name: tmp
          emptyDir: {}
