# keycloak-config-cli applies master.yaml, then realm.yaml. Flux recreates the Job whenever its template changes, a
# realm file's ConfigMap included, and leaves a finished Job as it is: one run per change.
apiVersion: batch/v1
kind: Job
metadata:
  name: config-cli
  annotations:
    # A Job's template is immutable, so a changed one is applied by deleting and recreating the Job.
    kustomize.toolkit.fluxcd.io/force: enabled
spec:
  # The run that changes master's front end ends on its own then invalid token; a retry converges.
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-cli
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config-cli
          image: docker.io/adorsys/keycloak-config-cli:6.5.1-26.5.5@sha256:0955d98c8a341898b7aa177477edf8a1e90569ae50bbe7598141c1270b773274
          command: [java, -jar, /app/keycloak-config-cli.jar]
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak:8080
            - name: KEYCLOAK_AVAILABILITYCHECK_ENABLED
              value: "true"
            - name: KEYCLOAK_AVAILABILITYCHECK_TIMEOUT
              value: 180s
            - name: KEYCLOAK_GRANTTYPE
              value: client_credentials
            - name: KEYCLOAK_CLIENTID
              value: config-cli
            - name: KEYCLOAK_CLIENTSECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: config-cli-secret
            - name: IMPORT_FILES_LOCATIONS
              value: file:/config/master.yaml,file:/config/realm.yaml
            - name: IMPORT_VARSUBSTITUTION_ENABLED
              value: "true"
            - name: IMPORT_VARSUBSTITUTION_UNDEFINEDISERROR
              value: "true"
            # The apply adds and changes and deletes no undeclared top-level object and no person: every managed type
            # is no-delete, so an object only Keycloak has stays, and a listed user keeps the realm roles and groups the
            # console gave.
            # The cache would skip an unchanged realm file silently.
            - name: IMPORT_CACHE_ENABLED
              value: "false"
            - name: IMPORT_USERS_MERGEROLES
              value: "true"
            - name: IMPORT_USERS_MERGEGROUPS
              value: "true"
            - name: IMPORT_MANAGED_AUTHENTICATIONFLOW
              value: no-delete
            - name: IMPORT_MANAGED_GROUP
              value: no-delete
            - name: IMPORT_MANAGED_SUBGROUP
              value: no-delete
            - name: IMPORT_MANAGED_REQUIREDACTION
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTSCOPE
              value: no-delete
            - name: IMPORT_MANAGED_SCOPEMAPPING
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTSCOPEMAPPING
              value: no-delete
            - name: IMPORT_MANAGED_COMPONENT
              value: no-delete
            - name: IMPORT_MANAGED_SUBCOMPONENT
              value: no-delete
            - name: IMPORT_MANAGED_IDENTITYPROVIDER
              value: no-delete
            - name: IMPORT_MANAGED_IDENTITYPROVIDERMAPPER
              value: no-delete
            - name: IMPORT_MANAGED_ROLE
              value: no-delete
            - name: IMPORT_MANAGED_CLIENT
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTAUTHORIZATIONRESOURCES
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTAUTHORIZATIONPOLICIES
              value: no-delete
            - name: IMPORT_MANAGED_CLIENTAUTHORIZATIONSCOPES
              value: no-delete
            - name: IMPORT_MANAGED_MESSAGEBUNDLES
              value: no-delete
            - name: IMPORT_MANAGED_ORGANIZATION
              value: no-delete
            - name: IMPORT_MANAGED_WORKFLOW
              value: no-delete
            # Keycloak's own value, which kustomization.yaml copies here from keycloak.yaml.
            - name: KC_HOSTNAME_ADMIN
            # The realm files' $(env:...) values.
            - name: CONFIG_CLI_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: config-cli-secret
            - name: SONGMAKER_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-songmaker
            - name: HOPIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-hopin
            - name: PRESENTATOR_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-presentator
            - name: SKAT_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-skat
            - name: AGENT_MOZART_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: keycloak
                  key: client-agent-mozart
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: realms
              mountPath: /config
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: realms
          configMap:
            name: keycloak-realms
        - name: tmp
          emptyDir: {}
