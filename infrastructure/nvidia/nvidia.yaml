# The node's one card, offered to Kubernetes as nvidia.com/gpu: 1. The plugin below is NVIDIA's static manifest of
# release v0.20.1 (https://github.com/NVIDIA/k8s-device-plugin/blob/v0.20.1/deployments/static/nvidia-device-plugin.yml)
# in a Namespace of its own with the RuntimeClass added. There is no time-slicing or sharing configuration, so the card
# is one unit that a single Pod holds. The class maps to containerd's nvidia runtime, which k3s registers only when it
# starts with the NVIDIA container toolkit present; host/k3s/config.yaml leaves runtimes untouched.
# The Namespace carries no Pod Security label, as the plugin mounts a hostPath; nothing else runs in it.
apiVersion: v1
kind: Namespace
metadata:
  name: nvidia
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: nvidia
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      runtimeClassName: nvidia
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.20.1@sha256:27c1b2553a690ca3d29889dcd61df97525d46f58272c0be8dc63c2b18f120075
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: kubelet-device-plugins-dir
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: kubelet-device-plugins-dir
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
