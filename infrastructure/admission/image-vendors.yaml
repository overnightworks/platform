# The vendor repositories platform runs. One key per vendor, its value <registry>/<repository> without a version,
# under a comment naming the manifest that runs it and the vendor's page naming that repository.
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-vendors
  namespace: admission
data:
  # infrastructure/traefik/rendered.yaml and infrastructure/litellm/kustomization.yaml;
  # https://hub.docker.com/_/traefik
  traefik: docker.io/library/traefik
  # infrastructure/cloudflared/cloudflared.yaml; https://github.com/cloudflare/cloudflared#installing-cloudflared
  cloudflared: docker.io/cloudflare/cloudflared
  # .github/workflows/ci.yml, the cluster job's env CLIENT_IMAGE; https://hub.docker.com/r/curlimages/curl
  curl: docker.io/curlimages/curl
  # infrastructure/storage/kustomization.yaml; https://github.com/rancher/local-path-provisioner#installation
  local-path-provisioner: docker.io/rancher/local-path-provisioner
  # infrastructure/storage/kustomization.yaml, local-path's helper pod, and .github/workflows/ci.yml, the cluster job's
  # env PROBE_IMAGE; https://hub.docker.com/_/busybox
  busybox: docker.io/library/busybox
  # infrastructure/postgres/postgres.yaml; https://hub.docker.com/_/postgres
  postgres: docker.io/library/postgres
  # infrastructure/litellm/litellm.yaml; https://github.com/BerriAI/litellm/pkgs/container/litellm
  litellm: ghcr.io/berriai/litellm
  # infrastructure/keycloak/keycloak.yaml; https://www.keycloak.org/server/containers
  keycloak: quay.io/keycloak/keycloak
  # infrastructure/keycloak/config-cli.yaml; https://github.com/adorsys/keycloak-config-cli#docker
  keycloak-config-cli: docker.io/adorsys/keycloak-config-cli
