# The vendor repositories platform runs. One key per vendor, its value <registry>/<repository> without a version,
# under a comment naming the manifest that runs it and the vendor's page naming that repository.
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-vendors
  namespace: admission
data:
  # infrastructure/traefik/rendered.yaml; https://hub.docker.com/_/traefik
  traefik: docker.io/library/traefik
  # .github/workflows/ci.yml, the cluster job's client of Traefik; https://hub.docker.com/r/curlimages/curl
  curl: docker.io/curlimages/curl
