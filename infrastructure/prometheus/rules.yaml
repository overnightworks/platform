# The platform's alert rules, which Prometheus reads from /etc/rules; tests/prometheus/rules_test.yml proves their
# durations, firing and resolving with promtool.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: prometheus
data:
  rules.yml: |
    groups:
      - name: platform
        rules:
          # A target that names its Deployment through the labels namespace and deployment is judged by DeploymentUnavailable
          # while that has unavailable replicas, so one event mails once; a target without the labels never matches.
          - alert: TargetDown
            expr: up == 0 unless on(namespace, deployment) (kube_deployment_status_replicas_unavailable > 0)
            for: 5m
            annotations:
              summary: 'Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}'
          - alert: KustomizationNotReady
            expr: gotk_resource_info{customresource_kind="Kustomization", ready!="True"} == 1
            for: 15m
            annotations:
              summary: 'The Kustomization {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready'
          - alert: DeploymentUnavailable
            expr: kube_deployment_status_replicas_unavailable{namespace!~"kube-system|flux-system"} > 0
            for: 10m
            annotations:
              summary: 'The Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas'
          - alert: PodRestarting
            expr: increase(kube_pod_container_status_restarts_total[1h]) > 3
            annotations:
              summary: 'The container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted more than 3 times in an hour'
          - alert: DiskLow
            # cAdvisor's root filesystem of block devices under /dev, without loop devices and /dev/shm: a snap's read-only
            # squashfs is always full, and what is not under /dev is memory-backed or an overlay of the same disk.
            expr: >-
              container_fs_usage_bytes{id="/", device=~"/dev/.+", device!~"/dev/(loop.*|shm)"}
              / container_fs_limit_bytes{id="/", device=~"/dev/.+", device!~"/dev/(loop.*|shm)"} > 0.85
            for: 10m
            annotations:
              summary: 'The filesystem {{ $labels.device }} of {{ $labels.instance }} is {{ $value | humanizePercentage }} full'
          # A Job counts through its owner: a CronJob by name, and k8up's Backup, Check and Prune by kind alone, since their
          # names change every run. A Job with no owner is not judged.
          - record: namespace_owner:kube_job_status_start_time:scheduled
            expr: >-
              label_replace(
              kube_job_status_start_time * on(namespace, job_name) group_left(owner_kind, owner_name)
              kube_job_owner{owner_kind=~"CronJob|Backup|Check|Prune"},
              "owner_name", "", "owner_kind", "Backup|Check|Prune")
          # The newest finished Job of an owner failed; a later success ends it, and deleted older Jobs change nothing.
          - alert: ScheduledJobFailed
            expr: >-
              max by (namespace, owner_kind, owner_name) (
              namespace_owner:kube_job_status_start_time:scheduled and on(namespace, job_name) kube_job_failed{condition="true"} == 1)
              == max by (namespace, owner_kind, owner_name) (
              namespace_owner:kube_job_status_start_time:scheduled and on(namespace, job_name)
              (kube_job_complete{condition="true"} == 1 or kube_job_failed{condition="true"} == 1))
            for: 15m
            annotations:
              summary: 'The newest finished {{ $labels.owner_kind }}{{ with $labels.owner_name }} {{ . }}{{ end }} Job in {{ $labels.namespace }} failed'
          # Only a successful Job has a completion time.
          - record: namespace:kube_job_status_completion_time:backup_max
            expr: max by (namespace) (kube_job_status_completion_time and on(namespace, job_name) kube_job_owner{owner_kind="Backup"})
          # The guard of 8 days keeps a new Schedule and a fresh cluster quiet.
          - alert: BackupMissing
            expr: >-
              min by (namespace) (k8up_schedule_created) < time() - 8 * 86400
              unless on(namespace) namespace:kube_job_status_completion_time:backup_max > time() - 8 * 86400
            for: 15m
            annotations:
              summary: 'No backup of {{ $labels.namespace }} completed in 8 days'
          # kube-state-metrics emits no next time for a suspended CronJob, so one is not judged. The hour lets the controller
          # catch up after a boot, which the CronJobs' own timeZone and kube-state-metrics' reading of it keep in step.
          - alert: ScheduledJobMissed
            expr: time() - max by (namespace, cronjob) (kube_cronjob_next_schedule_time) > 3600
            for: 15m
            annotations:
              summary: 'The CronJob {{ $labels.namespace }}/{{ $labels.cronjob }} did not start within an hour of its due time'
          # songmaker's web exports the series at 0 with no worker, and its Deployment stands at 0 replicas until a worker is
          # wanted, so the guard keeps the rule quiet until then. A worker that is not Ready is DeploymentUnavailable's, so
          # this rule is the Ready-and-unregistered case.
          - alert: NoOnlineAceStepWorker
            expr: >-
              songmaker_acestep_workers_total{status="online"} == 0
              and on() kube_deployment_spec_replicas{namespace="songmaker", deployment="acestep-worker"} > 0
              unless on() kube_deployment_status_replicas_unavailable{namespace="songmaker", deployment="acestep-worker"} > 0
            for: 10m
            annotations:
              summary: 'No ACE-Step worker of songmaker is online'
          # The gauge is the time of the newest failure and 0 while nothing ever failed, so every sample holds the answer.
          - alert: SongmakerJobFailure
            expr: time() - songmaker_last_job_failure_timestamp_seconds < 900
            annotations:
              summary: 'A songmaker job failed within the last 15 minutes'
          - alert: SongmakerBackgroundLoopUnhealthy
            expr: songmaker_background_loop_alive == 0 or songmaker_background_loop_consecutive_failures >= 3
            for: 5m
            annotations:
              summary: 'The songmaker background loop {{ $labels.loop }} is unhealthy'
