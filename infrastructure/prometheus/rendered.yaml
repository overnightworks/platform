            refuse() { echo "mail-config: the key $1 of the Secret alertmanager is empty, malformed or holds a character the mail template cannot hold" >&2; exit 1; }
            case $SMARTHOST in ''|*[!A-Za-z0-9.:-]*) refuse smarthost ;; esac
            # Alertmanager refuses a smarthost without a port at load, naming the host in its log.
            case $SMARTHOST in [A-Za-z0-9]*:[0-9]*) ;; *) refuse smarthost ;; esac
            case $USERNAME in ''|*[!A-Za-z0-9._%+@-]*) refuse username ;; esac
            case $TO in ''|*[!A-Za-z0-9._%+@-]*) refuse to ;; esac
            # The password goes to its own file, which Alertmanager reads; only a newline cannot be part of it.
            newline='
            '
            case $PASSWORD in ''|*"$newline"*) refuse password ;; esac
            printf '%s' "$PASSWORD" > /run/alertmanager/password
            sed -e "s|@SMARTHOST@|$SMARTHOST|g" -e "s|@USERNAME@|$USERNAME|g" -e "s|@TO@|$TO|g" \
              /etc/alertmanager/alertmanager.yml > /run/alertmanager/alertmanager.yml
          env:
