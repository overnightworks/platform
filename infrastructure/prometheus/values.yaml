# Prometheus' chart values; mise run charts:render renders them into rendered.yaml beside this file. A bump changes the
# chart digest in that task and each image tag and digest here together and regenerates.
# node-exporter (host mounts, which Pod Security restricted refuses) and the pushgateway are not run.
# Alertmanager mails each alert once when it fires and once when it resolves. The route stands here as a template; the
# init container fills in the four values of the Secret alertmanager, which stand only in platform-secrets, and writes
# the finished file into memory, where only Alertmanager's user reads it.
alertmanager:
  image:
    repository: quay.io/prometheus/alertmanager
    # The chart renders repository:tag, so the digest follows the tag; the tag alone can move.
    tag: v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
  # The ServiceAccount's token is of no use to it.
  automountServiceAccountToken: false
  # Without the reloader the chart puts checksum/config on the pod, so a changed route rolls it.
  configmapReload:
    enabled: false
  extraArgs:
    config.file: /run/alertmanager/alertmanager.yml
    # The notification log ends with this retention, after which a still-firing alert would be mailed again; the
    # repeat interval below is as long.
    data.retention: 8760h
  persistence:
    # Annotated so neither a prune nor the StatefulSet's deletion takes the claim, whose notification log keeps a
    # restart from mailing every firing alert again. The log and the silences take kilobytes.
    size: 100Mi
    storageClass: local-path
    annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
  extraVolumes:
    - name: mail-config
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
  extraVolumeMounts:
    - name: mail-config
      mountPath: /run/alertmanager
      readOnly: true
  extraInitContainers:
    - name: mail-config
      image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: SMARTHOST
          valueFrom: {secretKeyRef: {name: alertmanager, key: smarthost}}
        - name: USERNAME
          valueFrom: {secretKeyRef: {name: alertmanager, key: username}}
        - name: TO
          valueFrom: {secretKeyRef: {name: alertmanager, key: to}}
        - name: PASSWORD
          valueFrom: {secretKeyRef: {name: alertmanager, key: password}}
      volumeMounts:
        - name: config
          mountPath: /etc/alertmanager
          readOnly: true
        - name: mail-config
          mountPath: /run/alertmanager
      command:
        - sh
        - -c
        - |
          set -eu
          umask 077
          # A refusal names the key and never its value. The template holds the three values in quoted YAML scalars
          # and sed's s|..|..| puts them there, so each is limited to the characters of a host:port or an address.
          refuse() { echo "mail-config: the key $1 of the Secret alertmanager is empty, malformed or holds a character the mail template cannot hold" >&2; exit 1; }
          case $SMARTHOST in ''|*[!A-Za-z0-9.:-]*) refuse smarthost ;; esac
          # Alertmanager refuses a smarthost that is not one host and one numeric port at load, naming it in its log.
          case $SMARTHOST in *:*) ;; *) refuse smarthost ;; esac
          case $SMARTHOST in :*|*:|*:*:*|*:*[!0-9]*) refuse smarthost ;; esac
          case $USERNAME in ''|*[!A-Za-z0-9._%+@-]*) refuse username ;; esac
          case $TO in ''|*[!A-Za-z0-9._%+@-]*) refuse to ;; esac
          # The password goes to its own file, which Alertmanager reads; only a newline cannot be part of it.
          newline='
          '
          case $PASSWORD in ''|*"$newline"*) refuse password ;; esac
          printf '%s' "$PASSWORD" > /run/alertmanager/password
          sed -e "s|@SMARTHOST@|$SMARTHOST|g" -e "s|@USERNAME@|$USERNAME|g" -e "s|@TO@|$TO|g" \
            /etc/alertmanager/alertmanager.yml > /run/alertmanager/alertmanager.yml
  # One mail per alert: every label is a grouping label, so no two alerts share a mail. The repeat interval is a year,
  # so an alert that fires for a whole year is mailed again and none sooner; the resolved mail follows within the
  # group interval.
  config:
    templates: []
    global:
      smtp_smarthost: '@SMARTHOST@'
      smtp_from: '@USERNAME@'
      smtp_auth_username: '@USERNAME@'
      smtp_auth_password_file: /run/alertmanager/password
    route:
      receiver: mail
      group_by: ['...']
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 8760h
    receivers:
      - name: mail
        email_configs:
          - to: '@TO@'
            send_resolved: true
            html: ''
            headers:
              Subject: '[{{ .Status }}] {{ .CommonLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
prometheus-node-exporter:
  enabled: false
prometheus-pushgateway:
  enabled: false
configmapReload:
  prometheus:
    image:
      repository: quay.io/prometheus-operator/prometheus-config-reloader
      tag: v0.95.1
      # The tag alone can move, so each image is pinned by its index digest.
      digest: sha256:39bdbade0c64f7c38bb6d18d6f602b14ad489bc189b709dc9266b49e6647aac1
    # Pod Security restricted requires these, which the chart's defaults leave out.
    containerSecurityContext: &containerSecurityContext
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: [ALL]
    # The rules ConfigMap is a second source of the rule files; a changed rule reloads without a restart.
    extraConfigmapMounts:
      - name: rules
        mountPath: /etc/rules
        configMap: prometheus-rules
        readOnly: true
    extraVolumeDirs: [/etc/rules]
server:
  image:
    repository: quay.io/prometheus/prometheus
    tag: v3.16.0
    digest: sha256:9332054523223e2ddc18d8101799d54a4a8d823b030c53216f063a6c117773cd
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext: *containerSecurityContext
  # One claim that only one pod holds at a time.
  strategy:
    type: Recreate
  # The size bound keeps the TSDB inside the 8Gi claim when the 30 days would not fit.
  retention: 30d
  retentionSize: 7GB
  persistentVolume:
    size: 8Gi
    storageClass: local-path
    # Neither a prune nor the Deployment's deletion takes the claim, which holds every sample until retention does.
    annotations:
      kustomize.toolkit.fluxcd.io/prune: disabled
  extraConfigmapMounts:
    - name: rules
      mountPath: /etc/rules
      configMap: prometheus-rules
      readOnly: true
  # songmaker's /metrics takes a bearer token, which the Secret songmaker-monitoring of platform-secrets holds.
  extraSecretMounts:
    - name: songmaker-monitoring
      mountPath: /etc/songmaker-monitoring
      secretName: songmaker-monitoring
      readOnly: true
serverFiles:
  prometheus.yml:
    rule_files:
      - /etc/rules/rules.yml
# The kubelet and cAdvisor are scraped at each node's port 10250 with the chart's `get` on nodes/metrics, the one kubelet
# right. The kubelet's serving certificate is signed by the CA the ServiceAccount's ca.crt holds and names the node's IP,
# so verification is on, which the chart's default turns off; a node's address is its InternalIP at that port, which the role gives.
scrapeConfigs:
  kubernetes-api-servers:
    enabled: false
  kubernetes-service-endpoints:
    enabled: false
  kubernetes-service-endpoints-slow:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  kubernetes-services:
    enabled: false
  kubernetes-pods:
    enabled: false
  kubernetes-pods-slow:
    enabled: false
  kubernetes-nodes:
    tls_config:
      insecure_skip_verify: false
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
  kubernetes-nodes-cadvisor:
    tls_config:
      insecure_skip_verify: false
    relabel_configs:
      - action: labelmap
        regex: __meta_kubernetes_node_label_(.+)
  kube-state-metrics:
    static_configs:
      - targets: [prometheus-kube-state-metrics.prometheus.svc:8080]
  alertmanager:
    static_configs:
      - targets: [prometheus-alertmanager.prometheus.svc:9093]
  songmaker:
    authorization:
      type: Bearer
      credentials_file: /etc/songmaker-monitoring/token
    static_configs:
      - targets: [web.songmaker.svc:8080]
  # Flux's controllers serve their metrics on the port http-prom, which flux-system's NetworkPolicy opens to every namespace.
  flux-controllers:
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [flux-system]
    relabel_configs:
      # A Pod that has finished keeps a target that reads down, which would fire TargetDown for nothing.
      - source_labels: [__meta_kubernetes_pod_phase]
        action: keep
        regex: Running
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        action: keep
        regex: http-prom
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: controller
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
kube-state-metrics:
  image:
    registry: registry.k8s.io
    repository: kube-state-metrics/kube-state-metrics
    tag: v2.20.0
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  # Without secrets and configmaps: a list on secrets returns their data, and no rule or dashboard reads them.
  collectors:
    - cronjobs
    - daemonsets
    - deployments
    - jobs
    - namespaces
    - nodes
    - persistentvolumeclaims
    - persistentvolumes
    - pods
    - replicasets
    - services
    - statefulsets
  # Flux's resources, so gotk_resource_info exists for each Kustomization, and k8up's Schedules, so k8up_schedule_created
  # names each namespace that should be backed up.
  rbac:
    extraRules:
      - apiGroups: [kustomize.toolkit.fluxcd.io]
        resources: [kustomizations]
        verbs: [list, watch]
      - apiGroups: [k8up.io]
        resources: [schedules]
        verbs: [list, watch]
  customResourceState:
    enabled: true
    config:
      kind: CustomResourceStateMetrics
      spec:
        resources:
          - groupVersionKind:
              group: kustomize.toolkit.fluxcd.io
              version: v1
              kind: Kustomization
            metricNamePrefix: gotk
            metrics:
              - name: resource_info
                help: The current state of a Flux resource.
                each:
                  type: Info
                  info:
                    labelsFromPath:
                      name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, lastAppliedRevision]
                  source_name: [spec, sourceRef, name]
          - groupVersionKind:
              group: k8up.io
              version: v1
              kind: Schedule
            metricNamePrefix: k8up_schedule
            metrics:
              - name: created
                help: The creation time of a k8up Schedule.
                each:
                  type: Gauge
                  gauge:
                    path: [metadata, creationTimestamp]
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
