# Prometheus holds every metric of the platform: only the namespaces grafana (reads), gatus (reads) and its own, labels
# the API server sets and no other namespace can carry, may open its web port, and only its own namespace
# kube-state-metrics' port. Every other sender and port is denied; the kubelet's probes come from the node, which a
# NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-readers-only
  namespace: prometheus
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [grafana, gatus, prometheus]
      ports:
        - port: 9090
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - port: 8080
          protocol: TCP
---
# Alertmanager takes alerts from Prometheus and a read from the status page, and it sends only to cluster DNS and to a
# mail provider's submission ports (465, 587) outside the pod and service networks, so the Service kubernetes and
# every other cluster address stay out of reach of the pod that holds the provider's password.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager
  namespace: prometheus
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [gatus, prometheus]
      ports:
        - port: 9093
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16, 10.43.0.0/16]
      ports:
        - port: 465
          protocol: TCP
        - port: 587
          protocol: TCP
