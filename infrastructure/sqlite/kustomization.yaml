# The platform's way to load a SQLite database, a base a layer includes: the layer merges key-table, the table whose rows
# prove a used database, into the ConfigMap. The ConfigMap names no app.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: sqlite
    files:
      - scripts/sqlite_copy.py
    options:
      disableNameSuffixHash: true
