# One Postgres per namespace that includes this base: database and user are the namespace's name, its password the key
# password of the namespace's Secret postgres from platform-secrets.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  replicas: 1
  serviceName: postgres
  # The claim outlives the StatefulSet, so a pruned or deleted layer keeps its data.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        # The alpine image's postgres user.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
          env:
            - name: POSTGRES_DB
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POSTGRES_USER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/postgres/password
            # A subdirectory, which the entrypoint creates as uid 70 at 0700 inside the volume local-path creates 0777.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # psql, pg_dump, pg_restore and pg_isready in this container, kubectl exec included, connect as the
            # namespace's user to its database.
            - name: PGUSER
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PGDATABASE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready]
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
            - name: password
              mountPath: /run/secrets/postgres
              readOnly: true
            - name: checks
              mountPath: /etc/postgres-checks
              readOnly: true
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: password
          secret:
            secretName: postgres
        - name: checks
          configMap:
            name: postgres
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          kustomize.toolkit.fluxcd.io/prune: disabled
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
# Only the pods of its own namespace reach Postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - port: postgres
          protocol: TCP
---
# The one key-table check and the one table digest, which db:load-dump runs through kubectl exec, so no row leaves the
# container. Each including layer merges in key-tables, the tables it counts, as SQL names without quotes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres
data:
  check-key-tables.sh: |
    #!/bin/sh
    # check-key-tables.sh [--counts-only]: for each table the file key-tables beside it names, its row count in the
    # database libpq's PG* settings name and, from the custom-format dump on stdin, its COPY data lines and whether
    # both are equal; exits 1 when one differs. --counts-only reads no dump. It prints names and counts, never a row.
    set -euo pipefail
    tables="$(cat "$(dirname "$0")/key-tables")"
    dump_lines=""
    # A data block ends only at a line \. alone, which COPY's text format never holds inside a row.
    [ "${1-}" = --counts-only ] || dump_lines="$(pg_restore --data-only --file=- | awk '
      table == "" && /^COPY / { table = $2; sub(/^public[.]/, "", table); gsub(/"/, "", table); lines[table] += 0; next }
      table != "" && /^\\[.]$/ { table = ""; next }
      table != "" { lines[table]++ }
      END { for (table in lines) print table, lines[table] }')"
    status=0
    for table in $tables; do
      rows="$(psql --no-psqlrc --tuples-only --no-align --set=ON_ERROR_STOP=1 --command="SELECT count(*) FROM \"$table\"")"
      if [ "${1-}" = --counts-only ]; then echo "$table: $rows rows" && continue; fi
      lines="$(printf '%s\n' "$dump_lines" | awk -v table="$table" '$1 == table { print $2 }')"
      verdict=equal
      [ "$rows" = "${lines:-0}" ] || { verdict=DIFFERS && status=1; }
      echo "$table: $rows rows, ${lines:-0} COPY lines in the dump, $verdict"
    done
    exit "$status"
  table-digests.sh: |
    #!/bin/sh
    # table-digests.sh: for a dump as SQL on stdin, every table's data lines, sorted, as "<sha256> - <table> <rows>" per
    # table, an empty one included, so two dumps hold the same rows exactly when their lines are equal. Each line is the
    # table, a tab, then "R" and a row or "E" for the table's end, which only an empty table keeps beside no row.
    set -euo pipefail
    awk 'table == "" && /^COPY / { table = $2; rows = 0; next }
      table != "" && /^\\[.]$/ { if (rows == 0) print table "\tE"; table = ""; next }
      table != "" { rows++; print table "\tR" $0 }' | LC_ALL=C sort | awk -F "\t" '
      function finish() { if (table != "") { close("sha256sum"); print table, rows; fflush() } }
      $1 != table { finish(); table = $1; rows = 0; printf "" | "sha256sum" }
      substr($0, length($1) + 2, 1) == "R" { rows++; print substr($0, length($1) + 3) | "sha256sum" }
      END { finish() }' | paste -d " " - -
