# The backup of the Postgres base, a component so a layer opts in: keycloak, litellm, skat, songmaker and personas
# include it beside ../postgres.
# A layer that backs up more than its database also includes ./files, which takes the dump from a PreBackupPod.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources:
  - backup.yaml
components:
  - ../../backup/schedule
configMapGenerator:
  - name: restore-test
    files:
      - scripts/restore_test.sh
    options:
      disableNameSuffixHash: true
patches:
  # The Schedule and its PodConfig keep the names they were created under: BackupMissing reads each namespace's Schedule
  # creation, and a renamed live Schedule is a new one, which keeps the alert quiet until it is eight days old.
  - target:
      kind: Schedule
      name: backup
    patch: |
      - op: replace
        path: /metadata/name
        value: postgres
      - op: replace
        path: /spec/podConfigRef/name
        value: postgres-backup
    options:
      allowNameChange: true
  - target:
      kind: PodConfig
      name: backup
    patch: |
      - op: replace
        path: /metadata/name
        value: postgres-backup
    options:
      allowNameChange: true
  # k8up execs this in the running pod and streams it to restic; the extension names the file in the snapshot, which
  # then is /<namespace>-postgres.dump. A layer with ./files removes it: its PreBackupPod streams the same file name.
  - target:
      kind: StatefulSet
      name: postgres
    patch: |
      - op: add
        path: /spec/template/metadata/annotations
        value:
          k8up.io/backupcommand: pg_dump --format=custom
          k8up.io/file-extension: .dump
replacements:
  # The restore test restores with the server's own image, so a pg_restore older than its dump cannot occur.
  - source:
      kind: StatefulSet
      name: postgres
      fieldPath: spec.template.spec.containers.[name=postgres].image
    targets:
      - select:
          kind: CronJob
          name: restore-test
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=restore-test].image
