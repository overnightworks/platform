# The monthly restore test of this namespace's Postgres. The weekly Schedule and its PodConfig stand in
# infrastructure/backup/schedule, which the kustomization includes.
# The latest snapshot's dump into an emptyDir, then a restore into a throwaway server inside this pod; the dump never
# leaves it and the running Postgres is not touched. backup:fetch runs the same init container.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restore-test
spec:
  schedule: "0 5 1 * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            # The alpine image's postgres user, which k8up's image runs as here too.
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: restic-dump
              # k8up's own image, so the restic that reads a repository is the one that wrote it. Its digest equals the
              # one in infrastructure/k8up/values.yaml; a bump changes both, and the cluster job fails when they differ.
              image: ghcr.io/k8up-io/k8up:v2.16.1@sha256:f59bfa37c51511d5ad67e53816fb55c62d0e6411890e59bb6b965923129f30b5
              command:
                - sh
                - -c
                - umask 077; restic --no-cache dump --path "/$(NAMESPACE)-postgres.dump" latest "/$(NAMESPACE)-postgres.dump" >/restore/dump
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: REPOSITORY_URL
                  valueFrom:
                    configMapKeyRef:
                      name: postgres
                      key: backup-repository
                - name: RESTIC_REPOSITORY
                  value: rest:$(REPOSITORY_URL)
                - name: RESTIC_REST_USERNAME
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: username
                - name: RESTIC_REST_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: password
                - name: RESTIC_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: restic
                      key: repository-password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: restore
                  mountPath: /restore
          containers:
            - name: restore-test
              # The StatefulSet's image, set by the replacement in kustomization.yaml.
              image: postgres
              command: [sh, /etc/restore-test/restore_test.sh, /restore/dump]
              env:
                - name: PGUSER
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: PGDATABASE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: restore
                  mountPath: /restore
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: checks
                  mountPath: /etc/postgres-checks
                  readOnly: true
                - name: script
                  mountPath: /etc/restore-test
                  readOnly: true
          volumes:
            - name: restore
              emptyDir: {}
            - name: tmp
              emptyDir: {}
            - name: checks
              configMap:
                name: postgres
            - name: script
              configMap:
                name: restore-test
