# The base keycloak, litellm, apps/hopin, apps/skat, apps/songmaker, apps/presentator and apps/personas include, no Flux
# layer of its own: each sets its namespace and merges its key-tables into the ConfigMap postgres.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
configMapGenerator:
  # The connections the role reader may hold at once, which tests/postgres/connections_stay_within_max_connections.sh
  # counts against max_connections.
  - name: postgres-roles
    files:
      - scripts/server_ready.sh
      - scripts/keep_session.sh
      - scripts/app_role.sh
      - scripts/reader_role.sh
    literals:
      - connections=2
