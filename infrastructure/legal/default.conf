# The legal unit: the three pages, one stylesheet and design's tokens and fonts, and nothing else. The headers are hal's.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    access_log off;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; font-src 'self'; img-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Every cache asks again before it shows a stored copy, so a changed text is the one shown after the pod rolls.
    add_header Cache-Control "no-cache, no-transform" always;

    root /srv/pages;

    location = /impressum {
        try_files /impressum.html =404;
    }

    location = /datenschutz {
        try_files /datenschutz.html =404;
    }

    location = /nutzungsbedingungen {
        try_files /nutzungsbedingungen.html =404;
    }

    # A ConfigMap volume holds ..data and a timestamped directory beside its files; no path segment that starts with a
    # dot is served.
    location ~ /\. {
        return 404;
    }

    # try_files answers a directory or a missing file with 404, never an index or a 403.
    location /_rechtliches/ {
        alias /srv/assets/;
        try_files $uri =404;
    }

    # Also /favicon.ico: the Ingress sends it here so the browser's own request is not redirected, and hal serves no icon.
    location / {
        return 404;
    }
}
