# The pages, the assets and the nginx configuration are read at start, so each ConfigMap's name carries its content's
# hash and a change rolls the pod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: legal
resources:
  - namespace.yaml
  - legal.yaml
configMapGenerator:
  - name: legal-pages
    files:
      - built/impressum.html
      - built/datenschutz.html
      - built/nutzungsbedingungen.html
  # A key holds no slash, so the Deployment's volume maps each key to its path. kustomize puts the fonts in binaryData.
  - name: legal-assets
    files:
      - legal-2.css=assets/legal-2.css
      - design-0.18.0__design.css=assets/design-0.18.0/design.css
      - design-0.18.0__fonts__open-sans-LICENSE=assets/design-0.18.0/fonts/open-sans-LICENSE
      - design-0.18.0__fonts__open-sans-latin-400-normal.woff2=assets/design-0.18.0/fonts/open-sans-latin-400-normal.woff2
      - design-0.18.0__fonts__open-sans-latin-600-normal.woff2=assets/design-0.18.0/fonts/open-sans-latin-600-normal.woff2
      - design-0.18.0__fonts__open-sans-latin-ext-400-normal.woff2=assets/design-0.18.0/fonts/open-sans-latin-ext-400-normal.woff2
      - design-0.18.0__fonts__open-sans-latin-ext-600-normal.woff2=assets/design-0.18.0/fonts/open-sans-latin-ext-600-normal.woff2
      - design-0.18.0__fonts__oswald-LICENSE=assets/design-0.18.0/fonts/oswald-LICENSE
      - design-0.18.0__fonts__oswald-latin-400-normal.woff2=assets/design-0.18.0/fonts/oswald-latin-400-normal.woff2
      - design-0.18.0__fonts__oswald-latin-700-normal.woff2=assets/design-0.18.0/fonts/oswald-latin-700-normal.woff2
      - design-0.18.0__fonts__oswald-latin-ext-400-normal.woff2=assets/design-0.18.0/fonts/oswald-latin-ext-400-normal.woff2
      - design-0.18.0__fonts__oswald-latin-ext-700-normal.woff2=assets/design-0.18.0/fonts/oswald-latin-ext-700-normal.woff2
  - name: legal-nginx
    files:
      - default.conf
