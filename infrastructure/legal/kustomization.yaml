# The pages, the assets and the nginx configuration are read at start, so each ConfigMap's name carries its content's
# hash and a change rolls the pod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: legal
resources:
  - namespace.yaml
  - legal.yaml
  # The design kit's one copy, served beside the legal layer's own files.
  - ../design
configMapGenerator:
  - name: legal-pages
    files:
      - built/impressum.html
      - built/datenschutz.html
      - built/nutzungsbedingungen.html
  # A key holds no slash, so the Deployment's volume maps each key to its path.
  - name: legal-assets
    files:
      - legal-2.css=assets/legal-2.css
  - name: legal-nginx
    files:
      - default.conf
