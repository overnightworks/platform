# Every object states its namespace, as the Role below lives in an app's namespace and a namespace field here would move it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - garage.yaml
  - apply.yaml
configMapGenerator:
  # Garage's configuration; a changed file changes the name, so Flux rolls the pod.
  - name: garage-config
    namespace: objectstore
    files:
      - garage.toml
  # The namespaces that get a bucket and a key; apply.sh reads the key from each one's Secret object-store. A changed
  # list or script changes the name, so Flux recreates the Job.
  - name: buckets
    namespace: objectstore
    files:
      - namespaces
  - name: apply-script
    namespace: objectstore
    files:
      - apply.sh
