apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - garage.yaml
  - apply.yaml
components:
  - ../k8up/image
configMapGenerator:
  # Garage's configuration; a changed file changes the name, so Flux rolls the pod.
  - name: garage-config
    namespace: objectstore
    files:
      - garage.toml
  # The namespaces that get a bucket and a key; apply_buckets.sh reads the keys from each one's Secrets object-store and object-store-backup. A changed
  # list or script changes the name, so Flux recreates the Job.
  - name: buckets
    namespace: objectstore
    files:
      - namespaces.txt
  - name: apply-script
    namespace: objectstore
    files:
      - scripts/apply_buckets.sh
