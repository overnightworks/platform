# One endpoint per service, each asked every 60 seconds with a fixed request. The apps behind Traefik are asked through
# its web port with their own Host header, the way the tunnel asks; the others directly at their Service. Gatus holds no
# key, so the LiteLLM front is healthy when it and LiteLLM answer a call without one with 401.
# Prometheus scrapes the results, which AiGatewayProbeFailing reads.
# The external endpoints are the results of `mise run live:report sign-in`, one row per app of scripts/live_check_apps.sh,
# which pushes each result with the token of the Secret gatus-push; a row shows its first result after its first push, and
# LiveCheckRed reads the group live-check.
metrics: true
storage:
  type: memory
web:
  port: 8080
endpoints:
  - name: hopin
    url: http://traefik.traefik.svc:80/health
    headers:
      Host: hopin.hallucinai.de
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  - name: keycloak
    url: http://traefik.traefik.svc:80/realms/hallucinai/.well-known/openid-configuration
    headers:
      Host: auth.hallucinai.de
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  - name: speech
    url: http://speech-runtime.speech-runtime.svc:8080/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  - name: skat
    url: http://traefik.traefik.svc:80/health
    headers:
      Host: skat.hallucinai.de
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  # Healthy while cloudflared holds an edge connection, so it is red while the platform is offline.
  - name: tunnel
    url: http://cloudflared.cloudflared.svc:2000/ready
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  - name: loki
    url: http://loki.loki.svc:3100/ready
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  - name: prometheus
    url: http://prometheus-server.prometheus.svc:80/-/ready
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  - name: grafana
    url: http://grafana.grafana.svc:80/api/health
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  - name: alertmanager
    url: http://prometheus-alertmanager.prometheus.svc:9093/-/ready
    interval: 60s
    conditions:
      - "[STATUS] == 200"
  - name: litellm
    url: http://litellm-front.litellm.svc:4000/v1/models
    interval: 60s
    conditions:
      - "[STATUS] == 401"
external-endpoints:
  - name: hopin sign-in
    group: live-check
    token: "${GATUS_PUSH_TOKEN}"
  - name: skat sign-in
    group: live-check
    token: "${GATUS_PUSH_TOKEN}"
  - name: presentator sign-in
    group: live-check
    token: "${GATUS_PUSH_TOKEN}"
  - name: songmaker sign-in
    group: live-check
    token: "${GATUS_PUSH_TOKEN}"
