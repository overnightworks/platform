# The token in the Secret tunnel-token, applied from platform-secrets, names the tunnel and carries its credential, so
# this tree holds neither.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
      annotations:
        # cloudflared reads its lines once, when it starts, so a changed line must roll the pod: this is the sha256 of
        # the ConfigMap's data config.yaml, and `cluster` fails with the right value when the two differ.
        checksum/config: 0411a131241609ea8b00dd16dd6b5e080d079eea83098512773ee42de17c8024
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: docker.io/cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
          # --metrics fixes the port of /ready, which the image would pick from a range.
          args:
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - --config
            - /etc/cloudflared/config/config.yaml
            - run
            - --token-file
            - /etc/cloudflared/token/token
          ports:
            - name: metrics
              containerPort: 2000
          # /ready answers 200 only while the tunnel holds an edge connection. No liveness probe: cloudflared
          # reconnects on its own, and a restart creates no connection.
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/cloudflared/config
              readOnly: true
            - name: token
              mountPath: /etc/cloudflared/token
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: cloudflared
        - name: token
          secret:
            secretName: tunnel-token
---
# Gatus asks /ready through this Service, so the status page shows the tunnel's state; the Service has no endpoint
# while cloudflared is stopped (docs/runbooks/take-the-platform-offline.md).
apiVersion: v1
kind: Service
metadata:
  name: cloudflared
  namespace: cloudflared
spec:
  selector:
    app.kubernetes.io/name: cloudflared
  ports:
    - name: metrics
      port: 2000
      targetPort: metrics
---
# Only Gatus reads cloudflared's metrics port, which also serves /metrics, /config and /debug/pprof. The kubelet's
# probes come from the node, which a NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: cloudflared
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The policy opens the metrics port to Gatus's pod alone, and a pod of any other namespace gets no answer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-gatus
  namespace: cloudflared
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gatus
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gatus
      ports:
        - port: 2000
          protocol: TCP
