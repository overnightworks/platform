# The front of LiteLLM: the apps' only way to the gateway, a Traefik that serves the three routes of front-route.yml
# to the Service litellm. It reads no secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm-front
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm-front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm-front
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: docker.io/library/traefik
          ports:
            - name: api
              containerPort: 4000
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: static
              mountPath: /etc/traefik
              readOnly: true
            - name: routes
              mountPath: /litellm-front/dynamic
              readOnly: true
      volumes:
        - name: static
          configMap:
            name: litellm-front
            items:
              - key: traefik.yml
                path: traefik.yml
        - name: routes
          configMap:
            name: litellm-front
            items:
              - key: route.yml
                path: route.yml
---
apiVersion: v1
kind: Service
metadata:
  name: litellm-front
spec:
  selector:
    app.kubernetes.io/name: litellm-front
  ports:
    - name: api
      port: 4000
      targetPort: api
---
# Only the pods of the four apps that call the gateway and of Gatus reach the front; it sends only to cluster DNS and LiteLLM.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-front
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: litellm-front
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [hopin, personas, presentator, songmaker, gatus]
      ports:
        - port: 4000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - port: 4000
          protocol: TCP
