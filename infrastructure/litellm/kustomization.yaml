# LiteLLM, its front and its egress, beside its Postgres from the base. LiteLLM reads its file and each Traefik its
# static file once, at start, while each Traefik watches its dynamic directory; so each ConfigMap's name carries its
# content's hash and a change rolls the pod.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - ../postgres
  - litellm.yaml
  - front.yaml
  - egress.yaml
# The front and the egress run the image of the cluster's ingress, at infrastructure/traefik/values.yaml's
# versionOverride and image.digest, which the P7c cells compare.
images:
  - name: docker.io/library/traefik
    newTag: v3.7.17
    digest: sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
configMapGenerator:
  - name: postgres
    behavior: merge
    literals:
      - key-tables=LiteLLM_VerificationToken
      - backup-repository=http://rest-server.backup.svc.cluster.local:8000/litellm/
  - name: litellm
    files:
      - config.yaml=litellm-config.yaml
  - name: litellm-front
    files:
      - traefik.yml=front-traefik.yml
      - route.yml=front-route.yml
  - name: agent-egress
    files:
      - traefik.yml=egress-traefik.yml
      - allowed.yml=egress-allowed.yml
components:
  - ../postgres/backup
# LiteLLM's hostAliases send the provider names to agent-egress's one fixed address.
replacements:
  - source:
      kind: Service
      name: agent-egress
      fieldPath: spec.clusterIP
    targets:
      - select:
          kind: Deployment
          name: litellm
        fieldPaths:
          - spec.template.spec.hostAliases.0.ip
        options:
          create: true
  - source:
      kind: ConfigMap
      name: postgres
      fieldPath: data.backup-repository
    targets:
      - select:
          kind: Schedule
          name: postgres
        fieldPaths:
          - spec.backend.rest.url
