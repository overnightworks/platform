# LiteLLM's pseudonymous usage rows, deleted 90 days after their day, as the privacy text promises. The statement is
# expire.sql, which the kustomization turns into a ConfigMap; psql comes from the image of this layer's own Postgres,
# which the kustomization copies here. Only the five counts are printed, by name and never a row: psql quotes row values
# in its errors, so its stderr is discarded, and a failure still fails the Job.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: litellm-expire
spec:
  schedule: "0 4 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      # The statement is one transaction, so a rerun is safe; a Pod can start before the network policies admit it to
      # Postgres.
      backoffLimit: 3
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: litellm-expire
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            # The alpine image's postgres user.
            runAsUser: 70
            runAsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: expire
              # Replaced with the StatefulSet postgres's image.
              image: postgres
              command:
                - sh
                - -c
                - exec psql --no-psqlrc --no-align --expanded --set ON_ERROR_STOP=1 --file /etc/expire/expire.sql 2>/dev/null
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: PGDATABASE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: statement
                  mountPath: /etc/expire
                  readOnly: true
          volumes:
            - name: statement
              configMap:
                name: litellm-expire
