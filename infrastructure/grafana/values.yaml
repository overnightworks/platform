# Grafana's chart values; mise run charts:render renders them into rendered.yaml beside this file. A bump changes the
# chart digest in that task and image.tag (which holds the digest) together and regenerates.
# The chart's Role would only serve its sidecars, and the test pod and the ServiceAccount's token are not needed.
rbac:
  create: false
  namespaced: true
testFramework:
  enabled: false
automountServiceAccountToken: false
image:
  registry: docker.io
  repository: grafana/grafana
  # The tag alone moves on Docker Hub after a release, so the image is pinned by its index digest.
  tag: 13.3.0-distroless@sha256:540b8afb775bf34aefce417e4329039daa5d44b6f2fbda6881397b1b247ca7df
# Grafana keeps nothing: what a person builds in the page is gone at the next restart.
persistence:
  enabled: false
# Without this the chart makes a Secret with a random admin password at every render.
env:
  GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
grafana.ini:
  # The page is opened only at the PC through kubectl's forward, so it has no login. Viewer cannot run Explore, so
  # Editor is the lowest role that does.
  auth:
    disable_login_form: true
  auth.anonymous:
    enabled: true
    org_role: Editor
  # Nothing leaves the pod's reach, and Alertmanager is the one alert channel.
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  unified_alerting:
    enabled: false
  # Grafana would fetch its preinstalled apps from grafana.com at every start, which the closed egress stops.
  plugins:
    preinstall_disabled: true
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.loki.svc:3100
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.prometheus.svc:80
        isDefault: true
