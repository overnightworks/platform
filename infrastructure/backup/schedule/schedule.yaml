# k8up's weekly backup of the including layer's namespace into its own repository on the platform's rest-server, its
# retention and its monthly check. A layer that includes this component adds its repository URL.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: backup
spec:
  podConfigRef:
    name: backup
  backend:
    rest:
      url: set-by-the-including-layer
      userSecretRef:
        name: restic
        key: username
      # k8up's field name, misspelled in its API.
      passwordSecretReg:
        name: restic
        key: password
    repoPasswordSecretRef:
      name: restic
      key: repository-password
  backup:
    schedule: "0 3 * * 0"
  prune:
    schedule: "30 3 * * 0"
    retention:
      # k8up passes --keep-daily 14 when keepDaily is not above 0 and has no field that turns it off; with weekly backups
      # that keeps 14 snapshots. 1 keeps only the newest snapshot, which keepWeekly keeps anyway.
      keepDaily: 1
      keepWeekly: 4
      keepMonthly: 3
  check:
    schedule: "0 4 1 * *"
---
# k8up merges this over every Job pod it starts for the Schedule, the only way to the container-level fields a
# restricted namespace requires; it keeps the job's name, image and command.
apiVersion: k8up.io/v1
kind: PodConfig
metadata:
  name: backup
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: job
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
