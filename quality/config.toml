[gate]
mandatory_jobs = ["checks", "cluster", "bootstrap", "opentofu", "images"]
legacy = "fail"

[[root.allow]]
entry = "mise.toml"
reason = "the pinned tools config; mise finds project config only in the root"

[[root.allow]]
entry = "mise.lock"
reason = "the tool lock beside mise.toml; mise finds project config only in the root"

[[root.allow]]
entry = "clusters/"
reason = "Flux's documented layout, ruled Q9 on platform#1"

[[root.allow]]
entry = "infrastructure/"
reason = "Flux's documented layout: the cluster-wide add-ons beside clusters/, the admission vendor list first"

[[root.allow]]
entry = "host/"
reason = "the files the bootstrap writes onto the host, ruled Q9 on platform#1"
