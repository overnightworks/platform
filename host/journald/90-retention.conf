# The host journal keeps no entry older than 29 days. journald deletes a file only when it holds nothing newer than
# MaxRetentionSec, and a file spans MaxFileSec, so the oldest entry is as old as both together. A size cap alone does
# not hold the bound, since a flood fills it in days. The 90- prefix sorts after the distribution's syslog.conf.
[Journal]
MaxRetentionSec=28day
MaxFileSec=1day
