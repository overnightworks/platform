# The host journal keeps no entry older than 29 days. journald deletes a whole file once its oldest entry is older than
# MaxRetentionSec, and a file is closed after MaxFileSec, so the oldest entry is as old as both together.
# A size cap alone does not hold the bound, since a flood fills it in days. The file sets no key the distribution's
# syslog.conf sets, so their order does not matter.
[Journal]
MaxRetentionSec=28day
MaxFileSec=1day
