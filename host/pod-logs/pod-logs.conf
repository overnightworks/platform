# The kubelet's pod logs, each file judged by its creation time alone, so neither a write nor a read keeps it. With
# the daily pod-logs-clean.timer a line goes at most 29 days after it was written, within the 30 days the apps'
# privacy texts promise. An emptied container or pod directory goes with its last file.
e /var/log/pods - - - b:28d
# With container-log-max-files=2 the kubelet makes no compressed copy, and a copy's creation time is younger than its
# lines, so the age above cannot bound one: the clean deletes each one in a container directory, the depth at which the
# kubelet writes its files, and the check names one at any depth.
r /var/log/pods/*/*/*.gz
r /var/log/pods/*/*/*.tmp
