---
# One Kustomization per directory under infrastructure/, so each component waits only for what it needs. Every layer
# that runs a workload depends on admission, so its Pods meet the image policy from its first apply.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/namespaces
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: admission
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 10m0s
  path: ./infrastructure/admission
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
  interval: 10m0s
  path: ./infrastructure/traefik
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
