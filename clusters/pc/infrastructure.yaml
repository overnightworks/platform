---
# One Kustomization per directory under infrastructure/, so each component waits only for what it needs. Every layer
# that runs a workload depends on admission, so its Pods meet the image policy from its first apply.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: namespaces
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./infrastructure/namespaces
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: admission
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
  interval: 10m0s
  path: ./infrastructure/admission
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: traefik
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
  interval: 10m0s
  path: ./infrastructure/traefik
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: legal
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
  interval: 10m0s
  path: ./infrastructure/legal
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: loki
  namespace: flux-system
spec:
  # storage for the claim, admission for the workload.
  dependsOn:
    - name: admission
    - name: storage
  interval: 10m0s
  path: ./infrastructure/loki
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alloy
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
  interval: 10m0s
  path: ./infrastructure/alloy
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# After platform-secrets, which holds the Secret tunnel-token the Deployment cloudflared reads.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tunnel
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
    - name: platform-secrets
  interval: 10m0s
  path: ./infrastructure/cloudflared
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# The local-path provisioner and its one default class, which every claim binds through.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: storage
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
  interval: 10m0s
  path: ./infrastructure/storage
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# keycloak and litellm each run their own Postgres from the base infrastructure/postgres, its password from
# platform-secrets and its claim through storage; apps/skat includes it in its own Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: keycloak
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
    - name: platform-secrets
    - name: storage
    - name: k8up
  interval: 10m0s
  path: ./infrastructure/keycloak
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
    - name: platform-secrets
    - name: storage
    - name: k8up
  interval: 10m0s
  path: ./infrastructure/litellm
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# k8up's operator and its CRDs; the layers with a k8up object depend on it, so their Schedules apply against its CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: k8up
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
  interval: 10m0s
  path: ./infrastructure/k8up
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
# The rest-server of the backups, its Secret rest-users from platform-secrets and its claim through storage.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: backup
  namespace: flux-system
spec:
  dependsOn:
    - name: admission
    - name: platform-secrets
    - name: storage
  interval: 10m0s
  path: ./infrastructure/backup
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
