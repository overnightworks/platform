---
# The private repository platform-secrets, fetched with this machine's read-only deploy key, the Secret
# platform-secrets. Its files are SOPS-age encrypted; Flux decrypts them with the age key in the Secret sops-age.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: platform-secrets
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: platform-secrets
  url: ssh://git@github.com/overnightworks/platform-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-secrets
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./
  prune: true
  wait: true
  timeout: 5m0s
  sourceRef:
    kind: GitRepository
    name: platform-secrets
  decryption:
    provider: sops
    secretRef:
      name: sops-age
