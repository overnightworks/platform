---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: presentator
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-secrets
    - name: admission
    - name: storage
    - name: k8up
    - name: presentator-pull
  interval: 10m0s
  path: ./apps/presentator
  prune: true
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: presentator-pull
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-secrets
    - name: admission
  interval: 10m0s
  retryInterval: 2m0s
  path: ./apps/presentator/pull
  prune: true
  wait: true
  timeout: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
