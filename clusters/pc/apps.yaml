# One Kustomization per directory under apps/, named like the directory and the app's namespace, so that an app's
# objects share one owner that db:load-dump can suspend. Each starts from Secrets in platform-secrets, so it waits for
# that layer, and runs workloads, so it waits for admission, and for app-attestations, whose Kyverno judges every app
# image its Pods name, so no Pod of an app is created before the check can run. An app with a database of its own
# also waits for storage, as the database claims a volume, and for k8up, whose CRDs its backup objects need.
# presentator and songmaker also wait for objectstore, whose Job makes their buckets and keys before their webs start.
# An app that has a pull layer, apps/<app>/pull, has a second Kustomization <app>-pull, which the app's layer waits for:
# its Job pulls the release's images onto the node before the app's layer rolls them. A timeout of the layer does not
# cancel the pull, so the roll follows at the next retry.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hopin
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-secrets
    - name: admission
    - name: app-attestations
    - name: storage
    - name: k8up
    - name: hopin-pull
  interval: 10m0s
  path: ./apps/hopin
  prune: true
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hopin-pull
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-secrets
    - name: admission
    - name: app-attestations
  interval: 10m0s
  retryInterval: 2m0s
  path: ./apps/hopin/pull
  prune: true
  wait: true
  timeout: 30m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
---
