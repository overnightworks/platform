# The apps, one directory each under apps/. They start from Secrets in platform-secrets, so they wait for that layer,
# and run workloads, so they wait for admission.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-secrets
    - name: admission
  interval: 10m0s
  path: ./apps
  # Pruning stays off, so deleting this Kustomization, whose apps move to their own, keeps their objects running.
  prune: false
  wait: true
  timeout: 10m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
