# SCRATCH fixture for #44 E7a: Pods on a host port and on the host network, in the default namespace, which enforces no Pod Security level.
---
apiVersion: v1
kind: Pod
metadata:
  name: host-port
  namespace: default
spec:
  containers:
    - name: traefik
      image: docker.io/library/traefik@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
      ports:
        - containerPort: 8000
          hostPort: 8000
---
apiVersion: v1
kind: Pod
metadata:
  name: host-network
  namespace: default
spec:
  hostNetwork: true
  containers:
    - name: traefik
      image: docker.io/library/traefik@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
      args: ["--entryPoints.web.address=:8123"]
