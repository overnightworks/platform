# presentator's layer as a cell applies it: the placeholder release refuses to start under Kubernetes, so the web sleeps
# without its probes and the worker runs no replica; everything else, the claim, the Secrets, the ConfigMap sqlite and
# the Deployment's template the loader is built from, is the layer's own.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../apps/presentator
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/command
        value: [sleep, "86400"]
      - op: remove
        path: /spec/template/spec/containers/0/startupProbe
      - op: remove
        path: /spec/template/spec/containers/0/readinessProbe
  - target:
      kind: StatefulSet
      name: build-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
