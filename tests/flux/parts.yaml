# The layers each part of the cluster job applies, by the name of their Kustomization in clusters/pc: what its cells
# read, beside which part_closure.sh adds every layer they depend on. The part core applies every layer and runs the
# checks of the whole tree. The parts are the legs of the cluster job's matrix, which parts_for_paths.sh computes: a run
# of a pull request or a push executes core and the parts a changed path selects, through a layer's directory or a glob
# of `paths` (a bash pattern, in which * also crosses /), and every part when a path is unknown. `paths` holds the
# directories of a part's cells; the paths of core are those that select no other part, since no cell of core reads them.
# A part marked nightly_only runs only in a scheduled or dispatched run.
core: {layers: all, paths: [docs/*, "*.md", tests/ingress/a_second_request_with_the_cookie_reaches_the_same_pod.sh, tests/ingress/the_cluster_exposes_only_traefik_and_trusts_the_pod_network.sh, tests/secrets/github_host_keys_pass_only_githubs_own.sh, tests/release_bump/*, tests/secrets/new_key_refuses_unsafe_key_paths.sh, scripts/release_bump*, .github/workflows/release-bump.yml]}
# The realm and its route; skat is the caller whose namespace and Service Keycloak's policies are probed against.
access: {layers: [keycloak, skat, litellm, traefik, hopin, speech-runtime], paths: [scripts/keycloak_login_form.sh, tests/cutover/*, tests/ingress/traefik_answers_only_cloudflared_and_routes_the_app.sh, tests/keycloak/*, tests/litellm/*]}
agents: {layers: [keycloak], paths: [tests/keycloak/*]}
litellm: {layers: [litellm, keycloak], paths: [tests/keycloak/*, tests/litellm/*]}
# Prometheus scrapes songmaker's web and Gatus, and reads litellm's CronJob; Grafana's cell reads a Loki stream, which only alloy ships.
observability: {layers: [prometheus, grafana, loki, alloy, gatus, speech-runtime, songmaker, litellm], paths: [tests/grafana/*, tests/prometheus/*]}
# Gatus probes every endpoint of its configuration.
observability-2: {layers: [gatus, traefik, hopin, skat, keycloak, speech-runtime, loki, prometheus, grafana, litellm, songmaker], paths: [tests/gatus/*]}
apps: {layers: [presentator, songmaker, keycloak, hopin, skat, legal, traefik, tunnel, loki, alloy], paths: [tests/alloy/*, tests/keycloak/*, tests/legal/*, tests/loki/*, tests/no_network/*, tests/presentator/*, tests/songmaker/*]}
# The Postgres cells loop over every namespace whose layer includes the Postgres base, the reader's among them.
load-1: {layers: [hopin, keycloak, litellm, personas, presentator, skat, songmaker, nvidia, traefik], paths: [tests/nvidia/*, tests/personas/migrate_pod.sh, tests/postgres/*, tests/songmaker/*]}
load-2: {layers: [songmaker, hopin, skat], paths: [tests/redis/*]}
# The loader's interrupt cells and the reader's refusal cell run on litellm's Postgres alone, which takes most of a
# part's time.
load-3: {layers: [litellm], paths: [tests/postgres/*]}
# The backup cells loop over the backup namespaces whose layer the part applies (tests/backup/backup_namespaces.sh), and
# Prometheus' rules over their Schedules. The two parts split those namespaces so that each stays within its time; a
# namespace that no backup part applies fails the check of the checks job. The cell that makes LiteLLM's key runs where
# litellm is, the Keycloak table check where keycloak is, songmaker's dump cell and personas' cells in the part that
# applies their layer.
backup-1: {layers: [backup, prometheus, keycloak, litellm, personas], paths: [scripts/backup_now.sh, tests/backup/*, tests/personas/*, tests/prometheus/*]}
# backup-2, backup-4 and backup-5 fill songmaker's bucket from a client Pod that the objectstore cell's helper builds from litellm's image.
backup-2: {layers: [backup, songmaker], paths: [tests/backup/*, tests/disk/*, tests/objectstore/*, infrastructure/litellm/litellm.yaml]}
backup-3: {layers: [backup, prometheus, hopin, presentator, skat, songmaker], paths: [scripts/backup_now.sh, tests/backup/*, tests/prometheus/*]}
# The Backups of songmaker's bucket that need one run each; the namespace songmaker is held by backup-2 and backup-3 too.
backup-4: {layers: [backup, songmaker], paths: [tests/backup/*, tests/objectstore/*, infrastructure/litellm/litellm.yaml]}
# The seed of songmaker's first copy and the fit that refuses a copy beyond the node's eviction margin patch the PreBackupPod
# and run backup:now, which takes minutes on its own.
backup-6: {layers: [backup, songmaker], paths: [scripts/backup_now.sh, tests/backup/*, tests/objectstore/*, infrastructure/litellm/litellm.yaml]}
# The load of songmaker's database, claim and bucket restores them after each of several refusals, kills and re-runs, which takes
# a part's time on its own.
backup-5: {layers: [backup, songmaker], paths: [scripts/load_snapshot.*, tests/backup/*, tests/objectstore/*, infrastructure/litellm/litellm.yaml]}
# The test agents' cells drive Keycloak.
presentator: {layers: [presentator, keycloak], paths: [tests/keycloak/*, tests/no_network/*, tests/presentator/*, tests/redis/*]}
# The attestation probe patches a live presentator Pod, and speech's cell of the two small pods needs the speech layer.
presentator-2: {layers: [presentator, speech-runtime], paths: [tests/admission/app_attestations_refuse_by_dry_run.sh, tests/admission/pause_survives_the_root_reconcile.sh, tests/presentator/*, tests/speech_runtime/two_cpu_pods_serve_behind_the_service.sh, tests/workloads/*]}
# A speech GPU release rolls a stand-in for the GPU Deployment, and its Jobs' and Role's cells stand beside it; the GPU
# release cell takes about four minutes and each of its phases fails within 300 s, inside the part's 17-minute limit; its
# layer's two images start about five times.
speech: {layers: [speech-runtime], paths: [tests/speech_runtime/*]}
# The object store's cell drives Garage and its Job from client Pods in each app's Namespace, which holds no layer here;
# it reads each app's directory for the web's env contract and credentials projection and for the other workloads, and
# litellm's manifest for the client image.
objectstore: {layers: [objectstore], paths: [apps/presentator/*, apps/songmaker/*, infrastructure/litellm/litellm.yaml, infrastructure/postgres/backup/files/scripts/stage_files.sh, scripts/load_snapshot.*, tests/k3s/*, tests/objectstore/*, tests/pod-logs/kubelet_keeps_reopens_and_never_compresses_logs.sh, tests/postgres/interrupt_load.sh, tests/postgres/load_dump.sh, tests/secrets/bootstrap_secrets.sh]}
ai-gateway-outage: {layers: [litellm, gatus, prometheus], nightly_only: true, paths: [tests/prometheus/*]}
