name: ci
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Run malformed clients
        env:
          NO_DIGEST: docker.io/curlimages/curl:8.23.0
          BROKEN_DIGEST: docker.io/curlimages/curl@sha256:short
          UNLISTED: docker.io/someone/tool@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: "true"
