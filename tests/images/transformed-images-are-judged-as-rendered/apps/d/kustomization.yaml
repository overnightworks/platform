apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [deployment.yaml, values.yaml]
replacements:
  - source: {kind: ConfigMap, name: values, fieldPath: data.version}
    targets:
      - select: {kind: Deployment, name: d}
        fieldPaths: ["spec.template.spec.containers.[name=main].image"]
        options: {delimiter: ":", index: 1}
