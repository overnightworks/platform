# An app that runs two images of the owner's registry path, one of them in an init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      initContainers:
        - name: prepare
          image: ghcr.io/overnightworks/demo-prepare:1.0.0@sha256:1111111111111111111111111111111111111111111111111111111111111111
      containers:
        - name: web
          image: ghcr.io/overnightworks/demo-web:1.0.0@sha256:2222222222222222222222222222222222222222222222222222222222222222
