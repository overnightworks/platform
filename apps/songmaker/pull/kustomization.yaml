# songmaker's pull layer: the Job pull of the base, with the four images of the release as image volumes that its
# container mounts. volumes/ adds each volume by the image's name alone, and release/, listed after it, gives those names
# the one ref each that the web, the workers and the migrate init container run; a patch of this file would be applied
# after the Component and leave the volumes without a version.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: songmaker
resources:
  - ../../../infrastructure/pull
components:
  - volumes
  - ../release
