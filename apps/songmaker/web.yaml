# songmaker's web, pulled from its private package through the Secret ghcr-pull and started from the files of the
# Secret songmaker and the namespace's Postgres password, both from platform-secrets, which songmaker reads from the
# fixed directory /run/secrets. The init container migrates the database to the image's head; its first run may find
# Postgres not ready yet, and the init container's backoff heals that. The image's own start runs through uv; the
# container runs the installed program directly instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: songmaker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # The image's numeric USER, and the reading uid: the backup's PreBackupPod and k8up's Job pods copy it by the
        # replacement in kustomization.yaml, so they read the audio files this pod writes.
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/overnightworks/songmaker/web
          command: [/app/.venv/bin/alembic, upgrade, head]
          env:
            # The URL names no password: the file in /run/secrets is the password's one owner, the namespace's Postgres.
            - name: DATABASE_URL
              value: postgresql://songmaker@postgres:5432/songmaker
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: postgres-password
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: web
          image: ghcr.io/overnightworks/songmaker/web
          command: [/app/.venv/bin/songmaker, server, --port, '8080']
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgresql://songmaker@postgres:5432/songmaker
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: LOG_FORMAT
              value: json
            - name: HOST
              value: 0.0.0.0
            # The Host check admits the public host, localhost, the host of the kubelet's probe, web, the name the
            # GPU worker sends with its control-plane URL, and the Service's name Prometheus scrapes it by.
            - name: ALLOWED_HOSTS
              value: songmaker.hallucinai.de,web,web.songmaker.svc,localhost
            # The pod network, where Traefik's pods change address on every restart; the NetworkPolicies below admit
            # only Traefik's, Prometheus's, Keycloak's and the namespace's own pods, so their forwarded headers are
            # trusted too.
            - name: TRUSTED_PROXIES
              value: 10.42.0.0/16
            # The web refuses to start without its sign-in settings, though it asks Keycloak only at a sign-in.
            - name: OIDC_ISSUER
              value: https://auth.hallucinai.de/realms/hallucinai
            - name: OIDC_CLIENT_ID
              value: songmaker
            - name: OIDC_CLIENT_SECRET_FILE
              value: /run/secrets/oidc_client_secret
            - name: PUBLIC_BASE_URL
              value: https://songmaker.hallucinai.de
            # The co-writer's gateway is the platform's AI front with the key of this app's row in keys.yaml; a partly set
            # value stops the start, so the four stand together. MCP stays off without a client id.
            - name: AGENT__BACKEND
              value: litellm
            - name: AGENT__GATEWAY__ORIGIN
              value: http://litellm-front.litellm:4000
            - name: AGENT__GATEWAY__KEY_FILE
              value: /run/secrets/litellm_key
            - name: AGENT__API_GROUP
              value: /services/litellm
          # The start runs the migrations under a lock before it serves, so a slow one is not a failed start.
          startupProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: audio
              mountPath: /app/data/audio
            - name: queue-streams
              mountPath: /app/data/queue-streams
            - name: tmp
              mountPath: /tmp
      volumes:
        # Every key of the Secret songmaker becomes a file, beside the Postgres password under the name songmaker reads.
        - name: secrets
          projected:
            sources:
              - secret:
                  name: songmaker
              - secret:
                  name: postgres
                  items:
                    - key: password
                      path: postgres_password
        - name: postgres-password
          projected:
            sources:
              - secret:
                  name: postgres
                  items:
                    - key: password
                      path: postgres_password
        - name: audio
          persistentVolumeClaim:
            claimName: audiofiles
        - name: queue-streams
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: songmaker
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Cloudflare terminates TLS, so the route is plain HTTP on Traefik's web port, and it names its host, so every other
# host keeps Traefik's 404.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: songmaker
spec:
  ingressClassName: traefik
  rules:
    - host: songmaker.hallucinai.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
---
# Traefik's pods, Prometheus's and the namespace's own reach the web, and Keycloak's through the next policy; the kubelet's
# probe comes from the node, which a NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web
  namespace: songmaker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: prometheus
      ports:
        - port: http
          protocol: TCP
---
# Keycloak posts its back-channel logout here, from its own pods and no others of its namespace. The web does not
# check the Host of that route: Traefik's router refuses the path on every public host, and this policy and the one
# above keep every other sender off the Service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backchannel-from-keycloak
  namespace: songmaker
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: http
          protocol: TCP
