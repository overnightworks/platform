# The release of songmaker's four images, each the full app ref of a release that changes only in a pull request: their
# one owner, included by the layer and by its pull layer, so that the web, the migrate init container, the workers and
# the pull layer's image volumes run one ref each. A bump changes the tags and digests together. The field spec makes the
# transform rewrite the reference of a Job's image volume too, which it leaves alone by default.
