apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: songmaker
resources:
  - ../../infrastructure/postgres
  - redis.yaml
  - audio.yaml
  - web.yaml
  - music-worker.yaml
  - scoring-worker.yaml
components:
  - ../../infrastructure/postgres/backup
  - ../../infrastructure/postgres/backup/files
configMapGenerator:
  - name: postgres
    behavior: merge
    literals:
      # alembic_version, which alembic upgrade fills, comes first: the restore test fails on an empty first table.
      - key-tables=alembic_version songs generations
      - backup-repository=http://rest-server.backup.svc.cluster.local:8000/songmaker/
      # The claim the backup copies beside the dump, through ../../infrastructure/postgres/backup/files.
      - backup-claim=audiofiles
replacements:
  - source:
      kind: ConfigMap
      name: postgres
      fieldPath: data.backup-repository
    targets:
      - select:
          kind: Schedule
          name: postgres
        fieldPaths:
          - spec.backend.rest.url
  # The reading uid: the backup copies the audio files and k8up's Job pods read the copy as the web's user.
  - source:
      kind: Deployment
      name: web
      fieldPath: spec.template.spec.securityContext.runAsUser
    targets:
      - select:
          kind: PreBackupPod
          name: files
        fieldPaths:
          - spec.pod.spec.securityContext.runAsUser
      - select:
          kind: PodConfig
          name: postgres-backup
        fieldPaths:
          - spec.template.spec.securityContext.runAsUser
        options:
          create: true
patches:
  # The staged dump is 0640 at group 70, the Postgres image's group, so the Job pods read it through a supplemental
  # group; their primary group stays, so the cache directory they create stays writable.
  - target:
      kind: PodConfig
      name: postgres-backup
    patch: |
      - op: add
        path: /spec/template/spec/securityContext/supplementalGroups
        value: [70]
