apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: songmaker
resources:
  - ../../infrastructure/postgres
  - ../../infrastructure/redis
  - audio.yaml
  - web.yaml
  - music-worker.yaml
  - scoring-worker.yaml
  - acestep-worker.yaml
components:
  - ../../infrastructure/postgres/backup
  - ../../infrastructure/postgres/backup/files
  # The Namespace's bucket, copied beside the claim and the dump with the read-only key of the Secret object-store-backup.
  - ../../infrastructure/postgres/backup/files/bucket
  - release
configMapGenerator:
  - name: postgres
    behavior: merge
    literals:
      # alembic_version, which alembic upgrade fills, comes first: the restore test fails on an empty first table.
      - key-tables=alembic_version songs generations
      - backup-repository=http://rest-server.backup.svc.cluster.local:8000/songmaker/
      # The claim the backup copies beside the dump, through ../../infrastructure/postgres/backup/files.
      - backup-claim=audiofiles
replacements:
  - source:
      kind: ConfigMap
      name: postgres
      fieldPath: data.backup-repository
    targets:
      - select:
          kind: Schedule
          name: backup
        fieldPaths:
          - spec.backend.rest.url
  # The reading uid: the backup copies the audio files and the bucket, and k8up's Job pods read the copies as the web's
  # user; the copy and bucket containers take it as their group too, which is not the dump's.
  - source:
      kind: Deployment
      name: web
      fieldPath: spec.template.spec.securityContext.runAsUser
    targets:
      - select:
          kind: PreBackupPod
          name: files
        fieldPaths:
          - spec.pod.spec.securityContext.runAsUser
          - spec.pod.spec.containers.[name=copy].securityContext.runAsGroup
          - spec.pod.spec.containers.[name=bucket].securityContext.runAsGroup
      - select:
          kind: PodConfig
          name: backup
        fieldPaths:
          - spec.template.spec.securityContext.runAsUser
        options:
          create: true
