# songmaker's music worker, pulled from the same private package release as the web and started from the two files of
# the Secret songmaker it reads and the namespace's Postgres password, which songmaker reads from the fixed directory
# /run/secrets. Its settings refuse any other file there. It has no port; it is ready while the file it writes under /tmp
# holds this start's owner id and PID 1's current start ticks and that owner's lease is live. It calls the GPU
# worker by the host the database holds, which no workload of this layer serves yet.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: music-worker
  namespace: songmaker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: music-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: music-worker
    spec:
      # The worker drains its running jobs for up to 300 s after SIGTERM (songmaker's worker_drain_timeout), and the
      # grace leaves about 30 s of stop work above it.
      terminationGracePeriodSeconds: 330
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # The kubelet verifies the image's numeric USER 1000 as non-root, so no runAsUser repeats it.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: music-worker
          image: ghcr.io/overnightworks/songmaker/music-worker
          env:
            # The URL names no password: the file in /run/secrets is the password's one owner, the namespace's Postgres.
            - name: DATABASE_URL
              value: postgresql://songmaker@postgres:5432/songmaker
            # songmaker's documented defaults, stated so that the connections this process may hold, pool + overflow + 1,
            # are read from here by tests/postgres/connections_stay_within_max_connections.sh.
            - name: DATABASE_POOL_SIZE
              value: '5'
            - name: DATABASE_MAX_OVERFLOW
              value: '10'
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: LOG_FORMAT
              value: json
            # numba, which audio_engine's mastering uses with cache=True, writes its cache beside the source or under
            # HOME, and the root is read-only.
            - name: NUMBA_CACHE_DIR
              value: /tmp
          # The script resolves against the image's working directory, /app, and reads the file the worker writes under
          # /tmp; it succeeds once that file's ticks are current and the owner's lease is live.
          startupProbe:
            exec:
              command: &health [/app/.venv/bin/python, scripts/worker_readiness.py]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: *health
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: audio
              mountPath: /app/data/audio
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: songmaker
                  items:
                    - key: session_secret
                      path: session_secret
                    - key: songmaker_internal_token
                      path: songmaker_internal_token
              - secret:
                  name: postgres
                  items:
                    - key: password
                      path: postgres_password
        - name: audio
          persistentVolumeClaim:
            claimName: audiofiles
        - name: tmp
          emptyDir:
            medium: Memory
