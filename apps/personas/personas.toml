# The runner's configuration, whose fields personas' README and src/personas/config.py own. The realm, the apps and the
# gateway are the platform's; the persona files ship in the image. No turn cap is set until the operator turns one on.
token_endpoint = "https://auth.hallucinai.de/realms/hallucinai/protocol/openid-connect/token"
ready_file = "/tmp/ready"

# A turn binds every tool an app lists when it starts; the app decides what an agent may do. Leonardo's client lacks
# mcp-songmaker, so the runner's request for the scope is refused on each of his turns and logs tools_only_app_failed:
# visible and harmless, and his turn runs on the other apps' tools.
[[apps]]
mcp_url = "https://hopin.hallucinai.de/mcp"
scope = "mcp-hopin"
max_tool_calls = 2

[[apps]]
mcp_url = "https://skat.hallucinai.de/mcp"
scope = "mcp-skat"
max_tool_calls = 4

[[apps]]
mcp_url = "https://songmaker.hallucinai.de/mcp"
scope = "mcp-songmaker"
listens = false
max_tool_calls = 6

# The runner's Postgres in this namespace, whose password is the Secret postgres' file: ownership of each agent, his
# history and, with [memory], every line he read.
[database]
host = "postgres"
port = 5432
dbname = "personas"
user = "personas"
password_file = "/run/postgres/password"

# A line is kept 30 days, which the table states so that a new default of the release does not change it.
[memory]
lines_keep_days = 30

# Every agent's token carries /agents, and the gateway refuses a turn whose person is outside the group.
[gateway]
api_group = "/agents"

[gateway.gateway]
origin = "http://litellm-front.litellm:4000"
key_file = "/run/secrets/litellm_key"

# Mozart runs Haiku without thinking, so a call shows whether its faster first token is heard.
[[agents]]
client_id = "agent-mozart"
secret_file = "/run/secrets/mozart_client_secret"
persona_file = "/app/characters/mozart.md"
model = "text/haiku-fast"
figure = { url = "https://github.com/overnightworks/personas/releases/download/v2026.11.19.1/mozart.vrm", sha256 = "61ddbe483b0de6ace152f7b8b0a972abcc444101523572afb6293e70320350e2" }
# ryan exists only in speech's GPU image; Thorsten is speech's male German Piper voice for the CPU.
voice = { names = ["ryan", "de_DE-thorsten-medium"] }

[[agents]]
client_id = "agent-leonardo"
secret_file = "/run/secrets/leonardo_client_secret"
persona_file = "/app/characters/leonardo.md"
figure = { url = "https://github.com/overnightworks/personas/releases/download/v2026.11.19.1/leonardo.vrm", sha256 = "0d439c692756c7e26340e9ea2699ae309cbade0d7139959f684a7fe75a6cea33" }
# ryan exists only in speech's GPU image; Thorsten is speech's male German Piper voice for the CPU.
voice = { names = ["ryan", "de_DE-thorsten-medium"] }

# The four test agents run on gateway models of their own, so that one call compares a lower effort and Haiku. They have
# no figure yet; each speaks first with a voice of the language its prompt defaults to, German.

[[agents]]
client_id = "agent-humboldt"
secret_file = "/run/secrets/humboldt_client_secret"
persona_file = "/app/characters/humboldt.md"
model = "text/sonnet-medium"
voice = { names = ["de_DE-thorsten-medium", "en_US-norman-medium"] }

[[agents]]
client_id = "agent-curie"
secret_file = "/run/secrets/curie_client_secret"
persona_file = "/app/characters/curie.md"
model = "text/sonnet-low"
voice = { names = ["de_DE-kerstin-medium", "en_US-ljspeech-medium"] }

[[agents]]
client_id = "agent-lovelace"
secret_file = "/run/secrets/lovelace_client_secret"
persona_file = "/app/characters/lovelace.md"
model = "text/haiku-medium"
voice = { names = ["de_DE-kerstin-medium", "en_GB-cori-medium"] }

[[agents]]
client_id = "agent-hildegard"
secret_file = "/run/secrets/hildegard_client_secret"
persona_file = "/app/characters/hildegard.md"
model = "text/haiku-low"
voice = { names = ["de_DE-kerstin-medium", "en_GB-cori-medium"] }
