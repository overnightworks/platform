# The runner's configuration, whose fields personas' README and src/personas/config.py own. The realm, the apps and the
# gateway are the platform's; the persona files ship in the image. No turn cap is set until the operator turns one on.
token_endpoint = "https://auth.hallucinai.de/realms/hallucinai/protocol/openid-connect/token"
ready_file = "/tmp/ready"

[[apps]]
mcp_url = "https://hopin.hallucinai.de/mcp"
scope = "mcp-hopin"
tools = ["say"]
max_tool_calls = 2

# skat's agents get only the tools a seated agent needs to play a hand. Anyone in a call can talk an agent into a
# table action, so the calls that give up or end a game, leave or open a table, and change series or rule sets stay
# unbound. A turn runs only while the app declares every tool named here.
[[apps]]
mcp_url = "https://skat.hallucinai.de/mcp"
scope = "mcp-skat"
tools = [
  "read_table",
  "auction_bid",
  "auction_hold",
  "auction_pass",
  "auction_play",
  "take_skat",
  "put_back_cards",
  "declare_game",
  "play_card",
  "continue_after_result",
  "say_kontra",
  "say_no_word",
  "ramsch_take_skat",
  "ramsch_put_back_cards",
  "ramsch_push_skat",
]
max_tool_calls = 4

# Every agent's token carries /agents, and the gateway refuses a turn whose person is outside the group.
[gateway]
backend = "litellm"
api_group = "/agents"

[gateway.gateway]
origin = "http://litellm-front.litellm:4000"
key_file = "/run/secrets/litellm_key"

[[agents]]
client_id = "agent-mozart"
secret_file = "/run/secrets/mozart_client_secret"
persona_file = "/app/characters/mozart.md"

[[agents]]
client_id = "agent-leonardo"
secret_file = "/run/secrets/leonardo_client_secret"
persona_file = "/app/characters/leonardo.md"
