# The runner's configuration, whose fields personas' README and src/personas/config.py own. The realm, the apps and the
# gateway are the platform's; the persona files ship in the image. No turn cap is set until the operator turns one on.
token_endpoint = "https://auth.hallucinai.de/realms/hallucinai/protocol/openid-connect/token"
ready_file = "/tmp/ready"

# A turn binds every tool an app lists when it starts; the app decides what an agent may do.
[[apps]]
mcp_url = "https://hopin.hallucinai.de/mcp"
scope = "mcp-hopin"
max_tool_calls = 2

[[apps]]
mcp_url = "https://skat.hallucinai.de/mcp"
scope = "mcp-skat"
max_tool_calls = 4

[[apps]]
mcp_url = "https://songmaker.hallucinai.de/mcp"
scope = "mcp-songmaker"
listens = false
max_tool_calls = 6

# The runner's Postgres in this namespace, whose password is the Secret postgres' file: ownership of each agent, his
# history and, with [memory], every line he read.
[database]
host = "postgres"
port = 5432
dbname = "personas"
user = "personas"
password_file = "/run/postgres/password"

# A line is kept 30 days, which the table states so that a new default of the release does not change it.
[memory]
lines_keep_days = 30

# Every agent's token carries /agents, and the gateway refuses a turn whose person is outside the group.
[gateway]
api_group = "/agents"

[gateway.gateway]
origin = "http://litellm-front.litellm:4000"
key_file = "/run/secrets/litellm_key"

# Mozart runs Haiku without thinking, so a call shows whether its faster first token is heard.
[[agents]]
client_id = "agent-mozart"
secret_file = "/run/secrets/mozart_client_secret"
persona_file = "/app/characters/mozart.md"
model = "text/haiku-fast"
figure = { url = "https://github.com/overnightworks/personas/releases/download/v2026.11.27.1/mozart.vrm", sha256 = "61ddbe483b0de6ace152f7b8b0a972abcc444101523572afb6293e70320350e2" }
# ryan exists only in speech's GPU image; Thorsten is speech's male German Piper voice for the CPU.
voice = { names = ["ryan", "de_DE-thorsten-medium"] }
room = { url = "https://github.com/overnightworks/personas/releases/download/v2026.11.27.1/mozart.room.glb", sha256 = "def5d5dc1acbd1ff689ea9e6d20f09d69b3c1272ebd166dafa383541caee0795" }

[[agents]]
client_id = "agent-leonardo"
secret_file = "/run/secrets/leonardo_client_secret"
persona_file = "/app/characters/leonardo.md"
figure = { url = "https://github.com/overnightworks/personas/releases/download/v2026.11.27.1/leonardo.vrm", sha256 = "0d439c692756c7e26340e9ea2699ae309cbade0d7139959f684a7fe75a6cea33" }
# ryan exists only in speech's GPU image; Thorsten is speech's male German Piper voice for the CPU.
voice = { names = ["ryan", "de_DE-thorsten-medium"] }
room = { url = "https://github.com/overnightworks/personas/releases/download/v2026.11.27.1/leonardo.room.glb", sha256 = "de0198142b69a0883cca307d56dc5a767c152af95b5ef6cdb0b0e785f0498c9d" }

# The four test agents run on gateway models of their own, so that one call compares a lower effort and Haiku. Each
# speaks first with a voice of the language its prompt defaults to, German.

