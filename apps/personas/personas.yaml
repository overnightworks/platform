# The personas runner: Mozart and Leonardo as agents of hopin and skat, pulled from its package through the Secret
# ghcr-pull and started from the Secret personas' files, both from platform-secrets. The runner opens no port, so there
# is no Service and no Ingress; it is Ready once the first loop's standing was answered, which creates its ready_file.
# The Secret holds a copy of two client secrets that the Secret keycloak also holds (client-agent-mozart,
# client-agent-leonardo), since a Secret cannot be mounted across namespaces: a rotation writes both.
# One pod runs and a restart empties every agent's history, as the runner keeps no memory.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personas
  namespace: personas
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: personas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personas
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # The kubelet verifies the image's numeric USER 1001 as non-root, so no runAsUser repeats it.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: personas
          image: ghcr.io/overnightworks/personas:2026.11.11.1@sha256:62b38f4bce62185cb096badbb360e604a679d52d94ee02526d595b0dbbd441ef
          env:
            - name: PERSONAS_CONFIG
              value: /etc/personas/personas.toml
          # The runner creates its ready_file when an app accepted a token, so a wrong secret or URL shows as not
          # ready. No liveness probe: a restart empties every history.
          readinessProbe:
            exec:
              command: [test, -e, /tmp/ready]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/personas
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: personas
        # Every key of the Secret becomes a file, so a missing one stops the runner's start naming its field.
        - name: secrets
          secret:
            secretName: personas
        # ready_file lives here, and nothing outlives the pod.
        - name: tmp
          emptyDir:
            medium: Memory
---
# Nobody reaches the runner. It sends only to cluster DNS, the front's port and port 443 outside the pod and service
# networks, where the realm's token endpoint and the MCP URLs of hopin and skat are public names behind Cloudflare; a
# NetworkPolicy cannot name a host, so every public host on 443 is open to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: personas
  namespace: personas
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: personas
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-front
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16, 10.43.0.0/16]
      ports:
        - port: 443
          protocol: TCP
