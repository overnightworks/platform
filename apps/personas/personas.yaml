# The personas runner: six agents, Mozart and Leonardo as agents of hopin and skat, Mozart also of songmaker, and four
# test agents, pulled from its package through the Secret ghcr-pull and started from the Secret personas' files, both from
# platform-secrets. The
# runner opens no port, so there is no Service and no Ingress; it is Ready once a round of its contention for the agents
# was answered, which creates its ready_file, whether it won an agent or not.
# The Secret holds a copy of six client secrets that the Secret keycloak also holds (client-agent-mozart,
# client-agent-leonardo, client-agent-humboldt, client-agent-curie, client-agent-lovelace, client-agent-hildegard),
# since a Secret cannot be mounted across namespaces: rotating a client's secret updates both Secrets.
# The init container migrates the memory's database to the image's head, which the runner demands at start; its first run
# may find Postgres not ready yet, and the init container's backoff heals that. The runner's history in memory is empty
# after a restart; what the agents read is kept in the namespace's Postgres, which the runner tells them as the day.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: personas
  namespace: personas
  annotations:
    # A pod holds at most 31 connections with [memory]: one for its locks, the history store's pool of 5 and overflow of
    # 10, and as many again for the line store (personas' README, The connection budget). The runner fixes them, so they
    # are stated here, and tests/postgres/connections_stay_within_max_connections.sh reads them.
    hallucinai.de/postgres-connections-per-pod: '31'
spec:
  # Two pods, so a kill or a rollout leaves one that can take the agents over. A surge pod turns Ready while it contends
  # and holds no agent, and no pod stops before its replacement is Ready, so one Ready pod stays throughout. The
  # surge of one runs three pods; their 93 connections are what the Postgres of this namespace has room for.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: personas
  template:
    metadata:
      labels:
        app.kubernetes.io/name: personas
    spec:
      # personas finishes its calls within `[ownership] stop_seconds` (default 10) after SIGTERM; 15 leaves room
      # for its exit before the kubelet kills it.
      terminationGracePeriodSeconds: 15
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # The kubelet verifies the image's numeric USER 1001 as non-root, so no runAsUser repeats it.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/overnightworks/personas:2026.11.18.1@sha256:08d2fc15892d99e57cf75210d417f66e6a81311bd23f55430326077c1a4ff055
          args: [personas, migrate]
          # The command reads the whole configuration, so it mounts what the runner does.
          env:
            - name: PERSONAS_CONFIG
              value: /etc/personas/personas.toml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/personas
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: postgres-password
              mountPath: /run/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: personas
          image: ghcr.io/overnightworks/personas:2026.11.18.1@sha256:08d2fc15892d99e57cf75210d417f66e6a81311bd23f55430326077c1a4ff055
          env:
            - name: PERSONAS_CONFIG
              value: /etc/personas/personas.toml
          # The runner creates its ready_file once a round of its contention answered, so a pod that cannot reach its
          # Postgres shows as not ready. No liveness probe: a restart empties every history.
          readinessProbe:
            exec:
              command: [test, -e, /tmp/ready]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/personas
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: postgres-password
              mountPath: /run/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: personas
        # Every key of the Secret becomes a file, so a missing one stops the runner's start naming its field.
        - name: secrets
          secret:
            secretName: personas
        - name: postgres-password
          secret:
            secretName: postgres
        # ready_file lives here, and nothing outlives the pod.
        - name: tmp
          emptyDir:
            medium: Memory
---
# Nobody reaches the runner. It sends only to cluster DNS, its Postgres, the front's port and port 443 outside the pod
# and service networks, where the realm's token endpoint and the MCP URLs of hopin, skat and songmaker are public names
# behind Cloudflare; a NetworkPolicy cannot name a host, so every public host on 443 is open to it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: personas
  namespace: personas
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: personas
  policyTypes:
    - Ingress
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm
          podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm-front
      ports:
        - port: 4000
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [10.42.0.0/16, 10.43.0.0/16]
      ports:
        - port: 443
          protocol: TCP
