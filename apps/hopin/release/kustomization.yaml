# The release of hopin's image, the full app ref of a release that changes only in a pull request: its one owner,
# included by the layer and by its pull layer, so that the init container, the main container and the pull layer's image
# volume run one ref. A bump changes tag and digest together. The field spec makes the transform rewrite the reference of
# a Job's image volume too, which it leaves alone by default.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: ghcr.io/overnightworks/hopin
    newTag: 2026.11.27.2
    digest: sha256:f7ae25332539b8835c2b4295756710392e78cf57c96dc2f0264489c8e36b3438
configurations:
  - image-volume.yaml
