# HopIn, pulled from its private package through the Secret ghcr-pull and started from the Secret hopin's files, both
# from platform-secrets, on the Postgres of this namespace, which holds its accounts and sessions. A call's state lives
# in the one process's memory, so one pod runs and a deploy ends every running call, as on hal. The init container
# migrates the database to the image's head, which `hopin serve` demands at start; its first run may find Postgres not
# ready yet, and the init container's backoff heals that.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hopin
  namespace: hopin
  annotations:
    # A pool of 5 and an overflow of 5, which tests/postgres/connections_stay_within_max_connections.sh reads.
    hallucinai.de/postgres-connections-per-pod: '10'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hopin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hopin
    spec:
      automountServiceAccountToken: false
      # The Service hopin would inject HOPIN_PORT=tcp://<address>:8080, which hopin reads as its own port setting.
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # The kubelet verifies the image's numeric USER 1001 as non-root, so no runAsUser repeats it.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/overnightworks/hopin:2026.11.23.3@sha256:467945536f37feeace45669fe436110b4176cbf3dfb63b22cb36e58cd887fa7e
          args: [hopin, migrate]
          env:
            # The URL names no password: the file below is the password's one owner, the namespace's Postgres.
            - name: HOPIN_DATABASE_URL
              value: postgresql://hopin@postgres:5432/hopin
            - name: HOPIN_DATABASE_PASSWORD_FILE
              value: /run/postgres/password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: postgres-password
              mountPath: /run/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: hopin
          image: ghcr.io/overnightworks/hopin:2026.11.23.3@sha256:467945536f37feeace45669fe436110b4176cbf3dfb63b22cb36e58cd887fa7e
          ports:
            - name: http
              containerPort: 8080
          env:
            # The realm names under docs/app.md's scheme, which tests/keycloak/handed_realm_names_are_declared.sh holds to realm.yaml.
            - name: REALM_CLIENT_ID
              value: hopin
            - name: REALM_LOGIN_GROUP
              value: /apps/hopin
            - name: REALM_ADMIN_GROUP
              value: /apps/hopin/admin
            - name: REALM_MCP_GROUP
              value: /apps/hopin/mcp
            - name: REALM_MCP_SCOPE
              value: mcp-hopin
            - name: REALM_AGENT_GROUP
              value: /agents
            - name: REALM_MCP_CLIENT_ID
              value: agents
            - name: HOPIN_OIDC_ISSUER
              value: https://auth.hallucinai.de/realms/hallucinai
            - name: HOPIN_OIDC_CLIENT_SECRET_FILE
              value: /run/secrets/oidc_client_secret
            - name: HOPIN_PUBLIC_ORIGIN
              value: https://hopin.hallucinai.de
            - name: HOPIN_DATABASE_URL
              value: postgresql://hopin@postgres:5432/hopin
            - name: HOPIN_DATABASE_PASSWORD_FILE
              value: /run/postgres/password
            - name: HOPIN_REDIS_URL
              value: redis://redis:6379/0
            - name: HOPIN_SESSION_SECRET_FILE
              value: /run/secrets/session_secret
            - name: HOPIN_TURN_PROVIDER
              value: cloudflare
            - name: HOPIN_TURN_KEY_ID_FILE
              value: /run/secrets/turn_key_id
            - name: HOPIN_TURN_API_TOKEN_FILE
              value: /run/secrets/turn_api_token
            - name: HOPIN_AGENT__GATEWAY__ORIGIN
              value: http://litellm-front.litellm:4000
            - name: HOPIN_AGENT__GATEWAY__KEY_FILE
              value: /run/secrets/litellm_key
            - name: HOPIN_AGENT__API_GROUP
              value: /services/litellm
            # The URL prefixes an agent's figure is fetched under, a JSON list: personas' release assets, which the
            # runner's figure lines name. A prefix holds no secret, so the value stands in the manifest.
            - name: HOPIN_FIGURE_SOURCES
              value: '["https://github.com/overnightworks/personas/releases/download/"]'
            # The speech service's Service and the Keycloak scope its token carries: with both set, hearing lets an agent
            # hear its sponsor and speaking lets an agent with an account of its own speak in a call.
            - name: HOPIN_SPEECH__ORIGIN
              value: http://speech-runtime.speech-runtime.svc.cluster.local:8080
            - name: HOPIN_SPEECH__AUDIENCE_SCOPE
              value: speech-service-audience
            - name: HOPIN_SPEECH__HEARING
              value: "true"
            - name: HOPIN_SPEECH__SPEAKING
              value: "true"
            # The apps a call shows in a frame, as JSON; {context} in frame_path is the call's context.
            - name: HOPIN_STAGE_APPS
              value: '[{"name":"skat","title":"Skat","origin":"https://skat.hallucinai.de","frame_path":"/t/{context}"}]'
            # The pod network, where Traefik's pods change address on every restart; the NetworkPolicies below admit
            # only Traefik's and Keycloak's, so no other pod can name a client address in X-Forwarded-For.
            - name: HOPIN_TRUSTED_PROXIES
              value: 10.42.0.0/16
          # No liveness probe: a restart ends every call and session.
          readinessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            # Not under /run/secrets, which is the mount of the Secret hopin.
            - name: postgres-password
              mountPath: /run/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Every key of the Secret becomes a file, so a missing one stops HopIn's start naming its setting.
        - name: secrets
          secret:
            secretName: hopin
        - name: postgres-password
          secret:
            secretName: postgres
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hopin
  # Traefik reads its sticky cookie from the Service an Ingress routes to; every such Service carries the same five
  # annotations, which tests/ingress/every_routed_service_carries_the_same_sticky_cookie.sh holds equal.
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: __Host-route
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: lax
  namespace: hopin
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hopin
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Cloudflare terminates TLS, so the route is plain HTTP on Traefik's web port, and it names its host, so every other
# host keeps Traefik's 404.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hopin
  namespace: hopin
spec:
  ingressClassName: traefik
  rules:
    - host: hopin.hallucinai.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hopin
                port:
                  number: 8080
---
# hopin trusts the X-Forwarded-For of the pod network, so only Traefik's pods and, through the next policy, Keycloak's
# may reach it; the kubelet's probe comes from the node, which a NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: http-from-traefik-only
  namespace: hopin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: http
          protocol: TCP
---
# Keycloak posts its back-channel logout here, from its own pods and no others of its namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backchannel-from-keycloak
  namespace: hopin
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: http
          protocol: TCP
