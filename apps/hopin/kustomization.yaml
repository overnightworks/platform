apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hopin
resources:
  - ../../infrastructure/postgres
  - ../../infrastructure/redis
  - hopin.yaml
components:
  - ../../infrastructure/postgres/backup
  - release
configMapGenerator:
  - name: postgres
    behavior: merge
    literals:
      # alembic_version, which hopin migrate fills, comes first: the restore test fails on an empty first table.
      - key-tables=alembic_version accounts sessions
      - backup-repository=http://rest-server.backup.svc.cluster.local:8000/hopin/
replacements:
  - source:
      kind: ConfigMap
      name: postgres
      fieldPath: data.backup-repository
    targets:
      - select:
          kind: Schedule
          name: postgres
        fieldPaths:
          - spec.backend.rest.url
