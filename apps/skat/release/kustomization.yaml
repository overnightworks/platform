# The release of skat's image, the full app ref of a release that changes only in a pull request: its one owner,
# included by the layer and by its pull layer, so that the init container, the main container and the pull layer's image
# volume run one ref. A bump changes tag and digest together. The field spec makes the transform rewrite the reference of
# a Job's image volume too, which it leaves alone by default.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: ghcr.io/overnightworks/skat
    newTag: 2026.11.28.1
    digest: sha256:1badf26cef8fe3c090000334e7fec3fb83de2739d5ce9e7ba98e989b9da6224e
configurations:
  - image-volume.yaml
