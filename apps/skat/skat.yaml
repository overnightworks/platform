# skat, pulled from its private package through the Secret ghcr-pull and started from the Secret skat's files, both
# from platform-secrets, on the Postgres of this namespace. The init container migrates the database to the image's
# head, which `skat serve` demands at start; its first run may find Postgres not ready yet, and the init container's
# backoff heals that. Its Ingress and NetworkPolicy route it through Traefik alone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skat
  namespace: skat
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: skat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skat
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # The kubelet verifies the image's numeric USER 1001 as non-root, so no runAsUser repeats it.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/overnightworks/skat:2026.11.14.4@sha256:c20fe6832e95252661eb57ea7fd1aaec7884705926a755755e3d49d5ec1af261
          args: [skat, migrate]
          env:
            # The URL names no password: the file below is the password's one owner, the namespace's Postgres.
            - name: SKAT_DATABASE_URL
              value: postgresql://skat@postgres:5432/skat
            - name: SKAT_DATABASE_PASSWORD_FILE
              value: /run/secrets/postgres/password
            - name: SKAT_OPERATOR_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: skat
                  key: operator_account_id
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: postgres-password
              mountPath: /run/secrets/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: skat
          image: ghcr.io/overnightworks/skat:2026.11.14.4@sha256:c20fe6832e95252661eb57ea7fd1aaec7884705926a755755e3d49d5ec1af261
          args: [skat, serve]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SKAT_OIDC_ISSUER
              value: https://auth.hallucinai.de/realms/hallucinai
            - name: SKAT_OIDC_CLIENT_SECRET_FILE
              value: /run/secrets/skat/oidc_client_secret
            - name: SKAT_PUBLIC_ORIGIN
              value: https://skat.hallucinai.de
            # hopin's origin, the one page that may frame a table in a call; unset, no page may.
            - name: SKAT_CALL_ORIGIN
              value: https://hopin.hallucinai.de
            - name: SKAT_SESSION_SECRET_FILE
              value: /run/secrets/skat/session_secret
            - name: SKAT_DATABASE_URL
              value: postgresql://skat@postgres:5432/skat
            - name: SKAT_DATABASE_PASSWORD_FILE
              value: /run/secrets/postgres/password
            - name: SKAT_OPERATOR_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: skat
                  key: operator_account_id
            # The pod network, where Traefik's pods change address on every restart; the NetworkPolicy below admits
            # only Traefik's, so no other pod can name a client address in X-Forwarded-For.
            - name: SKAT_TRUSTED_PROXIES
              value: 10.42.0.0/16
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets/skat
              readOnly: true
            - name: postgres-password
              mountPath: /run/secrets/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        # Every key of the Secret becomes a file, so a missing one stops skat's start naming its setting.
        - name: secrets
          secret:
            secretName: skat
        - name: postgres-password
          secret:
            secretName: postgres
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: skat
  namespace: skat
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skat
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Cloudflare terminates TLS, so the route is plain HTTP on Traefik's web port, and it names its host, so every other
# host keeps Traefik's 404.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skat
  namespace: skat
spec:
  ingressClassName: traefik
  rules:
    - host: skat.hallucinai.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: skat
                port:
                  number: 8080
---
# skat trusts the X-Forwarded-For of the pod network, so only Traefik's pods may reach it; the kubelet's probe comes
# from the node, which a NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: http-from-traefik-only
  namespace: skat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: skat
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: http
          protocol: TCP
