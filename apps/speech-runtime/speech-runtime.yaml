# speech-runtime, pulled from its private package through the Secret ghcr-pull from platform-secrets. It needs no Secret
# of its own: the caller table is plain configuration and the issuer's key set is public. The voices and the hearing
# model are baked into the image and only read, so it needs no egress apart from that key set. One pod runs on the CPU,
# as the service holds one synthesis and one decode at a time.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speech-runtime
  namespace: speech-runtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: speech-runtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: speech-runtime
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # The image's numeric USER is 1001, which the kubelet verifies as non-root.
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: speech-runtime
          image: ghcr.io/overnightworks/speech-runtime:2026.11.07.2@sha256:d4d65f1824eb6574fbd5095f0e096676292bc7d7505fb70c8ca750318f614941
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPEECH_CONFIG_FILE
              value: /etc/speech-runtime/speech.toml
            - name: SPEECH_HOST
              value: 0.0.0.0
            - name: SPEECH_DEVICE
              value: cpu
            - name: SPEECH_VOICE_CACHE
              value: /opt/voices
            - name: SPEECH_HUGGINGFACE_CACHE
              value: /opt/hearing
            - name: SPEECH_HEARING_MODEL
              value: small
          # /health answers 200 while the models still load, so ready decides: both the voices and the hearing.
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import json, urllib.request; health = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)); raise SystemExit(0 if health['speaking']['ready'] is True and health['hearing']['ready'] is True else 1)"
            initialDelaySeconds: 30
            periodSeconds: 5
            timeoutSeconds: 5
          # No liveness probe: a restart reloads both models, and a service that is not ready is not served.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: caller-table
              mountPath: /etc/speech-runtime
            # Starlette spools an upload above 1 MiB here, one at a time, up to 25 MiB.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: caller-table
          configMap:
            name: speech-runtime
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: speech-runtime
  namespace: speech-runtime
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: speech-runtime
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Only the apps that speak or hear through it reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: speech-runtime
  namespace: speech-runtime
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: speech-runtime
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [hopin, presentator]
      ports:
        - protocol: TCP
          port: 8080
---
# Whom the service trusts; the issuer is the public name tokens carry, until the platform's own Keycloak moves it. The
# service reads the table once, at start, and a key the image no longer knows stops the start, so a change of this table
# and of the image's tag are one change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: speech-runtime
  namespace: speech-runtime
data:
  speech.toml: |
    [identity]
    issuer = "https://auth.hallucinai.de/realms/hallucinai"
    jwks_url = "https://auth.hallucinai.de/realms/hallucinai/protocol/openid-connect/certs"
    audience = "speech-service"
    workload_role = "speech-workload"
    group_claim = "groups"
    service_group = "/services/speech-service"

    [apps.hopin]
    workload_client = "hopin"

    [apps.presentator]
    workload_client = "presentator"
