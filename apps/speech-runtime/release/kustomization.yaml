# The release of speech's two images, which stand in one repository: the CPU image and its -gpu variant of the same
# version. Both containers name one repository, so the entries cannot share the real name; each container names its own
# placeholder and the entries are independent of their order. A bump changes both tags and digests together. The
# field spec makes the transform write the GPU ref into the annotation gpu-image of a Job's pod template too, which it
# leaves alone by default: the Jobs of the bridge layer and of speech-runtime read the ref from it, and a changed ref
# changes both Job templates, which Flux re-creates.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: speech-cpu
    newName: ghcr.io/overnightworks/speech
    newTag: 2026.11.28.1
    digest: sha256:0950baa8823e7139f6cc0a5e2dd780188e2e692b4a89e6f79debac22c3b4d445
  - name: speech-gpu
    newName: ghcr.io/overnightworks/speech
    newTag: 2026.11.28.1-gpu
    digest: sha256:91742ce47d74bf5b762668838dce70ab9f3a761cd57478abe77a24b860e02071
configurations:
  - gpu-image.yaml
