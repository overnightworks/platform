# presentator's web, pulled from its private package through the Secret ghcr-pull and started from the files of the
# Secret presentator, both from platform-secrets. It serves from the Postgres of this namespace, which its init container
# migrates to the image's head before the web starts; the first run may find Postgres not ready yet, and the init
# container's backoff heals that. Two pods roll without taking one away before its replacement is Ready: the web mounts
# no claim, its state lives in Postgres, Redis and the bucket, and the sticky cookie keeps a browser on one pod. It shares
# its process namespace so that a pull's git and ssh children have a reaper. It holds no token and no right in the API.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: presentator
  annotations:
    # SQLAlchemy's default QueuePool (5 + 10 overflow), which presentator's one engine sets nothing over.
    hallucinai.de/postgres-connections-per-pod: "15"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      shareProcessNamespace: true
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        # The image's runtime user.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/overnightworks/presentator
          args: [presentator, migrate]
          env:
            # The URL names no password: the file below is the password's one owner, the namespace's Postgres.
            - name: PRESENTATOR_DATABASE_URL
              value: postgresql://presentator@postgres:5432/presentator
            - name: PRESENTATOR_DATABASE_PASSWORD_FILE
              value: /run/postgres/password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: postgres-password
              mountPath: /run/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
      containers:
        - name: web
          image: ghcr.io/overnightworks/presentator
          ports:
            - name: http
              containerPort: 8000
          env:
            # The realm names under docs/app.md's scheme, which tests/keycloak/handed_realm_names_are_declared.sh holds to realm.yaml.
            - name: REALM_CLIENT_ID
              value: presentator
            - name: REALM_LOGIN_GROUP
              value: /apps/presentator
            - name: REALM_ADMIN_GROUP
              value: /apps/presentator/admin
            - name: REALM_MCP_GROUP
              value: /apps/presentator/mcp
            - name: REALM_MCP_SCOPE
              value: mcp-presentator
            - name: REALM_AGENT_GROUP
              value: /agents
            - name: REALM_MCP_CLIENT_ID
              value: agents
            - name: PRESENTATOR_PUBLIC_ORIGIN
              value: https://presentator.hallucinai.de
            - name: PRESENTATOR_TALK_ORIGIN
              value: https://presentator-talk.hallucinai.de
            - name: PRESENTATOR_OIDC_ISSUER
              value: https://auth.hallucinai.de/realms/hallucinai
            - name: PRESENTATOR_OIDC_CLIENT_ID
              value: presentator
            - name: PRESENTATOR_OIDC_CLIENT_SECRET_FILE
              value: /run/secrets/oidc_client_secret
            - name: PRESENTATOR_SECRET_KEY_FILE
              value: /run/secrets/presentator_secret_key
            # The pod network, where Traefik's pods change address on every restart.
            - name: PRESENTATOR_TRUSTED_PROXIES
              value: 10.42.0.0/16
            - name: PRESENTATOR_AGENT__GATEWAY__ORIGIN
              value: http://litellm-front.litellm.svc.cluster.local:4000
            - name: PRESENTATOR_AGENT__GATEWAY__KEY_FILE
              value: /run/secrets/litellm_key
            - name: PRESENTATOR_AGENT__API_GROUP
              value: /services/litellm
            - name: PRESENTATOR_SPEECH_SERVICE
              value: http://speech-runtime.speech-runtime.svc.cluster.local:8080
            - name: PRESENTATOR_SPEECH_SERVICE_SCOPE
              value: speech-service-audience
            - name: PRESENTATOR_BUILD_RUNNER
              value: worker
            # The Service of the build workers, one of whose pods takes each step; the web starts without them.
            - name: PRESENTATOR_BUILD_WORKER_ADDRESS
              value: build-worker:7100
            - name: PRESENTATOR_BUILD_WORKER_KEY_FILE
              value: /run/secrets/build-worker-key/key
            - name: PRESENTATOR_REDIS_URL
              value: redis://redis:6379/0
            # The platform's object store, whose Service s3 is the endpoint of every app: the SDK reads the endpoint, the
            # region and the key file from these names, and the adapter addresses the bucket by path. The bucket holds only
            # what the web can rebuild, so it has no backup.
            - name: AWS_ENDPOINT_URL_S3
              value: http://s3.objectstore.svc.cluster.local:3900
            - name: AWS_DEFAULT_REGION
              value: garage
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /run/secrets/object-store/credentials
            - name: PRESENTATOR_S3_BUCKET
              value: presentator
            # The web connects to Postgres itself, with no pooling proxy between.
            - name: PRESENTATOR_DATABASE_URL
              value: postgresql://presentator@postgres:5432/presentator
            - name: PRESENTATOR_DATABASE_PASSWORD_FILE
              value: /run/postgres/password
          # The Host check admits the public host only, so the kubelet's probe names it.
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: presentator.hallucinai.de
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: postgres-password
              mountPath: /run/postgres
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: mirrors
              mountPath: /data/mirrors
            - name: builds
              mountPath: /data/builds
      volumes:
        # Every key of the Secret presentator becomes a file: presentator_secret_key, oidc_client_secret and litellm_key.
        # The workers' key lies beside them as /run/secrets/build-worker-key/key, readable by uid 1001, and the object
        # store's key file as /run/secrets/object-store/credentials: a volume of its own there would nest a mount inside
        # this read-only one.
        - name: secrets
          projected:
            defaultMode: 0444
            sources:
              - secret:
                  name: presentator
              - secret:
                  name: build-worker-key
                  items:
                    - key: key
                      path: build-worker-key/key
              - secret:
                  name: object-store
                  items:
                    - key: credentials
                      path: object-store/credentials
        - name: postgres-password
          secret:
            secretName: postgres
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        # Both are per-pod caches that a restart refills: the bare mirrors of the stored deck sources, which no app
        # setting caps, so 2Gi is twice their size or more; and copies of the builds the object store holds, capped by
        # PRESENTATOR_BUILD_CACHE_BYTES (4 GiB by default), beside one build's workspace and its PDFs.
        - name: mirrors
          emptyDir:
            sizeLimit: 2Gi
        - name: builds
          emptyDir:
            sizeLimit: 6Gi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  # Traefik reads its sticky cookie from the Service an Ingress routes to; every such Service carries the same five
  # annotations, which tests/ingress/every_routed_service_carries_the_same_sticky_cookie.sh holds equal.
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: __Host-route
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: lax
  namespace: presentator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Cloudflare terminates TLS, so the route is plain HTTP on Traefik's web port, and it names its two hosts, so every other
# host keeps Traefik's 404. The talk host serves the built talks from the same process.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: presentator
spec:
  ingressClassName: traefik
  rules:
    - host: presentator.hallucinai.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000
    - host: presentator-talk.hallucinai.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8000
---
# presentator trusts the X-Forwarded-For of the pod network. Traefik's pods and Keycloak's labelled pods can reach the
# web's port, the second admitted for its back-channel logout (backchannel-from-keycloak below), which admits every path
# of that port; the kubelet's probe comes from the node, which a NetworkPolicy never blocks.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: http-from-traefik-only
  namespace: presentator
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
      ports:
        - port: http
          protocol: TCP
---
# Keycloak's back-channel logout reaches the web's port through the Service, never through Traefik, whose router refuses
# the path on every host. The route answers it under any Host but the talk host's and judges the signed Logout Token
# alone, so only Keycloak's labelled pods may send it; it adds to http-from-traefik-only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backchannel-from-keycloak
  namespace: presentator
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keycloak
          podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: http
          protocol: TCP
