# presentator's build worker: the sealed process that runs every step of a deck's build, which is code, for the web
# over the socket in the claim build-socket. A deck's code reaches nothing, so the pod holds lo alone: the init
# container remove-link deletes eth0 before the worker starts, the one program of tests/no_network/remove_link.sh, and
# the pod holds no token. The worker starts as root, with the web's group, and drops to its build uids per child, so
# its capabilities are exactly SETUID, SETGID and KILL. Its Namespace enforces no Pod Security level, as the init's
# NET_ADMIN is outside baseline; tests/presentator/pods_stay_within_their_levels.sh holds the exception to this pod.
# Every exit of the worker ends its pod: the container's restartPolicy is Never, so the kubelet makes the pod terminal
# and the StatefulSet deletes it and creates it again, a fresh pod with the init run again, whatever the exit status.
# A removed sandbox ended the worker's container as ContainerStatusUnknown, and the StatefulSet replaced the pod; a re-run
# in the same pod was not observed and is not excluded, and if it happens presentator's scratch check refuses it.
# The claim build-socket is local-path, so the web and this pod run on its node.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: build-worker
  namespace: presentator
spec:
  replicas: 1
  serviceName: build-worker
  selector:
    matchLabels:
      app.kubernetes.io/name: build-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: build-worker
    spec:
      serviceAccountName: build-worker
      automountServiceAccountToken: false
      # KUBERNETES_* arrive anyway; service links would add one variable per Service.
      enableServiceLinks: false
      # The worker runs no step that waits for a stop; SIGKILL ends it and the kernel ends the sandbox.
      terminationGracePeriodSeconds: 1
      imagePullSecrets:
        - name: ghcr-pull
      initContainers:
        - name: remove-link
          image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command:
            - sh
            - -c
            - |-
              # shellcheck shell=sh
              # The program of the init container remove-link, run by busybox sh: with lo alone it is done; with eth0 besides it
              # deletes eth0, reads again and admits lo alone. A failed read, any other link and a failed delete name themselves and
              # end 1, whatever status ip ended with. busybox sh ignores set -e inside a command substitution, so each read of the
              # links is a plain assignment at the top level with its own failure branch, and the function only parses.
              set -eu
              link_names() { printf '%s\n' "$1" | sed -n 's/^[0-9]*: \([^:@ ]*\).*/\1/p' | sort; }
              links="$(ip -o link)" || { echo "remove-link: the read of the links failed" >&2; exit 1; }
              names="$(link_names "$links")"
              [ "$names" = lo ] && exit 0
              [ "$names" = "$(printf 'eth0\nlo')" ] || { echo "remove-link: unexpected links: $(echo $names)" >&2; exit 1; }
              ip link delete eth0 || { echo "remove-link: the delete of eth0 failed" >&2; exit 1; }
              links="$(ip -o link)" || { echo "remove-link: the second read of the links failed" >&2; exit 1; }
              names="$(link_names "$links")"
              [ "$names" = lo ] || { echo "remove-link: links left after the delete: $(echo $names)" >&2; exit 1; }
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
              add: [NET_ADMIN]
      containers:
        - name: worker
          image: ghcr.io/overnightworks/presentator
          # The image's entrypoint is a shell that exports its own variables, which the worker's self-check refuses.
          command: [presentator-worker]
          restartPolicy: Never
          env:
            - name: PRESENTATOR_WORKER_SEAL
              value: kubernetes
            - name: PRESENTATOR_BUILD_TIMEOUT_SECONDS
              value: '300'
            - name: PRESENTATOR_BUILD_OUTPUT_MEGABYTES
              value: '300'
          resources:
            limits:
              memory: 4Gi
          securityContext:
            runAsUser: 0
            # The web's gid: the worker's socket directory belongs to its own group, and at gid 0 the web gets EACCES.
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: [ALL]
              add: [SETUID, SETGID, KILL]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
            - name: shm
              mountPath: /dev/shm
            - name: build-socket
              mountPath: /run/presentator-build
      volumes:
        - name: work
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: build-socket
          persistentVolumeClaim:
            claimName: build-socket
