# The release of presentator's image, the full app ref of a release that changes only in a pull request: its one owner,
# included by the layer and by its pull layer, so that the web, the worker, the restore test and the pull layer's image
# volume run one ref. A bump changes tag and digest together. The field spec makes the transform rewrite the reference of
# a Job's image volume too, which it leaves alone by default.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
images:
  - name: ghcr.io/overnightworks/presentator
    newTag: 2026.11.12.5
    digest: sha256:bcfb8fa332a962a542eb3cb96b800efb49c6c53143cb18833c53bfd861ced6f7
configurations:
  - image-volume.yaml
