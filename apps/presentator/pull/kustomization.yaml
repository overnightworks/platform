# presentator's pull layer: the Job pull of the base, with the image of the release as an image volume that its container
# mounts. volumes/ adds the volume by the image's name alone, and release/, listed after it, gives that name the one ref
# the web, the worker and the restore test run; a patch of this file would be applied after the Component and leave the
# volume without a version.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: presentator
resources:
  - ../../../infrastructure/pull
components:
  - volumes
  - ../release
