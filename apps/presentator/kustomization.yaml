apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: presentator
resources:
  - rbac.yaml
  - web.yaml
  - worker.yaml
  - ../../infrastructure/postgres
  - ../../infrastructure/redis
components:
  - ../../infrastructure/postgres/backup
  - release
configMapGenerator:
  # The one rule file of the workers' packet filter; its hash suffix rolls the pods when a rule changes.
  - name: build-worker-rules
    files:
      - worker.nft
  - name: postgres
    behavior: merge
    literals:
      # alembic_version, which presentator migrate writes, comes first: the restore test fails on an empty first table.
      - key-tables=alembic_version users sources decks
      - backup-repository=http://rest-server.backup.svc.cluster.local:8000/presentator/
patches:
  # Only the web holds store credentials; the build workers, the backups and the restore tests reach no Redis.
  - target:
      kind: NetworkPolicy
      name: redis
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - podSelector:
              matchLabels:
                app.kubernetes.io/name: web
replacements:
  - source:
      kind: ConfigMap
      name: postgres
      fieldPath: data.backup-repository
    targets:
      - select:
          kind: Schedule
          name: postgres
        fieldPaths:
          - spec.backend.rest.url
