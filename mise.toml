min_version = "2026.11.3"

[tool_config]
locked = true

[tools]
age = "1"
flux2 = "2"
gh = "2"
helm = "4.3"
k3d = "5"
kubectl = "1.37"
sops = "3"
opentofu = "1.13"
yq = "4"
docuum = "0"
"aqua:umlx5h/gtrash" = "0"
"aqua:astral-sh/uv" = "0"

[env]
# The one k3s pin: the k3d image in CI and the installer on the PC.
K3S_VERSION = "v1.37.2+k3s1"
# The one Flux component set: flux:export writes it and the images job names Flux's own images from it. No Helm
# reconciler is in it, since every chart is rendered into Git.
FLUX_COMPONENTS = "source-controller,kustomize-controller,notification-controller"
# The sha256 of k3s's install.sh at that tag, the file bootstrap:k3s downloads; a bump changes both.
K3S_INSTALLER_SHA256 = "ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b"
# The one source of GitHub's host keys, which secrets:github-host-keys checks the deploy key's known_hosts against.
GITHUB_META_URL = "https://api.github.com/meta"

# mise creates no missing parent of a file, and k3s's own directory exists only once k3s has run.
[bootstrap.directories."/etc/rancher/k3s"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/rancher/k3s/config.yaml"]
source = "host/k3s/config.yaml"
owner = "root"
group = "root"
mode = "0644"

# The 30-day bound on the kubelet's pod logs: the tmpfiles line, its daily clean and the check run after each clean.
[bootstrap.files."/etc/tmpfiles.d/pod-logs.conf"]
source = "host/pod-logs/pod-logs.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/local/sbin/check-pod-logs"]
source = "host/pod-logs/scripts/check_pod_logs.sh"
owner = "root"
group = "root"
mode = "0755"

# mise starts a unit it has not seen before only when the run that writes its file notifies it, and a notification
# runs systemd's daemon-reload first, so a changed service file reaches systemd too.
[bootstrap.files."/etc/systemd/system/pod-logs-clean.timer"]
source = "host/pod-logs/pod-logs-clean.timer"
owner = "root"
group = "root"
mode = "0644"
notify = ["pod-logs-clean.timer"]

[bootstrap.files."/etc/systemd/system/pod-logs-clean.service"]
source = "host/pod-logs/pod-logs-clean.service"
owner = "root"
group = "root"
mode = "0644"
notify = ["pod-logs-clean.timer"]

[bootstrap.services."pod-logs-clean.timer"]
state = "running"
enabled = true

# The inotify limits k3s and hal share. systemd-sysctl reads every sysctl.d file in name order, a later one winning, so
# 90- lands after localsearch's 30- value for the watches. systemd-sysctl.service is a static
# oneshot unit that reads /etc/sysctl.d at start, so a restart after a change applies the values without a reboot;
# `enabled = false` because mise cannot enable a static unit and reports it unknown, and the unit runs at every boot
# anyway. Undoing the file leaves the kernel's current values until the next reboot.
[bootstrap.files."/etc/sysctl.d/90-inotify.conf"]
source = "host/sysctl/inotify.conf"
owner = "root"
group = "root"
mode = "0644"
notify = ["systemd-sysctl"]

[bootstrap.services.systemd-sysctl]
state = "running"
enabled = false
on_change = "restart"

# The host journal keeps no entry older than 29 days: the drop-in sets the retention and the file span. mise creates no
# missing parent, and the directory exists only once something has put a drop-in there. systemd-journald.service is a
# static unit that reads its drop-ins at start, so a restart after a change applies them; `enabled = false` because
# mise cannot enable a static unit and reports it unknown, and journald runs at every boot anyway.
[bootstrap.directories."/etc/systemd/journald.conf.d"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/systemd/journald.conf.d/90-retention.conf"]
source = "host/journald/90-retention.conf"
owner = "root"
group = "root"
mode = "0644"
notify = ["systemd-journald"]

[bootstrap.services.systemd-journald]
state = "running"
enabled = false
on_change = "restart"

# The disk's bounds run in the operator's own user manager, with no sudo: Docuum keeps Docker's images within 100 GB, a
# weekly clean empties uv's cache, a daily tmpfiles clean deletes Codex sessions after 30 days and a daily gtrash
# prune deletes Trash entries whose .trashinfo date is older than 30 days. mise writes each unit
# to ~/.config/systemd/user as dev.mise.<name>.
[dotfiles."~/.config/user-tmpfiles.d/disk.conf"]
source = "host/disk/user-tmpfiles.conf"
mode = "copy"

# Docuum measures the Images line of `docker system df`, which counts a shared layer once, so the threshold is 100 GB
# of real space. --keep matches `repository:tag`: tags `previous` and the `-base` images, every ghcr.io and quay.io
# image, Microsoft's registry, Traefik, and every other vendor repository the machine holds; the images of our own builds
# stay deletable. `$$` is systemd's `$`, and no backslash is used, which systemd would read as an escape.
[bootstrap.linux.systemd.units.docuum]
description = "Delete Docker images least recently used first above 100 GB"
exec_start = "~/.local/share/mise/installs/docuum/0/docuum --threshold '100 GB' --min-age 1d --keep=':previous$$' --keep='-base:' --keep='^ghcr[.]io/' --keep='^quay[.]io/' --keep='^traefik' --keep='^(adorsys|curlimages|grafana|lycheeverse|maximhq|moby|nginxinc|prom|rancher|restic|rhysd|smallstep|wollomatic)/' --keep='^mcr[.]microsoft[.]com/' --keep='^(alpine|busybox|hello-world|mongo|node|postgres|python|redis|registry|ubuntu):'"
restart = "on-failure"
restart_sec = "1min"

[bootstrap.linux.systemd.units.uv-cache-clean]
description = "Empty uv's cache"
type = "oneshot"
exec_start = "~/.local/bin/uv cache clean"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.uv-cache-clean-weekly]
description = "Empty uv's cache weekly"
on_calendar = "weekly"
persistent = true
unit = "uv-cache-clean"

[bootstrap.linux.systemd.units.user-tmpfiles-clean]
description = "Delete the user's old files the tmpfiles line names"
type = "oneshot"
exec_start = "/usr/bin/systemd-tmpfiles --user --clean %h/.config/user-tmpfiles.d/disk.conf"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.user-tmpfiles-clean-daily]
description = "Delete the user's old files the tmpfiles line names daily"
on_calendar = "daily"
persistent = true
unit = "user-tmpfiles-clean"

# gtrash reads each item's deletion date from its .trashinfo and leaves an entry without one. It stops with an error on
# a Trash directory that does not exist, so the unit creates the home Trash first; an empty one is a clean no-op. --force
# only skips the prompt a terminal would show.
[bootstrap.linux.systemd.units.trash-prune]
description = "Delete the home Trash's entries deleted more than 30 days ago"
type = "oneshot"
exec_start_pre = ["/bin/mkdir -p %h/.local/share/Trash"]
exec_start = "~/.local/share/mise/installs/aqua-umlx5h-gtrash/0/gtrash prune --day 30 --force --trash-dir %h/.local/share/Trash"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.trash-prune-daily]
description = "Delete the home Trash's old entries daily"
on_calendar = "daily"
persistent = true
unit = "trash-prune"

# The PC's ufw keeps its defaults and the operator's own rules (no exclusive, whose ufw reset would delete them).
# The pods reach the API server and the kubelet on the host through cni0, which only pods sit on, so one rule on the
# interface alone admits them. mise's ufw check reads the "/16" of a source CIDR as a protocol, so a rule with a
# source never matches and every plan would name it unknown.
# k3s-pods and k3s-services are declared absent because mise's apply keeps every rule its state file holds, and the
# PC's holds those two.
[bootstrap.linux.firewall]
backend = "ufw"
default_incoming = "deny"
default_outgoing = "allow"

[[bootstrap.linux.firewall.rules]]
name = "k3s-cni"
interface = "cni0"

[[bootstrap.linux.firewall.rules]]
name = "k3s-pods"
state = "absent"

[[bootstrap.linux.firewall.rules]]
name = "k3s-services"
state = "absent"

[tasks."flux:export"]
description = "Regenerate the committed Flux components from the locked flux2"
# flux install writes the subjects of its ClusterRoleBindings for every controller, so the ServiceAccount of the
# omitted helm-controller stays a subject of cluster-admin; no such account exists, so anyone able to create one in
# flux-system would gain it.
run = '''
#!/usr/bin/env bash
set -euo pipefail
flux install --export --components="$FLUX_COMPONENTS" |
  sed '/^- kind: ServiceAccount$/{N;N;/\n  name: helm-controller\n  namespace: flux-system$/d}' \
    > clusters/pc/flux-system/gotk-components.yaml
'''

[tasks."charts:render"]
description = "Render each pinned chart with its values into infrastructure/<component>/rendered.yaml, and fetch k8up's CRDs"
run = '''
#!/usr/bin/env bash
set -euo pipefail
fail() { echo "charts:render: $1" >&2; exit 1; }
staging_dir="$(mktemp -d)"
trap 'rm -rf "$staging_dir"' EXIT

# render <component> <chart> <namespace> <header source> [<helm argument>...]: the release is the component. The
# committed file is replaced only by a complete render without hooks, and stays as it is on any failure.
render() {
  local component="$1" chart="$2" namespace="$3" source="$4"
  shift 4
  local values="infrastructure/$component/values.yaml" output="infrastructure/$component/rendered.yaml"
  local staged="$staging_dir/$component.yaml" hooks
  {
    echo "# Generated by mise run charts:render from $source with $values; do not edit."
    helm template "$component" "$chart" --namespace "$namespace" --values "$values" \
      --kube-version "$K3S_VERSION" --skip-tests "$@"
  } >"$staged" || fail "helm could not render $source; $output is unchanged"
  # Flux would apply a hook as a plain object on every reconcile, without its timing or its delete policy.
  hooks="$(yq --no-doc 'select(.metadata.annotations["helm.sh/hook"]) | .kind + "/" + .metadata.name' "$staged")"
  [ -z "$hooks" ] || fail "the render of $source holds helm hooks: ${hooks//$'\n'/ }; $output is unchanged"
  chmod 0644 "$staged"
  mv "$staged" "$output"
}

# fetch <url> <sha256> <file>: the file only once its content matches the pin.
fetch() {
  curl --fail --silent --show-error --location --output "$3" "$1" || fail "could not download $1"
  echo "$2  $3" | sha256sum --check --status || fail "$1 does not match its pinned sha256"
}

traefik_chart=oci://ghcr.io/traefik/helm/traefik:42.3.1@sha256:a702a4316735397ecd1c3ed5287cccf87cdbc69abb0451c0b2d371408473bc33
render traefik "$traefik_chart" traefik "$traefik_chart"
prometheus_chart=oci://ghcr.io/prometheus-community/charts/prometheus:29.45.1@sha256:ace364ad75a797a8eedbb4d515446ce0a01df4f794060c8114c95d962b085310
render prometheus "$prometheus_chart" prometheus "$prometheus_chart"
loki_chart=oci://ghcr.io/grafana/helm-charts/loki:7.5.0@sha256:6006cfff9edd0d5c70449cb89510c1c3c2142c11caacf66d6aac83fc0517f07d
render loki "$loki_chart" loki "$loki_chart"
grafana_chart=oci://ghcr.io/grafana-community/helm-charts/grafana:14.4.0@sha256:2d5174fe147de178bb47e8b696b16ac3a614c83e31afb8c74e28684e04118002
render grafana "$grafana_chart" grafana "$grafana_chart"

k8up_release=https://github.com/k8up-io/k8up/releases/download
k8up_chart="$k8up_release/k8up-4.10.1/k8up-4.10.1.tgz"
k8up_crds="$k8up_release/v2.16.1/k8up-crd.yaml"
fetch "$k8up_chart" 6d8a2e69ea3b75e25de80b4d173b2858e337586edf603c485567c5bf1ec8697a "$staging_dir/k8up-chart.tgz"
fetch "$k8up_crds" dbaf1832f46d5bf87c6a442b82661a726def2a03782469369955d284042b71c1 "$staging_dir/k8up-crd.yaml"
# The chart's one hook is a cleanup Job for its Helm upgrades, which deletes the old operator's namespace roles; a
# Flux-applied render has no upgrade to clean up after.
render k8up "$staging_dir/k8up-chart.tgz" k8up-system "$k8up_chart" --no-hooks
{
  echo "# Generated by mise run charts:render from $k8up_crds; do not edit."
  cat "$staging_dir/k8up-crd.yaml"
} >"$staging_dir/k8up-crds.yaml"
chmod 0644 "$staging_dir/k8up-crds.yaml"
mv "$staging_dir/k8up-crds.yaml" infrastructure/k8up/crds.yaml
'''

[tasks."secrets:age-secret"]
description = "Create the Secret sops-age in flux-system, the age key Flux decrypts platform-secrets with, from a key file"
usage = 'arg "<key_file>" help="The age key file; the task has no default and reads no other key"'
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
kubectl --namespace flux-system create secret generic sops-age --from-file=age.agekey="${usage_key_file?}" >/dev/null
'''

# The one owner of the age key's path: the file sops reads besides its other key sources.
[tasks."secrets:key-file"]
description = "Print the age key file: SOPS_AGE_KEY_FILE if set and non-empty, else the user config's sops/age/keys.txt"
hide = true
quiet = true
run = 'echo "${SOPS_AGE_KEY_FILE:-${XDG_CONFIG_HOME:-$HOME/.config}/sops/age/keys.txt}"'

[tasks."secrets:new-key"]
description = "Create the age key once in the file secrets:key-file prints and print only its recipient"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
fail() { echo "secrets:new-key: $1, nothing changed; $2" >&2; exit 1; }
key_file="$(mise run secrets:key-file)"
key_dir="$(dirname "$key_file")"

# During a drill the key every value is encrypted to sits beside its file, and a new key would replace it.
if [ -e "$key_file.drill" ] || [ -L "$key_file.drill" ]; then
  fail "$key_file.drill exists" "move it back to $key_file to end the drill"
fi
if [ -e "$key_file" ] || [ -L "$key_file" ]; then
  fail "$key_file exists and is kept unread" "run mise run bootstrap:secrets to use it"
fi
existing_ancestor="$key_dir"
until [ -e "$existing_ancestor" ] || [ -L "$existing_ancestor" ]; do
  existing_ancestor="$(dirname "$existing_ancestor")"
done
[ -d "$existing_ancestor" ] || fail "$existing_ancestor is no directory, so the key directory $key_dir cannot exist" \
  "move it or set SOPS_AGE_KEY_FILE"
if [ -d "$key_dir" ]; then
  # The directory the file lands in guards it, so a symlinked key directory is judged by its target.
  key_dir_mode="$(stat --dereference --format=%a "$key_dir")"
  [ "$key_dir_mode" = 700 ] || fail "$key_dir has mode $key_dir_mode, not 700" "chmod it to 700 to go on"
fi

umask 077
mkdir -p "$key_dir"
# age-keygen creates the file exclusively and names only the recipient, as "Public key: age1...".
keygen_output="$(age-keygen -o "$key_file" 2>&1)" || { printf '%s\n' "$keygen_output" >&2; exit 1; }
echo "secrets:new-key: $key_file created for the recipient ${keygen_output#Public key: }"
'''

# A filter: on stdin one Secret manifest, which holds a private key, so it reaches the readers only through pipes.
[tasks."secrets:github-host-keys"]
description = "Pass a Secret manifest on unchanged only when every known_hosts line is a key GitHub's meta API lists"
hide = true
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
meta_url="${GITHUB_META_URL?}"
fail() { echo "secrets:github-host-keys: $1; nothing passed on" >&2; exit 1; }

IFS= read -r -d '' manifest || true
[ "$(printf '%s' "$manifest" | yq '.kind')" = Secret ] || fail "stdin holds not exactly one Secret"
known_hosts="$(printf '%s' "$manifest" | yq '.stringData.known_hosts // (.data.known_hosts // "" | @base64d)')" ||
  fail "the Secret's known_hosts cannot be read"
[ -n "$known_hosts" ] || fail "the Secret's known_hosts is empty"
github_keys="$(scripts/github_meta.sh | yq -p json '.ssh_keys[]')" ||
  fail "the ssh_keys of $meta_url cannot be read"
[ -n "$github_keys" ] || fail "$meta_url lists no ssh_keys"

line_number=0
while IFS= read -r line; do
  line_number=$((line_number + 1))
  [[ $line =~ ^github\.com\ ([^ ]+\ [^ ]+)$ ]] ||
    fail "known_hosts line $line_number is not exactly 'github.com <type> <blob>'"
  printf '%s\n' "$github_keys" | grep --quiet --line-regexp --fixed-strings -- "${BASH_REMATCH[1]}" ||
    fail "the key on known_hosts line $line_number is none of the ssh_keys $meta_url lists"
done < <(printf '%s\n' "$known_hosts")

printf '%s' "$manifest"
'''

[tasks."check:pod-logs"]
description = "Check that no pod log on the PC is past its 30-day bound and that the daily clean ran and succeeded"
# The installed check, the one the clean runs; /var/log/pods is root's alone.
run = "sudo /usr/local/sbin/check-pod-logs"

[tasks."check:secrets-expiry"]
description = "Check that no Secret on the PC carries an expires-on annotation within 30 days or past"
env = { KUBECONFIG = "/etc/rancher/k3s/k3s.yaml" }
run = "scripts/check_secrets_expiry.sh"

[tasks.disk]
description = "Show what fills the disk of the home directory and warn from 85 % use"
# Only root reads /var/lib/docker, so what lies outside $HOME is df's used space less $HOME, and Docker's own count is
# printed beside it when the daemon answers in time. The named directories go through one du, which counts a hard link
# once across them. A directory du could not read marks its row incomplete, and a remainder that depends on it is
# printed as unknown, never as a number. Only sizes and names are printed.
run = '''
#!/usr/bin/env bash
set -euo pipefail
warn_percent=85
docker_timeout="${DISK_DOCKER_TIMEOUT:-120}"
read -r used total percent < <(df -B1 --output=used,size,pcent "$HOME" | awk 'NR == 2 { sub("%", "", $3); print $1, $2, $3 }')
if [ "$percent" -ge "$warn_percent" ]; then
  echo "WARNING: the disk of ~ is $percent % full, from $warn_percent % it needs room" >&2
fi
errors_dir="$(mktemp -d)"
trap 'rm -rf "$errors_dir"' EXIT
paths=()
for path in "$HOME/.claude" "$HOME/.codex/sessions" "$HOME/.cache/uv" "$HOME/.local/share/Trash" \
  "$HOME/.local/share/mise" "$HOME/git"; do
  [ -e "$path" ] && paths+=("$path")
done
# A failed du keeps the totals it printed; its diagnostics say which directory is missing from them.
named_failed=0 home_failed=0
named_output=""
[ -z "${paths[*]-}" ] || named_output="$(du -sxB1 -- "${paths[@]}" 2>"$errors_dir/named")" || named_failed=1
home_output="$(du -sxB1 -- "$HOME" 2>"$errors_dir/home")" || home_failed=1
home_size="$(cut -f1 <<<"$home_output")"
rows="" unknown="" named=0 rest_known=1
[ "$home_failed" = 0 ] || rest_known=0
while IFS=$'\t' read -r size path; do
  [ -n "$path" ] || continue
  named=$((named + size))
  note=""
  if [ "$named_failed" = 1 ] && { [ ! -s "$errors_dir/named" ] || grep -qF -e "'$path/" -e "'$path'" "$errors_dir/named"; }; then
    note=" (incomplete, a directory was unreadable)"
    rest_known=0
  fi
  rows+="$size ${path/#"$HOME"/\~}$note"$'\n'
done <<<"$named_output"
echo "disk of ~: $(numfmt --to=iec "$used") of $(numfmt --to=iec "$total") used, $percent %"
if [ "$rest_known" = 1 ]; then
  rows+="$((home_size > named ? home_size - named : 0)) the rest of ~"$'\n'
else
  unknown+="the rest of ~ (unknown, a directory was unreadable)"$'\n'
fi
if [ "$home_failed" = 0 ]; then
  rows+="$((used > home_size ? used - home_size : 0)) outside ~ (Docker, system)"$'\n'
else
  unknown+="outside ~ (Docker, system) (unknown, a directory was unreadable)"$'\n'
fi
sort -rn <<<"$rows" | awk 'NF { size = $1; $1 = ""; print size, substr($0, 2) }' | numfmt --field=1 --to=iec --padding=7
sed 's/^/      ? /; /^      ? $/d' <<<"$unknown"
if command -v docker >/dev/null; then
  docker_status=0
  docker_sizes="$(timeout --kill-after=5 "$docker_timeout" docker system df 2>/dev/null)" || docker_status=$?
  if [ "$docker_status" = 0 ]; then
    echo "Docker's own count:"
    sed 's/^/  /' <<<"$docker_sizes"
  elif [ "$docker_status" = 124 ] || [ "$docker_status" = 137 ]; then
    echo "Docker did not answer within $docker_timeout s, so its own count is missing"
  fi
fi
'''

[tasks."github:test"]
description = "Check the GitHub settings root: format, init against the committed lock, validate and the mocked tests"
dir = "src/opentofu/github"
run = '''
#!/usr/bin/env bash
set -euo pipefail
TF_DATA_DIR="$(mktemp -d)"
export TF_DATA_DIR
trap 'rm -rf "$TF_DATA_DIR"' EXIT
tofu fmt -check -recursive
tofu init -backend=false -lockfile=readonly -input=false
tofu validate
tofu test
../../../tests/opentofu/plan_with_a_delete_is_refused.sh
'''

[tasks."cloudflare:test"]
description = "Check the Cloudflare root: format, init against the committed lock, validate, the mocked tests and the token's shell tests"
dir = "src/opentofu/cloudflare"
run = '''
#!/usr/bin/env bash
set -euo pipefail
TF_DATA_DIR="$(mktemp -d)"
export TF_DATA_DIR
trap 'rm -rf "$TF_DATA_DIR"' EXIT
tofu fmt -check -recursive
tofu init -backend=false -lockfile=readonly -input=false
tofu validate
tofu test
../../../tests/cloudflare/token_stays_out_of_argv_environment_and_trace.sh
../../../tests/cloudflare/token_is_kept_private_and_counted_in_plan_data_and_state.sh
'''

# The one owner of where scripts/apply_opentofu.sh keeps a root's state, cache, kept plan and data directory: the command
# and the count check name them through it.
[tasks."opentofu:path"]
description = "Print where a root keeps one of its files: opentofu:path <github|cloudflare> <state|cache|plan|data>"
hide = true
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
[ "$#" = 2 ] || { echo "opentofu:path: usage: mise run opentofu:path <root> <state|cache|plan|data>" >&2; exit 2; }
cache_directory="${XDG_CACHE_HOME:-$HOME/.cache}/platform/opentofu/$1"
case "$2" in
  state) echo "${XDG_STATE_HOME:-$HOME/.local/state}/platform/opentofu/$1.tfstate" ;;
  cache) echo "$cache_directory" ;;
  plan) echo "$cache_directory/last.tfplan" ;;
  data) echo "$cache_directory/data" ;;
  *) echo "opentofu:path: no file named $2" >&2; exit 2 ;;
esac
'''

# The one owner of the Cloudflare token's path: the command, the writer and the count check name the file through it.
[tasks."cloudflare:token-file"]
description = "Print the file that holds the read-only Cloudflare API token"
hide = true
quiet = true
run = 'echo "${XDG_CONFIG_HOME:-$HOME/.config}/platform/cloudflare/token"'

[tasks."cloudflare:token"]
description = "Read the Cloudflare API token from stdin without echo and keep it at 0600 in the file cloudflare:token-file prints; print only that path"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
# An inherited xtrace would print the value in the assignments below.
set +x
fail() { echo "cloudflare:token: $1; nothing changed" >&2; exit 1; }
token_file="$(mise run cloudflare:token-file)"
token_directory="$(dirname "$token_file")"

if [ -t 0 ]; then printf 'Cloudflare API token (not shown): ' >&2; fi
IFS= read -r -s token || true
if [ -t 0 ]; then echo >&2; fi
# The provider trims the file's value, so the file holds exactly the trimmed one, and the count check's patterns are lines.
token="${token#"${token%%[![:space:]]*}"}"
token="${token%"${token##*[![:space:]]}"}"
[ -n "$token" ] || fail "no value was read from stdin"

umask 077
mkdir -p "$token_directory"
chmod 700 "$token_directory"
staging="$(mktemp "$token_directory/token.XXXXXX")"
trap 'rm -f "$staging"' EXIT
# printf is a builtin, so the value is in no process's argument list.
printf '%s\n' "$token" >"$staging"
mv -f "$staging" "$token_file"
echo "$token_file"
'''

[tasks."cloudflare:token-absent"]
description = "Count the lines that hold the token file's value in the kept plan, the data directory and the state of the Cloudflare root; print only the count and fail unless it is 0"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
fail() { echo "cloudflare:token-absent: $1" >&2; exit 1; }
token_file="$(mise run cloudflare:token-file)"
# An empty pattern file matches nothing, which would pass every check.
[ -s "$token_file" ] || fail "the token file $token_file is missing or empty; nothing counted"
state_file="$(mise run opentofu:path cloudflare state)"
kept_plan="$(mise run opentofu:path cloudflare plan)"
data_directory="$(mise run opentofu:path cloudflare data)"

total=0
# count_lines <grep argument>...: adds the lines of those inputs that hold a line of the token file; -a reads a binary
# as text, -c prints one count per file and -h no file names.
count_lines() {
  local counts count status=0
  counts="$(grep --count --text --no-filename --fixed-strings --file="$token_file" "$@")" || status=$?
  [ "$status" -le 1 ] || fail "grep failed with status $status"
  while IFS= read -r count; do total=$((total + count)); done <<<"$counts"
}
# A file the plan should have left is no proof of absence when it is missing; only the state may not exist yet.
rerun="run scripts/apply_opentofu.sh cloudflare first"
[ -e "$kept_plan" ] || fail "the kept plan $kept_plan is missing; nothing counted; $rerun"
[ -d "$data_directory" ] || fail "the data directory $data_directory is missing; nothing counted; $rerun"
# The members are deflated, so the archive is read decompressed.
unzip -tq "$kept_plan" >/dev/null || fail "$kept_plan is no intact zip archive"
count_lines - < <(unzip -p "$kept_plan")
count_lines --recursive "$data_directory"
if [ -e "$state_file" ]; then count_lines "$state_file"; fi
echo "$total"
[ "$total" -eq 0 ]
'''

[tasks."legal:test"]
