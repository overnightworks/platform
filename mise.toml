# The one owner of the loopback forward to a Service's page, which a page the operator opens only at the PC shares.
[tasks."page:forward"]
description = "Forward a Service to this PC's loopback at a free port and print the address once kubectl listens"
hide = true
usage = '''
arg "<namespace>" help="The Service's namespace, also the name of the Service"
arg "<caller>" help="The task name that prefixes the printed line"
'''
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"
namespace="${usage_namespace?}" caller="${usage_caller?}"
port="$(kubectl --namespace "$namespace" get service "$namespace" -o jsonpath='{.spec.ports[0].port}')"
# kubectl runs in the foreground, so Ctrl-C reaches it and ends it; the reader on its stdout prints the address once
# kubectl says it listens, and a forward that fails prints none.
announce() {
  local line local_port
  while IFS= read -r line; do
    local_port="$(sed -n 's/^Forwarding from 127\.0\.0\.1:\([0-9]*\) ->.*/\1/p' <<<"$line")"
    if [ -n "$local_port" ]; then
      echo "$caller: open http://127.0.0.1:$local_port/; Ctrl-C ends the forward"
    fi
  done
}
kubectl --namespace "$namespace" port-forward --address 127.0.0.1 "service/$namespace" ":$port" > >(announce)
'''

