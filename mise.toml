[tasks.bootstrap]
description = "The PC's own steps after the declarative parts: k3s, then Flux, then its access to platform-secrets"
run = [{ task = "bootstrap:k3s" }, { task = "bootstrap:flux" }, { task = "bootstrap:secrets" }]

[tasks."bootstrap:k3s"]
description = "Install k3s at K3S_VERSION from its pinned installer, restart it for a newer config, wait for the node"
env = { KUBECONFIG = "/etc/rancher/k3s/k3s.yaml" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
config=/etc/rancher/k3s/config.yaml
committed_config=host/k3s/config.yaml
installer_url="https://raw.githubusercontent.com/k3s-io/k3s/${K3S_VERSION}/install.sh"
fail() { echo "bootstrap:k3s: $1" >&2; exit 1; }

# Without this file k3s's first start takes its defaults: Secrets unencrypted, the hostname as node name, and the
# bundled Traefik on servicelb's host ports.
cmp --silent "$committed_config" "$config" ||
  fail "$config is missing or differs from $committed_config; run scripts/bootstrap_pc.sh --only files,firewall first"

installed_version=""
if [ -x /usr/local/bin/k3s ]; then
  installed_version="$(/usr/local/bin/k3s --version | awk 'NR == 1 { print $3 }')"
fi

if [ "$installed_version" != "$K3S_VERSION" ]; then
  staging="$(mktemp)"
  trap 'rm -f "$staging"' EXIT
  curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$staging" "$installer_url"
  echo "${K3S_INSTALLER_SHA256}  ${staging}" | sha256sum --check --status ||
    fail "$installer_url does not match the pinned sha256 $K3S_INSTALLER_SHA256; the installer did not run"
  echo "bootstrap:k3s: $installer_url matches the pinned sha256; running it"
  # sudo resets the environment, so only these two reach the installer, which copies every K3S_, CONTAINERD_, KINE_
  # and proxy variable it sees into k3s's env file.
  sudo INSTALL_K3S_VERSION="$K3S_VERSION" INSTALL_K3S_SYMLINK=skip sh "$staging"
else
  # k3s reads its config only when it starts, and the installer restarts it only for a new binary, unit or env file.
  started="$(systemctl show k3s.service --property=ExecMainStartTimestamp --value --timestamp=unix)"
  [[ $started =~ ^@[0-9]+$ ]] || fail "k3s.service reports no start time"
  if [ "$(stat --format=%Y "$config")" -ge "${started#@}" ]; then
    echo "bootstrap:k3s: $config changed after k3s started; restarting k3s.service"
    sudo systemctl restart k3s.service
  else
    echo "bootstrap:k3s: k3s $K3S_VERSION started after the last change of $config; nothing to do"
  fi
fi

node="$(sed -n 's/^node-name: *//p' "$config")"
[ -n "$node" ] || fail "$config sets no node-name"
kubectl wait "node/$node" --for=create --timeout=3m
kubectl wait "node/$node" --for=condition=Ready --timeout=3m
'''

[tasks."bootstrap:flux"]
description = "Apply Flux from the committed clusters/pc/flux-system to the PC's k3s and wait for its controllers"
env = { KUBECONFIG = "/etc/rancher/k3s/k3s.yaml" }
# The sync objects are Flux's custom resources, so its CRDs and controllers come first. Once Flux has reconciled, its
# kustomize-controller owns the fields the API server normalizes (1000m as 1, 1000 as 1k, the defaulted fieldRef), so a
# repeat claims them back with --force-conflicts, as Flux's own installer does; the values stay the committed ones.
run = [
  "kubectl apply --server-side --force-conflicts --filename clusters/pc/flux-system/gotk-components.yaml",
  "kubectl --namespace flux-system wait deployment --all --for=condition=Available --timeout=3m",
  "kubectl apply --server-side --force-conflicts --kustomize clusters/pc/flux-system",
]

[tasks."bootstrap:secrets"]
description = "Create sops-age and the read-only deploy key for platform-secrets once each, then wait for Flux"
env = { KUBECONFIG = "/etc/rancher/k3s/k3s.yaml" }
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
source_file=clusters/pc/secrets.yaml
source_name=platform-secrets
fail() { echo "bootstrap:secrets: $1" >&2; exit 1; }
read_source() {
  source_name="$source_name" yq "select(.kind == \"GitRepository\" and .metadata.name == strenv(source_name)) | $1" \
    "$source_file"
}
# Reads jsonpath $3 of the object of kind $1 named $2; the kind in lower case is its resource.
read_object() {
  kubectl --namespace flux-system get "${1,,}/$2" --output "jsonpath=$3" ||
    fail "$1 $2 in flux-system unreadable; run this task again once kubectl reads it"
}
# A failed read stops the task instead of counting as a missing Secret.
secret_exists() {
  local found
  found="$(kubectl --namespace flux-system get secret "$1" --ignore-not-found --output name)" ||
    fail "Secret $1 in flux-system unreadable; run this task again once kubectl reads it"
  [ -n "$found" ]
}
# The token is fresh per request, as flux reconcile sets it, so a Ready from an earlier reconcile never counts.
request_reconcile() {
  token="$(date +%s%N)"
  requested_at=$SECONDS
  kubectl --namespace flux-system annotate --overwrite "gitrepository/$source_name" \
    "reconcile.fluxcd.io/requestedAt=$token" >/dev/null ||
    fail "GitRepository $source_name in flux-system not annotated; run this task again once kubectl reaches it"
}
# True once the controller has handled this request with Ready, false when $1 seconds pass first; a handled request
# that is not Ready may turn Ready on the controller's next try, so the window is always observed in full.
source_ready_within() {
  local state
  request_reconcile
  while [ "$SECONDS" -lt $((requested_at + $1)) ]; do
    # The caller's until and if suspend set -e here, so a failed read exits explicitly.
    state="$(read_object GitRepository "$source_name" \
      '{.status.lastHandledReconcileAt} {.status.conditions[?(@.type=="Ready")].status}')" || exit 1
    if [ "${state% *}" = "$token" ] && [ "${state#* }" = True ]; then return 0; fi
    sleep 2
  done
  return 1
}

key_file="$(mise run secrets:key-file)"
[ -f "$key_file" ] || fail "$key_file is missing; on a machine that had an age key, restore it from the password \
manager, and on one that never had one, run mise run secrets:new-key"
if secret_exists sops-age; then
  echo "bootstrap:secrets: Secret sops-age kept"
else
  mise run secrets:age-secret "$key_file"
  echo "bootstrap:secrets: Secret sops-age created"
fi

source_url="$(read_source .spec.url)"
deploy_key_secret="$(read_source .spec.secretRef.name)"
repository="${source_url#ssh://git@github.com/}"
[ "$repository" != "$source_url" ] || fail "$source_file's $source_name is no ssh URL on github.com"
if secret_exists "$deploy_key_secret"; then
  kubectl --namespace flux-system get secret "$deploy_key_secret" --output yaml |
    mise run secrets:github-host-keys >/dev/null || {
    statuses=("${PIPESTATUS[@]}")
    [ "${statuses[0]}" -eq 0 ] ||
      fail "Secret $deploy_key_secret in flux-system unreadable; run this task again once kubectl reads it"
    fail "Secret $deploy_key_secret kept unverified; to replace it, run kubectl --kubeconfig \
/etc/rancher/k3s/k3s.yaml --namespace flux-system delete secret $deploy_key_secret, delete its key at \
https://github.com/$repository/settings/keys and run this task again"
  }
  echo "bootstrap:secrets: Secret $deploy_key_secret kept, host keys verified against $GITHUB_META_URL"
else
  # The private key exists only in this pipeline, and kubectl create never replaces an existing Secret.
  flux create secret git "$deploy_key_secret" --namespace=flux-system --url="$source_url" --ssh-key-algorithm=ed25519 \
    --export | mise run secrets:github-host-keys | kubectl create --filename - >/dev/null ||
    fail "Secret $deploy_key_secret not created; run this task again once the cause above is fixed"
  echo "bootstrap:secrets: Secret $deploy_key_secret created, host keys verified against $GITHUB_META_URL"
fi

# source-controller retries a failed source after a pause that doubles up to 15 minutes, so the task requests each try.
if ! source_ready_within 60; then
  public_key="$(read_object Secret "$deploy_key_secret" '{.data.identity\.pub}' | base64 --decode)"
  echo "bootstrap:secrets: add the deploy key at https://github.com/$repository/settings/keys/new"
  echo "  Title: $(yq '.["node-name"]' host/k3s/config.yaml)"
  echo "  Key:   $public_key"
  echo "  Allow write access: off"
  echo "bootstrap:secrets: GitRepository $source_name not Ready, waiting up to 15 minutes"
  deadline=$((SECONDS + 900))
  until source_ready_within 30; do
    [ "$SECONDS" -lt "$deadline" ] || fail "GitRepository $source_name not Ready after 15 minutes: $(read_object \
GitRepository "$source_name" '{.status.conditions[?(@.type=="Ready")].message}'); check its key at \
https://github.com/$repository/settings/keys and run this task again"
  done
fi
source_revision="$(read_object GitRepository "$source_name" '{.status.artifact.revision}')"
echo "bootstrap:secrets: GitRepository $source_name Ready at $source_revision"

kubectl --namespace flux-system wait "kustomization/$source_name" --for=condition=Ready --timeout=5m >/dev/null ||
  fail "Kustomization $source_name not Ready: $(read_object Kustomization "$source_name" \
'{.status.conditions[?(@.type=="Ready")].message}'); fix its cause in $repository and run this task again"
applied_revision="$(read_object Kustomization "$source_name" '{.status.lastAppliedRevision}')"
echo "bootstrap:secrets: Kustomization $source_name Ready at $applied_revision"
'''

# The platform's restore command. A dump holds keys and hashes, so every line it prints is a name, a count or an
# outcome, never a row.
[tasks."db:load-dump"]
description = "Load a custom-format dump into a namespace's Postgres with its writers stopped, verify it, then resume Flux"
usage = '''
flag "--compare" help="Also compare every table's row count and the sha256 of its sorted rows with the dump"
flag "--resume" help="Only resume the Kustomization a killed load left suspended, once no other session holds the database"
flag "--files <dir>" help="The directory whose files replace the namespace's claim, which a layer that declares one requires"
arg "<namespace>" help="The namespace whose Postgres is loaded; its Flux Kustomization has the same name"
arg "[file]" help="The custom-format dump; pg_restore's messages go to <file>.load.log beside it, mode 0600"
'''
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
umask 077
export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"
namespace="${usage_namespace?}" file="${usage_file:-}" files="${usage_files:-}"
pod=postgres-0 loader=db-load-files
alone_seconds="${DB_LOAD_DUMP_ALONE_SECONDS:-120}"
say() { echo "db:load-dump: $1"; }
fail() { echo "db:load-dump: $1" >&2; exit 1; }
[[ $alone_seconds =~ ^[1-9][0-9]*$ ]] ||
  fail "DB_LOAD_DUMP_ALONE_SECONDS is '$alone_seconds', not a whole number of seconds from 1 without a leading zero; unset it for the default or set the seconds to wait; nothing changed"
in_postgres() { kubectl --namespace "$namespace" exec "$pod" --container postgres -- "$@"; }
dump_into_postgres() { kubectl --namespace "$namespace" exec --stdin "$pod" --container postgres -- "$@" <"$file"; }
other_sessions() {
  in_postgres psql --no-psqlrc --tuples-only --no-align --command="SELECT count(*) FROM pg_stat_activity
    WHERE datname = current_database() AND backend_type = 'client backend' AND pid <> pg_backend_pid()"
}
# pg_restore reads the archive's header and table of contents before it connects, so one whose client died can run
# without a session yet. Fails while one runs in the container, the processes cannot be listed, or one that still
# exists cannot be read; only a process that is gone is skipped.
no_restore_runs() {
  in_postgres sh -c 'set -- /proc/[0-9]*/comm; [ -e "$1" ] || exit 1
    for comm; do
      if name="$(cat "$comm" 2>/dev/null)"; then [ "$name" != pg_restore ] || exit 1
      elif [ -e "${comm%/comm}" ]; then exit 1; fi
    done'
}
# A killed load's remote pg_restore, a backup's pg_dump: a session that could still write or read half a load. The
# processes come first: a restore connects before it ends, and its backend outlives it until its commit is done, so
# a restore the scan no longer finds has either never connected or left a session the next check counts.
wait_alone() {
  local deadline=$((SECONDS + alone_seconds))
  until no_restore_runs && [ "$(other_sessions)" = 0 ]; do [ "$SECONDS" -lt "$deadline" ] || return 1; sleep 2; done
}
# A Ctrl-C reaches mise and this script, and mise forwards it once more, so each exit path ignores INT and runs at most
# once, to its end.
resume_flux() {
  trap - EXIT TERM
  trap '' INT
  [ -z "$files" ] || scripts/load_files.sh stop "$namespace" "$loader" || true
  flux resume kustomization "$namespace" --wait
}
resume() {
  trap - EXIT TERM
  trap '' INT
  wait_alone || fail "the database $namespace still holds another session, or cannot be read, after $alone_seconds seconds; the \
Kustomization stays suspended and the writers at 0: $(way_back)"
  resume_flux
}
# The sha256 of the whole database as pg_dump writes it: schema, rows and sequence values. The fixed restrict key
# keeps pg_dump's output, and so the sum, the same while the data stays the same.
fingerprint() { in_postgres sh -c 'set -o pipefail; pg_dump --restrict-key=fingerprint | sha256sum'; }
# The relations whose stored rows pg_dump does not write: materialized views, which it dumps as a definition and a
# refresh, and tables that belong to an extension.
unfingerprinted_relations() {
  in_postgres psql --no-psqlrc --tuples-only --no-align --command="SELECT count(*) FROM pg_class c WHERE c.relkind = 'm'
    OR (c.relkind IN ('r', 'p') AND EXISTS (SELECT FROM pg_depend d WHERE d.classid = 'pg_class'::regclass
      AND d.objid = c.oid AND d.deptype = 'e'))"
}
# A load with files has no resume: the claim and the database change together, so only the same command again makes
# them equal to the source.
way_back() {
  if [ -n "$files" ]; then echo "run the same command again"
  else echo "check the data, then run mise run db:load-dump --resume $namespace"; fi
}
unknown_outcome() {
  echo "db:load-dump: whether the load changed the data is unknown; the Kustomization $namespace stays suspended \
and its writers at 0: $(way_back)" >&2
}
files_unfinished() {
  echo "db:load-dump: the load of $namespace with its files did not finish or is not verified; the Kustomization \
$namespace stays suspended and its writers at 0: $(way_back)" >&2
}
# A non-zero status or a signal can follow a committed restore, and a client that died can leave its remote pg_restore
# running, so the data counts as unchanged only once the database is alone, holds no relation the fingerprint leaves
# out, and its fingerprint is the one before. A TERM before that decision leaves the outcome unknown.
failed_load() {
  trap 'unknown_outcome; exit 143' TERM
  trap - EXIT
  trap '' INT
  if [ -n "$files" ]; then files_unfinished; return; fi
  local after_load
  if wait_alone && [ "$(unfingerprinted_relations)" = 0 ] && after_load="$(fingerprint)" &&
    [ "$after_load" = "$before_load" ]; then
    # Decided: a TERM from here on must not follow this line with an unknown one.
    trap '' TERM
    echo "db:load-dump: the data is unchanged; resuming the Kustomization $namespace" >&2
    resume_flux
  else
    unknown_outcome
  fi
}
claim="$(kubectl --namespace "$namespace" get configmap postgres --output jsonpath='{.data.backup-claim}')" ||
  fail "cannot read whether $namespace declares a claim; nothing changed"
if [ -n "$claim" ] && [ -z "$files" ] && [ "${usage_resume:-false}" != true ]; then
  fail "$namespace declares a claim, so the load needs --files <dir> with its files; nothing changed"
fi
[ -z "$files" ] || [ -n "$claim" ] || fail "$namespace declares no claim, so --files is refused; nothing changed"
if [ "${usage_resume:-false}" = true ]; then
  [ -z "$claim" ] || fail "$namespace declares a claim, so --resume is refused: run the same command again with its \
dump and --files; nothing changed"
  existing="$(kubectl --namespace flux-system get kustomization "$namespace" --ignore-not-found --output name)" ||
    fail "cannot read whether the Kustomization $namespace exists; nothing changed"
  [ -n "$existing" ] || fail "there is no Kustomization $namespace in flux-system; nothing changed"
  resume
  exit 0
fi

[ -r "$file" ] && [ ! -d "$file" ] || fail "no readable dump file given; nothing changed"
[ -z "$files" ] || scripts/load_files.sh check "$files"
suspended="$(kubectl --namespace flux-system get kustomization "$namespace" -o jsonpath='{.spec.suspend}')" ||
  fail "cannot read whether the Kustomization $namespace is suspended; nothing changed"
# A load with files that was killed leaves the Kustomization suspended and runs again as the same command.
[ "$suspended" != true ] || [ -n "$files" ] ||
  fail "the Kustomization $namespace is suspended; nothing changed. After a killed load of this command run mise run \
db:load-dump --resume $namespace, else ask whoever suspended it"
# Before the load no session of this run writes to the database, so the resume waits for none. It is armed before the
# suspension, which a signal can apply before its client returns. A Kustomization that was suspended already holds a
# killed load of this command or a foreign suspension, and a failure before the load leaves it suspended.
if [ "$suspended" = true ]; then trap files_unfinished EXIT; else trap resume_flux EXIT; fi
trap 'exit 130' INT
trap 'exit 143' TERM
flux suspend kustomization "$namespace"

say "stopping the writers of $namespace"
deployments="$(kubectl --namespace "$namespace" get deployments -o name)"
[ -z "$deployments" ] || kubectl --namespace "$namespace" scale $deployments --replicas=0
# Foreground: the delete returns once the Jobs' pods are gone.
kubectl --namespace "$namespace" delete job --selector "kustomize.toolkit.fluxcd.io/name=$namespace" --cascade=foreground
# A Failed or Succeeded Pod (an evicted one stays) none of whose containers reports running holds no session; nothing
# deletes it. A Pod marked Failed from outside, as on a lost node, can still run and is waited for.
writers="$(kubectl --namespace "$namespace" get pods -o yaml |
  yq '.items[] | select(.metadata.ownerReferences[]?.kind == "ReplicaSet" and ((.status.phase == "Failed" or .status.phase == "Succeeded") and ([.status.containerStatuses[]?, .status.initContainerStatuses[]?] | map(select(.state.running != null)) | length == 0)) == false) | "pod/" + .metadata.name')"
[ -z "$writers" ] || kubectl --namespace "$namespace" wait $writers --for=delete --timeout=5m
wait_alone || fail "the database $namespace still holds another session, or cannot be read, after $alone_seconds seconds; nothing loaded"
# Before the load, so a claim that cannot hold the files refuses with the database unchanged.
[ -z "$files" ] || scripts/load_files.sh start "$namespace" "$loader" "$claim" "$files"
before_load="$(fingerprint)" || fail "cannot read the database $namespace before the load; nothing loaded"

log="$file.load.log"
: >"$log" && chmod 0600 "$log"
say "loading $file in one transaction; pg_restore's messages go to $log"
# A COPY error quotes a row, also in the server's log, which these settings keep silent for this session. The
# redirections stay on the kubectl command, where only its process gets them: on a function call they would hold
# while a trap prints the outcome, which would then go to the log.
trap failed_load EXIT
load_status=0
kubectl --namespace "$namespace" exec --stdin "$pod" --container postgres -- \
  env PGOPTIONS='-c log_min_messages=panic -c log_min_error_statement=panic' pg_restore --clean --if-exists --no-owner \
  --role="$namespace" --single-transaction --exit-on-error --dbname="$namespace" <"$file" 2>"$log" || load_status=$?
[ "$load_status" = 0 ] || fail "pg_restore exited $load_status with $(grep -c . "$log") lines in $log"
# The data is committed: until it is verified, a signal or a failure leaves the writers stopped, not resumed on it.
unverified() {
  echo "db:load-dump: the loaded data is not verified against $file; the Kustomization $namespace stays suspended and \
its writers at 0: $(way_back)" >&2
}
trap unverified EXIT

verified=true
dump_into_postgres sh /etc/postgres-checks/check-key-tables.sh || verified=false
if [ "${usage_compare:-false}" = true ]; then
  dumped="$(dump_into_postgres sh -c \
    "set -o pipefail; pg_restore --data-only --file=- | sh /etc/postgres-checks/table-digests.sh")" &&
    loaded="$(in_postgres sh -c "set -o pipefail; pg_dump --data-only | sh /etc/postgres-checks/table-digests.sh")" &&
    awk 'NF != 4 { next } FILENAME == ARGV[1] { dumped[$3] = $1; dumped_rows[$3] = $4; next }
      { loaded[$3] = $1; loaded_rows[$3] = $4 }
      END { for (table in dumped) tables[table]; for (table in loaded) tables[table]
        for (table in tables) { same = (table in dumped) && (table in loaded) && dumped[table] == loaded[table] &&
            dumped_rows[table] == loaded_rows[table]; differing += !same
          printf "%s: %d rows loaded, %d in the dump, %s\n", table, loaded_rows[table], dumped_rows[table],
            same ? "equal" : "DIFFERS" }
        exit differing > 0 }' <(printf '%s\n' "$dumped") <(printf '%s\n' "$loaded") || verified=false
fi
[ "$verified" = true ] || exit 1

if [ -n "$files" ]; then
  trap files_unfinished EXIT
  scripts/load_files.sh sync "$namespace" "$loader" "$files" "$log"
  scripts/load_files.sh verify "$namespace" "$loader" "$files" "$log"
fi
say "verified; resuming the Kustomization $namespace"
resume
trap - INT
for deployment in $deployments; do
  kubectl --namespace "$namespace" rollout status "$deployment" --timeout=5m
done
jobs="$(kubectl --namespace "$namespace" get jobs --selector "kustomize.toolkit.fluxcd.io/name=$namespace" -o name)"
[ -z "$jobs" ] || kubectl --namespace "$namespace" wait $jobs --for=condition=Complete --timeout=5m
in_postgres sh /etc/postgres-checks/check-key-tables.sh --counts-only
say "$namespace converged"
'''

[tasks."backup:fetch"]
description = "Write the latest Postgres dump or SQLite copy of a namespace's k8up repository to a new file, through the restore test's init container"
usage = '''
arg "<namespace>" help="The namespace whose repository the dump or copy comes from"
arg "<file>" help="A new file for the custom-format dump or the SQLite copy, mode 0600"
'''
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
umask 077
export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"
namespace="${usage_namespace?}" file="${usage_file?}"
pod="backup-fetch-$(openssl rand -hex 4)"
say() { echo "backup:fetch: $1"; }
fail() { echo "backup:fetch: $1" >&2; exit 1; }

# noclobber makes the creation fail on any file that exists by then, so the file this run deletes is its own.
[ ! -e "$file" ] && (set -o noclobber && : >"$file") 2>/dev/null || fail "$file exists or cannot be created; nothing fetched"
cleanup() { kubectl --namespace "$namespace" delete pod "$pod" --ignore-not-found --wait=false >/dev/null || true; }
trap 'cleanup; rm -f -- "$file"' EXIT
trap 'exit 130' INT
trap 'exit 143' TERM

# The restore test's pod with its init container alone and a holder container, so the dump is what the monthly test
# would restore: the same repository, credentials and restic.
manifest="$(kubectl --namespace "$namespace" get cronjob restore-test --output json |
  NAME="$pod" yq --output-format json \
    '.spec.jobTemplate.spec.template.spec as $spec | $spec.initContainers[0] as $dump |
     { "apiVersion": "v1", "kind": "Pod", "metadata": { "name": strenv(NAME) },
       "spec": ($spec | .volumes |= map(select(.name == "restore")) | .containers = [{
         "name": "holder", "image": $dump.image, "command": ["sleep", "3600"],
         "securityContext": $dump.securityContext, "volumeMounts": [{ "name": "restore", "mountPath": "/restore" }] }]) }')" ||
  fail "cannot read the CronJob restore-test in $namespace; nothing fetched"
kubectl --namespace "$namespace" create --filename - <<<"$manifest" >/dev/null ||
  fail "could not start the fetch pod in $namespace; nothing fetched"

deadline=$((SECONDS + 900))
until phase="$(kubectl --namespace "$namespace" get pod "$pod" --output jsonpath='{.status.phase}')" && [ "$phase" = Running ]; do
  [ "$phase" != Failed ] || fail "the fetch pod $pod failed: restic could not read the latest snapshot of $namespace"
  [ "$SECONDS" -lt "$deadline" ] || fail "the fetch pod $pod is not running after 15 minutes"
  sleep 2
done
kubectl --namespace "$namespace" exec "$pod" --container holder -- cat /restore/dump >"$file" ||
  fail "could not copy the dump out of the pod $pod"
# restic names a format that holds no file as an error before here; this catches a file of neither format. A header is
# compared byte for byte against printf's, since SQLite's ends in a NUL that a command substitution would drop.
if cmp --silent --bytes=5 "$file" <(printf 'PGDMP') 2>/dev/null; then
  kind=dump
elif cmp --silent --bytes=16 "$file" <(printf 'SQLite format 3\0') 2>/dev/null; then
  kind="SQLite copy"
else
  fail "$file holds neither a custom-format dump nor a SQLite copy; it is deleted"
fi
trap - EXIT
cleanup
chmod 0600 "$file"
say "wrote the latest $kind of $namespace to $file ($(stat --format=%s "$file") bytes, mode 0600)"
'''

