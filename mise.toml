min_version = "2026.11.3"

[tool_config]
locked = true

[tools]
age = "1"
flux2 = "2"
gh = "2"
helm = "4.3"
k3d = "5"
kubectl = "1.37"
sops = "3"
opentofu = "1.13"
yq = "4"

[env]
# The one k3s pin: the k3d image in CI and the installer on the PC.
K3S_VERSION = "v1.37.2+k3s1"
# The one Flux component set: flux:export writes it and the images job names Flux's own images from it. No Helm
# reconciler is in it, since every chart is rendered into Git.
FLUX_COMPONENTS = "source-controller,kustomize-controller,notification-controller"
# The sha256 of k3s's install.sh at that tag, the file bootstrap:k3s downloads; a bump changes both.
K3S_INSTALLER_SHA256 = "ed01f89fd977bf20ac1516bbebf8370bf3ddbaa55dac8aba610956a4c78cc00b"
# The one source of GitHub's host keys, which secrets:github-host-keys checks the deploy key's known_hosts against.
GITHUB_META_URL = "https://api.github.com/meta"

# mise creates no missing parent of a file, and k3s's own directory exists only once k3s has run.
[bootstrap.directories."/etc/rancher/k3s"]
owner = "root"
group = "root"
mode = "0755"

[bootstrap.files."/etc/rancher/k3s/config.yaml"]
source = "host/k3s/config.yaml"
owner = "root"
group = "root"
mode = "0644"

# The 30-day bound on the kubelet's pod logs: the tmpfiles line, its daily clean and the check run after each clean.
[bootstrap.files."/etc/tmpfiles.d/pod-logs.conf"]
source = "host/pod-logs/pod-logs.conf"
owner = "root"
group = "root"
mode = "0644"

[bootstrap.files."/usr/local/sbin/check-pod-logs"]
source = "host/pod-logs/scripts/check_pod_logs.sh"
owner = "root"
group = "root"
mode = "0755"

# mise starts a unit it has not seen before only when the run that writes its file notifies it, and a notification
# runs systemd's daemon-reload first, so a changed service file reaches systemd too.
[bootstrap.files."/etc/systemd/system/pod-logs-clean.timer"]
source = "host/pod-logs/pod-logs-clean.timer"
owner = "root"
group = "root"
mode = "0644"
notify = ["pod-logs-clean.timer"]

[bootstrap.files."/etc/systemd/system/pod-logs-clean.service"]
source = "host/pod-logs/pod-logs-clean.service"
owner = "root"
group = "root"
mode = "0644"
notify = ["pod-logs-clean.timer"]

[bootstrap.services."pod-logs-clean.timer"]
state = "running"
enabled = true

# The PC's ufw keeps its defaults and the operator's own rules (no exclusive, whose ufw reset would delete them).
# The pods reach the API server and the kubelet on the host through cni0, which only pods sit on, so one rule on the
# interface alone admits them. mise's ufw check reads the "/16" of a source CIDR as a protocol, so a rule with a
# source never matches and every plan would name it unknown.
# k3s-pods and k3s-services are declared absent because mise's apply keeps every rule its state file holds, and the
# PC's holds those two.
[bootstrap.linux.firewall]
backend = "ufw"
default_incoming = "deny"
default_outgoing = "allow"

[[bootstrap.linux.firewall.rules]]
name = "k3s-cni"
interface = "cni0"

[[bootstrap.linux.firewall.rules]]
name = "k3s-pods"
state = "absent"

[[bootstrap.linux.firewall.rules]]
name = "k3s-services"
state = "absent"

[tasks."flux:export"]
description = "Regenerate the committed Flux components from the locked flux2"
# flux install writes the subjects of its ClusterRoleBindings for every controller, so the ServiceAccount of the
# omitted helm-controller stays a subject of cluster-admin; no such account exists, so anyone able to create one in
# flux-system would gain it.
run = '''
#!/usr/bin/env bash
set -euo pipefail
flux install --export --components="$FLUX_COMPONENTS" |
  sed '/^- kind: ServiceAccount$/{N;N;/\n  name: helm-controller\n  namespace: flux-system$/d}' \
    > clusters/pc/flux-system/gotk-components.yaml
'''

[tasks."charts:render"]
description = "Render each pinned chart with its values into infrastructure/<component>/rendered.yaml"
run = '''
#!/usr/bin/env bash
set -euo pipefail
fail() { echo "charts:render: $1" >&2; exit 1; }
staging_dir="$(mktemp -d)"
trap 'rm -rf "$staging_dir"' EXIT

# render <component> <chart>: the release and its namespace are the component. The committed file is replaced only by
# a complete render without hooks, and stays as it is on any failure.
render() {
  local component="$1" chart="$2"
  local values="infrastructure/$component/values.yaml" output="infrastructure/$component/rendered.yaml"
  local staged="$staging_dir/$component.yaml" hooks
  {
    echo "# Generated by mise run charts:render from $chart with $values; do not edit."
    helm template "$component" "$chart" --namespace "$component" --values "$values" \
      --kube-version "$K3S_VERSION" --skip-tests
  } >"$staged" || fail "helm could not render $chart; $output is unchanged"
  # Flux would apply a hook as a plain object on every reconcile, without its timing or its delete policy.
  hooks="$(yq --no-doc 'select(.metadata.annotations["helm.sh/hook"]) | .kind + "/" + .metadata.name' "$staged")"
  [ -z "$hooks" ] || fail "the render of $chart holds helm hooks: ${hooks//$'\n'/ }; $output is unchanged"
  chmod 0644 "$staged"
  mv "$staged" "$output"
}

render traefik oci://ghcr.io/traefik/helm/traefik@sha256:a702a4316735397ecd1c3ed5287cccf87cdbc69abb0451c0b2d371408473bc33
'''

[tasks."secrets:age-secret"]
description = "Create the Secret sops-age in flux-system, the age key Flux decrypts platform-secrets with, from a key file"
usage = 'arg "<key_file>" help="The age key file; the task has no default and reads no other key"'
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
kubectl --namespace flux-system create secret generic sops-age --from-file=age.agekey="${usage_key_file?}" >/dev/null
'''

# The one owner of the age key's path: the file sops reads besides its other key sources.
[tasks."secrets:key-file"]
description = "Print the age key file: SOPS_AGE_KEY_FILE if set and non-empty, else the user config's sops/age/keys.txt"
hide = true
quiet = true
run = 'echo "${SOPS_AGE_KEY_FILE:-${XDG_CONFIG_HOME:-$HOME/.config}/sops/age/keys.txt}"'

[tasks."secrets:new-key"]
description = "Create the age key once in the file secrets:key-file prints and print only its recipient"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
fail() { echo "secrets:new-key: $1, nothing changed; $2" >&2; exit 1; }
key_file="$(mise run secrets:key-file)"
key_dir="$(dirname "$key_file")"

# During a drill the key every value is encrypted to sits beside its file, and a new key would replace it.
if [ -e "$key_file.drill" ] || [ -L "$key_file.drill" ]; then
  fail "$key_file.drill exists" "move it back to $key_file to end the drill"
fi
if [ -e "$key_file" ] || [ -L "$key_file" ]; then
  fail "$key_file exists and is kept unread" "run mise run bootstrap:secrets to use it"
fi
existing_ancestor="$key_dir"
until [ -e "$existing_ancestor" ] || [ -L "$existing_ancestor" ]; do
  existing_ancestor="$(dirname "$existing_ancestor")"
done
[ -d "$existing_ancestor" ] || fail "$existing_ancestor is no directory, so the key directory $key_dir cannot exist" \
  "move it or set SOPS_AGE_KEY_FILE"
if [ -d "$key_dir" ]; then
  # The directory the file lands in guards it, so a symlinked key directory is judged by its target.
  key_dir_mode="$(stat --dereference --format=%a "$key_dir")"
  [ "$key_dir_mode" = 700 ] || fail "$key_dir has mode $key_dir_mode, not 700" "chmod it to 700 to go on"
fi

umask 077
mkdir -p "$key_dir"
# age-keygen creates the file exclusively and names only the recipient, as "Public key: age1...".
keygen_output="$(age-keygen -o "$key_file" 2>&1)" || { printf '%s\n' "$keygen_output" >&2; exit 1; }
echo "secrets:new-key: $key_file created for the recipient ${keygen_output#Public key: }"
'''

# A filter: on stdin one Secret manifest, which holds a private key, so it reaches the readers only through pipes.
[tasks."secrets:github-host-keys"]
description = "Pass a Secret manifest on unchanged only when every known_hosts line is a key GitHub's meta API lists"
hide = true
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
meta_url="${GITHUB_META_URL?}"
fail() { echo "secrets:github-host-keys: $1; nothing passed on" >&2; exit 1; }

IFS= read -r -d '' manifest || true
[ "$(printf '%s' "$manifest" | yq '.kind')" = Secret ] || fail "stdin holds not exactly one Secret"
known_hosts="$(printf '%s' "$manifest" | yq '.stringData.known_hosts // (.data.known_hosts // "" | @base64d)')" ||
  fail "the Secret's known_hosts cannot be read"
[ -n "$known_hosts" ] || fail "the Secret's known_hosts is empty"
github_keys="$(curl --fail --silent --show-error --proto '=https' --tlsv1.2 "$meta_url" | yq -p json '.ssh_keys[]')" ||
  fail "the ssh_keys of $meta_url cannot be read"
[ -n "$github_keys" ] || fail "$meta_url lists no ssh_keys"

line_number=0
while IFS= read -r line; do
  line_number=$((line_number + 1))
  [[ $line =~ ^github\.com\ ([^ ]+\ [^ ]+)$ ]] ||
    fail "known_hosts line $line_number is not exactly 'github.com <type> <blob>'"
  printf '%s\n' "$github_keys" | grep --quiet --line-regexp --fixed-strings -- "${BASH_REMATCH[1]}" ||
    fail "the key on known_hosts line $line_number is none of the ssh_keys $meta_url lists"
done < <(printf '%s\n' "$known_hosts")

printf '%s' "$manifest"
'''

[tasks."check:pod-logs"]
description = "Check that no pod log on the PC is past its 30-day bound and that the daily clean ran and succeeded"
# The installed check, the one the clean runs; /var/log/pods is root's alone.
run = "sudo /usr/local/sbin/check-pod-logs"

[tasks."check:secrets-expiry"]
description = "Check that no Secret on the PC carries an expires-on annotation within 30 days or past"
env = { KUBECONFIG = "/etc/rancher/k3s/k3s.yaml" }
run = "scripts/check_secrets_expiry.sh"

[tasks."github:test"]
description = "Check the GitHub settings root: format, init against the committed lock, validate and the mocked tests"
dir = "src/opentofu/github"
run = '''
#!/usr/bin/env bash
set -euo pipefail
TF_DATA_DIR="$(mktemp -d)"
export TF_DATA_DIR
trap 'rm -rf "$TF_DATA_DIR"' EXIT
tofu fmt -check -recursive
tofu init -backend=false -lockfile=readonly -input=false
tofu validate
tofu test
'''

[tasks.bootstrap]
description = "The PC's own steps after the declarative parts: k3s, then Flux, then its access to platform-secrets"
run = [{ task = "bootstrap:k3s" }, { task = "bootstrap:flux" }, { task = "bootstrap:secrets" }]

[tasks."bootstrap:k3s"]
description = "Install k3s at K3S_VERSION from its pinned installer, restart it for a newer config, wait for the node"
env = { KUBECONFIG = "/etc/rancher/k3s/k3s.yaml" }
run = '''
#!/usr/bin/env bash
set -euo pipefail
config=/etc/rancher/k3s/config.yaml
committed_config=host/k3s/config.yaml
installer_url="https://raw.githubusercontent.com/k3s-io/k3s/${K3S_VERSION}/install.sh"
fail() { echo "bootstrap:k3s: $1" >&2; exit 1; }

# Without this file k3s's first start takes its defaults: Secrets unencrypted, the hostname as node name, and the
# bundled Traefik on servicelb's host ports.
cmp --silent "$committed_config" "$config" ||
  fail "$config is missing or differs from $committed_config; run scripts/bootstrap_pc.sh --only files,firewall first"

installed_version=""
if [ -x /usr/local/bin/k3s ]; then
  installed_version="$(/usr/local/bin/k3s --version | awk 'NR == 1 { print $3 }')"
fi

if [ "$installed_version" != "$K3S_VERSION" ]; then
  staging="$(mktemp)"
  trap 'rm -f "$staging"' EXIT
  curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$staging" "$installer_url"
  echo "${K3S_INSTALLER_SHA256}  ${staging}" | sha256sum --check --status ||
    fail "$installer_url does not match the pinned sha256 $K3S_INSTALLER_SHA256; the installer did not run"
  echo "bootstrap:k3s: $installer_url matches the pinned sha256; running it"
  # sudo resets the environment, so only these two reach the installer, which copies every K3S_, CONTAINERD_, KINE_
  # and proxy variable it sees into k3s's env file.
  sudo INSTALL_K3S_VERSION="$K3S_VERSION" INSTALL_K3S_SYMLINK=skip sh "$staging"
else
  # k3s reads its config only when it starts, and the installer restarts it only for a new binary, unit or env file.
  started="$(systemctl show k3s.service --property=ExecMainStartTimestamp --value --timestamp=unix)"
  [[ $started =~ ^@[0-9]+$ ]] || fail "k3s.service reports no start time"
  if [ "$(stat --format=%Y "$config")" -ge "${started#@}" ]; then
    echo "bootstrap:k3s: $config changed after k3s started; restarting k3s.service"
    sudo systemctl restart k3s.service
  else
    echo "bootstrap:k3s: k3s $K3S_VERSION started after the last change of $config; nothing to do"
  fi
fi

node="$(sed -n 's/^node-name: *//p' "$config")"
[ -n "$node" ] || fail "$config sets no node-name"
kubectl wait "node/$node" --for=create --timeout=3m
kubectl wait "node/$node" --for=condition=Ready --timeout=3m
'''

[tasks."bootstrap:flux"]
description = "Apply Flux from the committed clusters/pc/flux-system to the PC's k3s and wait for its controllers"
env = { KUBECONFIG = "/etc/rancher/k3s/k3s.yaml" }
# The sync objects are Flux's custom resources, so its CRDs and controllers come first. Once Flux has reconciled, its
# kustomize-controller owns the fields the API server normalizes (1000m as 1, 1000 as 1k, the defaulted fieldRef), so a
# repeat claims them back with --force-conflicts, as Flux's own installer does; the values stay the committed ones.
run = [
  "kubectl apply --server-side --force-conflicts --filename clusters/pc/flux-system/gotk-components.yaml",
  "kubectl --namespace flux-system wait deployment --all --for=condition=Available --timeout=3m",
  "kubectl apply --server-side --force-conflicts --kustomize clusters/pc/flux-system",
]

[tasks."bootstrap:secrets"]
description = "Create sops-age and the read-only deploy key for platform-secrets once each, then wait for Flux"
env = { KUBECONFIG = "/etc/rancher/k3s/k3s.yaml" }
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
source_file=clusters/pc/secrets.yaml
source_name=platform-secrets
fail() { echo "bootstrap:secrets: $1" >&2; exit 1; }
read_source() {
  source_name="$source_name" yq "select(.kind == \"GitRepository\" and .metadata.name == strenv(source_name)) | $1" \
    "$source_file"
}
# Reads jsonpath $3 of the object of kind $1 named $2; the kind in lower case is its resource.
read_object() {
  kubectl --namespace flux-system get "${1,,}/$2" --output "jsonpath=$3" ||
    fail "$1 $2 in flux-system unreadable; run this task again once kubectl reads it"
}
# A failed read stops the task instead of counting as a missing Secret.
secret_exists() {
  local found
  found="$(kubectl --namespace flux-system get secret "$1" --ignore-not-found --output name)" ||
    fail "Secret $1 in flux-system unreadable; run this task again once kubectl reads it"
  [ -n "$found" ]
}
# The token is fresh per request, as flux reconcile sets it, so a Ready from an earlier reconcile never counts.
request_reconcile() {
  token="$(date +%s%N)"
  requested_at=$SECONDS
  kubectl --namespace flux-system annotate --overwrite "gitrepository/$source_name" \
    "reconcile.fluxcd.io/requestedAt=$token" >/dev/null ||
    fail "GitRepository $source_name in flux-system not annotated; run this task again once kubectl reaches it"
}
# True once the controller has handled this request with Ready, false when $1 seconds pass first; a handled request
# that is not Ready may turn Ready on the controller's next try, so the window is always observed in full.
source_ready_within() {
  local state
  request_reconcile
  while [ "$SECONDS" -lt $((requested_at + $1)) ]; do
    # The caller's until and if suspend set -e here, so a failed read exits explicitly.
    state="$(read_object GitRepository "$source_name" \
      '{.status.lastHandledReconcileAt} {.status.conditions[?(@.type=="Ready")].status}')" || exit 1
    if [ "${state% *}" = "$token" ] && [ "${state#* }" = True ]; then return 0; fi
    sleep 2
  done
  return 1
}

key_file="$(mise run secrets:key-file)"
[ -f "$key_file" ] || fail "$key_file is missing; on a machine that had an age key, restore it from the password \
manager, and on one that never had one, run mise run secrets:new-key"
if secret_exists sops-age; then
  echo "bootstrap:secrets: Secret sops-age kept"
else
  mise run secrets:age-secret "$key_file"
  echo "bootstrap:secrets: Secret sops-age created"
fi

source_url="$(read_source .spec.url)"
deploy_key_secret="$(read_source .spec.secretRef.name)"
repository="${source_url#ssh://git@github.com/}"
[ "$repository" != "$source_url" ] || fail "$source_file's $source_name is no ssh URL on github.com"
if secret_exists "$deploy_key_secret"; then
  kubectl --namespace flux-system get secret "$deploy_key_secret" --output yaml |
    mise run secrets:github-host-keys >/dev/null || {
    statuses=("${PIPESTATUS[@]}")
    [ "${statuses[0]}" -eq 0 ] ||
      fail "Secret $deploy_key_secret in flux-system unreadable; run this task again once kubectl reads it"
    fail "Secret $deploy_key_secret kept unverified; to replace it, run kubectl --kubeconfig \
/etc/rancher/k3s/k3s.yaml --namespace flux-system delete secret $deploy_key_secret, delete its key at \
https://github.com/$repository/settings/keys and run this task again"
  }
  echo "bootstrap:secrets: Secret $deploy_key_secret kept, host keys verified against $GITHUB_META_URL"
else
  # The private key exists only in this pipeline, and kubectl create never replaces an existing Secret.
  flux create secret git "$deploy_key_secret" --namespace=flux-system --url="$source_url" --ssh-key-algorithm=ed25519 \
    --export | mise run secrets:github-host-keys | kubectl create --filename - >/dev/null ||
    fail "Secret $deploy_key_secret not created; run this task again once the cause above is fixed"
  echo "bootstrap:secrets: Secret $deploy_key_secret created, host keys verified against $GITHUB_META_URL"
fi

# source-controller retries a failed source after a pause that doubles up to 15 minutes, so the task requests each try.
if ! source_ready_within 60; then
  public_key="$(read_object Secret "$deploy_key_secret" '{.data.identity\.pub}' | base64 --decode)"
  echo "bootstrap:secrets: add the deploy key at https://github.com/$repository/settings/keys/new"
  echo "  Title: $(yq '.["node-name"]' host/k3s/config.yaml)"
  echo "  Key:   $public_key"
  echo "  Allow write access: off"
  echo "bootstrap:secrets: GitRepository $source_name not Ready, waiting up to 15 minutes"
  deadline=$((SECONDS + 900))
  until source_ready_within 30; do
    [ "$SECONDS" -lt "$deadline" ] || fail "GitRepository $source_name not Ready after 15 minutes: $(read_object \
GitRepository "$source_name" '{.status.conditions[?(@.type=="Ready")].message}'); check its key at \
https://github.com/$repository/settings/keys and run this task again"
  done
fi
source_revision="$(read_object GitRepository "$source_name" '{.status.artifact.revision}')"
echo "bootstrap:secrets: GitRepository $source_name Ready at $source_revision"

kubectl --namespace flux-system wait "kustomization/$source_name" --for=condition=Ready --timeout=5m >/dev/null ||
  fail "Kustomization $source_name not Ready: $(read_object Kustomization "$source_name" \
'{.status.conditions[?(@.type=="Ready")].message}'); fix its cause in $repository and run this task again"
applied_revision="$(read_object Kustomization "$source_name" '{.status.lastAppliedRevision}')"
echo "bootstrap:secrets: Kustomization $source_name Ready at $applied_revision"
'''

# The platform's restore command. A dump holds keys and hashes, so every line it prints is a name, a count or an
# outcome, never a row.
[tasks."db:load-dump"]
description = "Load a custom-format dump into a namespace's Postgres with its writers stopped, verify it, then resume Flux"
usage = '''
flag "--compare" help="Also compare every table's row count and the sha256 of its sorted rows with the dump"
flag "--resume" help="Only resume the Kustomization a killed load left suspended, once no other session holds the database"
arg "<namespace>" help="The namespace whose Postgres is loaded; its Flux Kustomization has the same name"
arg "[file]" help="The custom-format dump; pg_restore's messages go to <file>.load.log beside it, mode 0600"
'''
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
umask 077
export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"
namespace="${usage_namespace?}" file="${usage_file:-}"
pod=postgres-0
say() { echo "db:load-dump: $1"; }
fail() { echo "db:load-dump: $1" >&2; exit 1; }
in_postgres() { kubectl --namespace "$namespace" exec "$pod" --container postgres -- "$@"; }
dump_into_postgres() { kubectl --namespace "$namespace" exec --stdin "$pod" --container postgres -- "$@" <"$file"; }
other_sessions() {
  in_postgres psql --no-psqlrc --tuples-only --no-align --command="SELECT count(*) FROM pg_stat_activity
    WHERE datname = current_database() AND backend_type = 'client backend' AND pid <> pg_backend_pid()"
}
# pg_restore reads the archive's header and table of contents before it connects, so one whose client died can run
# without a session yet. Fails while one runs in the container, the processes cannot be listed, or one that still
# exists cannot be read; only a process that is gone is skipped.
no_restore_runs() {
  in_postgres sh -c 'set -- /proc/[0-9]*/comm; [ -e "$1" ] || exit 1
    for comm; do
      if name="$(cat "$comm" 2>/dev/null)"; then [ "$name" != pg_restore ] || exit 1
      elif [ -e "${comm%/comm}" ]; then exit 1; fi
    done'
}
# A killed load's remote pg_restore, a backup's pg_dump: a session that could still write or read half a load. The
# processes come first: a restore connects before it ends, and its backend outlives it until its commit is done, so
# a restore the scan no longer finds has either never connected or left a session the next check counts.
wait_alone() {
  local deadline=$((SECONDS + 120))
  until no_restore_runs && [ "$(other_sessions)" = 0 ]; do [ "$SECONDS" -lt "$deadline" ] || return 1; sleep 2; done
}
# A Ctrl-C reaches mise and this script, and mise forwards it once more, so each exit path ignores INT and runs at most
# once, to its end.
resume_flux() {
  trap - EXIT TERM
  trap '' INT
  flux resume kustomization "$namespace" --wait
}
resume() {
  trap - EXIT TERM
  trap '' INT
  wait_alone || fail "the database $namespace still holds another session, or cannot be read, after 2 minutes; the \
Kustomization stays suspended and the writers at 0: run mise run db:load-dump --resume $namespace once it ended"
  resume_flux
}
# The sha256 of the whole database as pg_dump writes it: schema, rows and sequence values. The fixed restrict key
# keeps pg_dump's output, and so the sum, the same while the data stays the same.
fingerprint() { in_postgres sh -c 'set -o pipefail; pg_dump --restrict-key=fingerprint | sha256sum'; }
# The relations whose stored rows pg_dump does not write: materialized views, which it dumps as a definition and a
# refresh, and tables that belong to an extension.
unfingerprinted_relations() {
  in_postgres psql --no-psqlrc --tuples-only --no-align --command="SELECT count(*) FROM pg_class c WHERE c.relkind = 'm'
    OR (c.relkind IN ('r', 'p') AND EXISTS (SELECT FROM pg_depend d WHERE d.classid = 'pg_class'::regclass
      AND d.objid = c.oid AND d.deptype = 'e'))"
}
unknown_outcome() {
  echo "db:load-dump: whether the load changed the data is unknown; the Kustomization $namespace stays suspended \
and its writers at 0: check the data, then run mise run db:load-dump --resume $namespace" >&2
}
# A non-zero status or a signal can follow a committed restore, and a client that died can leave its remote pg_restore
# running, so the data counts as unchanged only once the database is alone, holds no relation the fingerprint leaves
# out, and its fingerprint is the one before. A TERM before that decision leaves the outcome unknown.
failed_load() {
  trap 'unknown_outcome; exit 143' TERM
  trap - EXIT
  trap '' INT
  local after_load
  if wait_alone && [ "$(unfingerprinted_relations)" = 0 ] && after_load="$(fingerprint)" &&
    [ "$after_load" = "$before_load" ]; then
    # Decided: a TERM from here on must not follow this line with an unknown one.
    trap '' TERM
    echo "db:load-dump: the data is unchanged; resuming the Kustomization $namespace" >&2
    resume_flux
  else
    unknown_outcome
  fi
}
if [ "${usage_resume:-false}" = true ]; then
  existing="$(kubectl --namespace flux-system get kustomization "$namespace" --ignore-not-found --output name)" ||
    fail "cannot read whether the Kustomization $namespace exists; nothing changed"
  [ -n "$existing" ] || fail "there is no Kustomization $namespace in flux-system; nothing changed"
  resume
  exit 0
fi

[ -r "$file" ] && [ ! -d "$file" ] || fail "no readable dump file given; nothing changed"
suspended="$(kubectl --namespace flux-system get kustomization "$namespace" -o jsonpath='{.spec.suspend}')" ||
  fail "cannot read whether the Kustomization $namespace is suspended; nothing changed"
[ "$suspended" != true ] ||
  fail "the Kustomization $namespace is suspended; nothing changed. After a killed load of this command run mise run \
db:load-dump --resume $namespace, else ask whoever suspended it"
# Before the load no session of this run writes to the database, so the resume waits for none. It is armed before the
# suspension, which a signal can apply before its client returns; the Kustomization was not suspended before.
trap resume_flux EXIT
trap 'exit 130' INT
trap 'exit 143' TERM
flux suspend kustomization "$namespace"

say "stopping the writers of $namespace"
deployments="$(kubectl --namespace "$namespace" get deployments -o name)"
[ -z "$deployments" ] || kubectl --namespace "$namespace" scale $deployments --replicas=0
# Foreground: the delete returns once the Jobs' pods are gone.
kubectl --namespace "$namespace" delete job --selector "kustomize.toolkit.fluxcd.io/name=$namespace" --cascade=foreground
writers="$(kubectl --namespace "$namespace" get pods -o yaml |
  yq '.items[] | select(.metadata.ownerReferences[]?.kind == "ReplicaSet") | "pod/" + .metadata.name')"
[ -z "$writers" ] || kubectl --namespace "$namespace" wait $writers --for=delete --timeout=5m
wait_alone || fail "the database $namespace still holds another session, or cannot be read, after 2 minutes; nothing loaded"
before_load="$(fingerprint)" || fail "cannot read the database $namespace before the load; nothing loaded"

log="$file.load.log"
: >"$log" && chmod 0600 "$log"
say "loading $file in one transaction; pg_restore's messages go to $log"
# A COPY error quotes a row, also in the server's log, which these settings keep silent for this session. The
# redirections stay on the kubectl command, where only its process gets them: on a function call they would hold
# while a trap prints the outcome, which would then go to the log.
trap failed_load EXIT
load_status=0
kubectl --namespace "$namespace" exec --stdin "$pod" --container postgres -- \
  env PGOPTIONS='-c log_min_messages=panic -c log_min_error_statement=panic' pg_restore --clean --if-exists --no-owner \
  --role="$namespace" --single-transaction --exit-on-error --dbname="$namespace" <"$file" 2>"$log" || load_status=$?
[ "$load_status" = 0 ] || fail "pg_restore exited $load_status with $(grep -c . "$log") lines in $log"
# The data is committed: until it is verified, a signal or a failure leaves the writers stopped, not resumed on it.
unverified() {
  echo "db:load-dump: the loaded data is not verified against $file; the Kustomization $namespace stays suspended and \
its writers at 0: check the data, then run mise run db:load-dump --resume $namespace" >&2
}
trap unverified EXIT

verified=true
dump_into_postgres sh /etc/postgres-checks/check-key-tables.sh || verified=false
if [ "${usage_compare:-false}" = true ]; then
  dumped="$(dump_into_postgres sh -c \
    "set -o pipefail; pg_restore --data-only --file=- | sh /etc/postgres-checks/table-digests.sh")" &&
    loaded="$(in_postgres sh -c "set -o pipefail; pg_dump --data-only | sh /etc/postgres-checks/table-digests.sh")" &&
    awk 'NF != 4 { next } FILENAME == ARGV[1] { dumped[$3] = $1; dumped_rows[$3] = $4; next }
      { loaded[$3] = $1; loaded_rows[$3] = $4 }
      END { for (table in dumped) tables[table]; for (table in loaded) tables[table]
        for (table in tables) { same = (table in dumped) && (table in loaded) && dumped[table] == loaded[table] &&
            dumped_rows[table] == loaded_rows[table]; differing += !same
          printf "%s: %d rows loaded, %d in the dump, %s\n", table, loaded_rows[table], dumped_rows[table],
            same ? "equal" : "DIFFERS" }
        exit differing > 0 }' <(printf '%s\n' "$dumped") <(printf '%s\n' "$loaded") || verified=false
fi
[ "$verified" = true ] || exit 1

say "verified; resuming the Kustomization $namespace"
resume
trap - INT
for deployment in $deployments; do
  kubectl --namespace "$namespace" rollout status "$deployment" --timeout=5m
done
jobs="$(kubectl --namespace "$namespace" get jobs --selector "kustomize.toolkit.fluxcd.io/name=$namespace" -o name)"
[ -z "$jobs" ] || kubectl --namespace "$namespace" wait $jobs --for=condition=Complete --timeout=5m
in_postgres sh /etc/postgres-checks/check-key-tables.sh --counts-only
say "$namespace converged"
'''

[tasks."keycloak:admin"]
description = "Forward Keycloak's admin front end to this PC's loopback and print the line that opens its console"
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"
fail() { echo "keycloak:admin: $1" >&2; exit 1; }
admin_url="$(kubectl --namespace keycloak get deployment keycloak \
  -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="KC_HOSTNAME_ADMIN")].value}')"
[[ $admin_url =~ ^http://localhost:([0-9]+)$ ]] ||
  fail "KC_HOSTNAME_ADMIN reads '$admin_url', not http://localhost:<port>; nothing forwarded"
# A browser keeps cookies per host, not per port, so a second console on localhost would share its session.
echo "keycloak:admin: open $admin_url/admin/master/console/ in a private window; Ctrl-C ends the forward"
exec kubectl --namespace keycloak port-forward --address 127.0.0.1 service/keycloak "${BASH_REMATCH[1]}:http"
'''

# kcadm runs in Keycloak's own container and signs in as config-cli with the secret that container holds, so no
# secret reaches this shell; every line is a name, a count or an outcome.
[tasks."keycloak:move-group"]
description = "Dump keycloak to a new file, add every member of /services/agent-service/api to /services/litellm, verify"
usage = '''
flag "--delete-old" help="After the verified move, delete /services/agent-service/api"
arg "<file>" help="A new file for the custom-format dump of keycloak, mode 0600, with <file>.dump.log beside it for the messages of pg_dump and pg_restore; db:load-dump keycloak <file> rolls back"
'''
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
umask 077
export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"
file="${usage_file?}" old_group=/services/agent-service/api new_group=/services/litellm
realm="$(yq '.realm' infrastructure/keycloak/realm.yaml)"
say() { echo "keycloak:move-group: $1"; }
fail() { echo "keycloak:move-group: $1" >&2; exit 1; }
kcadm() {
  kubectl --namespace keycloak exec deployment/keycloak --container keycloak -- bash -c \
    'exec /opt/keycloak/bin/kcadm.sh "$@" --no-config --server http://localhost:8080 --realm master \
      --client "$KC_BOOTSTRAP_ADMIN_CLIENT_ID" --secret "$KC_BOOTSTRAP_ADMIN_CLIENT_SECRET"' kcadm "$@"
}
group_id() { kcadm get "group-by-path$1" --target-realm "$realm" --fields id --format csv --noquotes; }
# members <group id>: the ids of its members, sorted; fails when a page cannot be read.
members() {
  local offset=0 page all=""
  while page="$(kcadm get "groups/$1/members" --target-realm "$realm" --fields id --format csv --noquotes \
    --offset "$offset" --limit 100)"; do
    if [ -z "$page" ]; then
      [ -z "$all" ] || printf '%s\n' "$all" | sort
      return 0
    fi
    all+="${all:+$'\n'}$page"
    offset=$((offset + 100))
  done
  return 1
}
count() { if [ -z "$1" ]; then echo 0; else grep -c . <<<"$1"; fi; }

# noclobber makes the creation fail on any file that exists by then, so the file this run deletes is its own.
[ ! -e "$file" ] && (set -o noclobber && : >"$file") 2>/dev/null ||
  fail "$file exists or cannot be created; nothing written or moved"
# Their messages can quote a row, so they go to the log beside the dump, never to the terminal.
log="$file.dump.log"
: >"$log" && chmod 0600 "$log"
# A partial dump must not look like the backup this task promises, so a failed one is deleted.
kubectl --namespace keycloak exec postgres-0 --container postgres -- pg_dump --format=custom >>"$file" 2>"$log" ||
  { rm -f -- "$file"; fail "pg_dump failed with $(grep -c . "$log") lines in $log, so $file is deleted; nothing moved"; }
kubectl --namespace keycloak exec --stdin postgres-0 --container postgres -- pg_restore --list >/dev/null <"$file" \
  2>>"$log" || { rm -f -- "$file"; fail "pg_restore cannot list the dump, with $(grep -c . "$log") lines in $log, so \
$file is deleted; nothing moved"; }
say "keycloak dumped to $file; pg_dump's and pg_restore's messages, $(grep -c . "$log") lines, are in $log"

old_id="$(group_id "$old_group")" || fail "$realm holds no $old_group or Keycloak cannot be read; nothing moved"
new_id="$(group_id "$new_group")" || fail "$realm holds no $new_group or Keycloak cannot be read; nothing moved"
unreadable="the members of a group cannot be read"
old_members="$(members "$old_id")" || fail "$unreadable; nothing moved"
new_members="$(members "$new_id")" || fail "$unreadable; nothing moved"
for user_id in $(comm -23 <(printf '%s\n' "$old_members") <(printf '%s\n' "$new_members")); do
  kcadm update "users/$user_id/groups/$new_id" --target-realm "$realm" --set "realm=$realm" --set "userId=$user_id" \
    --set "groupId=$new_id" --no-merge ||
    fail "a member of $old_group could not join $new_group; db:load-dump keycloak $file rolls back"
done
new_members="$(members "$new_id")" || fail "$unreadable; db:load-dump keycloak $file rolls back"
[ -z "$(comm -23 <(printf '%s\n' "$old_members") <(printf '%s\n' "$new_members"))" ] ||
  fail "not every member of $old_group is in $new_group; db:load-dump keycloak $file rolls back"
say "$old_group: $(count "$old_members") members; $new_group: $(count "$new_members") members, every one of $old_group among them"
if [ "${usage_delete_old:-false}" = true ]; then
  kcadm delete "groups/$old_id" --target-realm "$realm" ||
    fail "$old_group could not be deleted; its members are already in $new_group"
  say "$old_group deleted"
fi
'''

# Sets the person-linked facts of an agent's service account, which no realm file holds: kcadm runs in Keycloak's own
# container signed in as config-cli, so no secret reaches this shell.
[tasks."keycloak:agent-owner"]
description = "Set an agent's agent_owner to a person and add that person to /agent-owners, with --adder also to /agent-adders"
usage = '''
flag "--adder" help="Also add the person to /agent-adders"
arg "<client>" help="A service-account client of realm.yaml with agent-identity among its default scopes"
arg "<username>" help="A person, which no service account is"
'''
quiet = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
export KUBECONFIG="${KUBECONFIG:-/etc/rancher/k3s/k3s.yaml}"
client="${usage_client?}" username="${usage_username?}" realm_file=infrastructure/keycloak/realm.yaml
owners_group=/agent-owners adders_group=/agent-adders
realm="$(yq '.realm' "$realm_file")"
say() { echo "keycloak:agent-owner: $1"; }
# A refusal before the first write ends in "nothing changed"; after one it names what was written or may have been.
attempted=()
fail() {
  if [ -z "${attempted[*]:-}" ]; then echo "keycloak:agent-owner: $1; nothing changed" >&2
  else echo "keycloak:agent-owner: $1; written or possibly written: ${attempted[*]}; run again to complete it" >&2; fi
  exit 1
}
# kcadm signs in once as config-cli with the secret in Keycloak's environment variable KC_CLI_CLIENT_SECRET, never in an
# argument list that another host user could read, and keeps its token in a private file of the container that goes at
# the end, on every exit.
kcadm_path=/opt/keycloak/bin/kcadm.sh
config_file="/tmp/kcadm-$(</proc/sys/kernel/random/uuid).config"
keycloak_exec() { kubectl --namespace keycloak exec "$@"; }
remove_config() {
  keycloak_exec deployment/keycloak --container keycloak -- rm -f -- "$config_file" ||
    echo "keycloak:agent-owner: could not remove $config_file in Keycloak's container" >&2
}
trap remove_config EXIT
trap 'exit 143' TERM INT
keycloak_exec deployment/keycloak --container keycloak -- bash -c 'umask 077 && : >"$0" &&
  KC_CLI_CLIENT_SECRET="$KC_BOOTSTRAP_ADMIN_CLIENT_SECRET" exec '"$kcadm_path"' config credentials --config "$0" \
    --server http://localhost:8080 --realm master --client "$KC_BOOTSTRAP_ADMIN_CLIENT_ID"' "$config_file" >/dev/null ||
  fail "Keycloak cannot be signed in to"
kcadm() { keycloak_exec --stdin deployment/keycloak --container keycloak -- "$kcadm_path" "$@" --config "$config_file"; }
unreadable="Keycloak cannot be read"

CLIENT="$client" yq --exit-status '.clients[] | select(.clientId == strenv(CLIENT) and .serviceAccountsEnabled == true
  and (.defaultClientScopes // [] | contains(["agent-identity"])))' "$realm_file" >/dev/null 2>&1 ||
  fail "$client is no service-account client of realm.yaml with agent-identity among its default scopes"
client_id="$(kcadm get clients --target-realm "$realm" --query "clientId=$client" --fields id --format csv --noquotes)" ||
  fail "$unreadable"
[ -n "$client_id" ] || fail "$realm holds no client $client"
# Keycloak's search leaves out service accounts, and a value in quotes matches a username, email or name exactly, so
# only the entries whose username is the requested one, which Keycloak stores in lowercase, are the person. Another
# user's email or name can match too and a page holds at most 100, so every page is read until a short one.
wanted_username="${username,,}" person_ids="" offset=0
while :; do
  page="$(kcadm get users --target-realm "$realm" --query "search=\"$username\"" --offset "$offset" --limit 100)" ||
    fail "$unreadable"
  matched="$(WANTED="$wanted_username" yq -p json -r '.[] | select(.username == strenv(WANTED)) | .id' <<<"$page")" ||
    fail "$unreadable"
  [ -z "$matched" ] || person_ids+="$matched"$'\n'
  [ "$(yq -p json 'length' <<<"$page")" -ge 100 ] || break
  offset=$((offset + 100))
done
person_count="$(grep -c . <<<"$person_ids" || true)"
[ "$person_count" -gt 0 ] || fail "no person named $username in $realm"
[ "$person_count" = 1 ] || fail "Keycloak returned $person_count users named $username"
person_id="${person_ids%$'\n'}"
account_id="$(kcadm get "clients/$client_id/service-account-user" --target-realm "$realm" --fields id --format csv --noquotes)" ||
  fail "$unreadable"
account="$(kcadm get "users/$account_id" --target-realm "$realm")" || fail "$unreadable"
owner="$(yq -p json '.attributes.agent_owner // [] | join(",")' <<<"$account")"
[ -z "$owner" ] || [ "$owner" = "$person_id" ] || fail "$client's agent_owner names someone else"

changed=false
if [ -z "$owner" ]; then
  attempted+=("agent_owner of $client")
  # The whole representation goes back, so what this run does not set stays as it is.
  USER_ID="$person_id" yq -p json -o json '.attributes.agent_owner = [strenv(USER_ID)]' <<<"$account" |
    kcadm update "users/$account_id" --target-realm "$realm" --file - --no-merge ||
    fail "$client's agent_owner could not be written"
  changed=true
fi
# ensure_member <group path>: adds the person unless already a member.
ensure_member() {
  local group_id member_of
  group_id="$(kcadm get "group-by-path$1" --target-realm "$realm" --fields id --format csv --noquotes)" ||
    fail "$realm holds no $1 or Keycloak cannot be read"
  member_of="$(kcadm get "users/$person_id/groups" --target-realm "$realm" --fields id --format csv --noquotes)" ||
    fail "$unreadable"
  ! grep -qxF "$group_id" <<<"$member_of" || return 0
  attempted+=("$username in $1")
  kcadm update "users/$person_id/groups/$group_id" --target-realm "$realm" --set "realm=$realm" \
    --set "userId=$person_id" --set "groupId=$group_id" --no-merge || fail "$username could not join $1"
  changed=true
}
groups=("$owners_group")
[ "${usage_adder:-false}" != true ] || groups+=("$adders_group")
for group in "${groups[@]}"; do ensure_member "$group"; done

read_back="$(kcadm get "users/$account_id" --target-realm "$realm")" || fail "$unreadable"
[ "$(yq -p json '.attributes.agent_owner // [] | join(",")' <<<"$read_back")" = "$person_id" ] ||
  fail "$client's agent_owner did not read back as $username"
person_groups="$(kcadm get "users/$person_id/groups" --target-realm "$realm" --fields path --format csv --noquotes)" ||
  fail "$unreadable"
for group in "${groups[@]}"; do
  grep -qxF "$group" <<<"$person_groups" || fail "$username did not read back in $group"
done
# member_count <group path>: its members over every page.
member_count() {
  local group_id offset=0 page total=0 page_count
  group_id="$(kcadm get "group-by-path$1" --target-realm "$realm" --fields id --format csv --noquotes)" || return 1
  while page="$(kcadm get "groups/$group_id/members" --target-realm "$realm" --fields id --format csv --noquotes \
    --offset "$offset" --limit 100)"; do
    if [ -z "$page" ]; then echo "$total"; return 0; fi
    page_count="$(grep -c . <<<"$page")"
    total=$((total + page_count))
    offset=$((offset + 100))
  done
  return 1
}
owners_count="$(member_count "$owners_group")" || fail "$unreadable"
adders_count="$(member_count "$adders_group")" || fail "$unreadable"
say "$client's agent_owner is $username; $username is in ${groups[*]}; $owners_group has $owners_count members, $adders_group $adders_count"
[ "$changed" = true ] || say "nothing changed"
'''
